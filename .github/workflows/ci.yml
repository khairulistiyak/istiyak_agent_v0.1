name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p packages/agent-core/tsconfig.json
      - run: npx tsc --noEmit -p packages/agent-memory/tsconfig.json
      - run: npx tsc --noEmit -p packages/agent-tools/tsconfig.json
      - run: npx tsc --noEmit -p apps/desktop/tsconfig.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=verbose 2>/dev/null || echo "No vitest config found"
