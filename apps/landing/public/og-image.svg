<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07080d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12141c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Cyan Glow Circle -->
  <circle cx="600" cy="315" r="300" fill="url(#glowGradient)"/>
  
  <!-- Badge (Top Right) -->
  <rect x="990" y="40" width="170" height="32" rx="16" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1075" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#06b6d4" text-anchor="middle">
    v0.1.0 MVP Live
  </text>
  
  <!-- Robot Icon (Left Side) -->
  <g transform="translate(120, 250)">
    <!-- Robot Head -->
    <rect x="0" y="20" width="80" height="80" rx="8" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <!-- Robot Eyes -->
    <circle cx="25" cy="50" r="8" fill="#06b6d4"/>
    <circle cx="55" cy="50" r="8" fill="#06b6d4"/>
    <!-- Robot Antenna -->
    <line x1="40" y1="20" x2="40" y2="0" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="40" cy="0" r="6" fill="#06b6d4"/>
    <!-- Robot Mouth -->
    <rect x="25" y="70" width="30" height="3" rx="1.5" fill="#06b6d4"/>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    ISTIYAK AI COMPANION
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#06b6d4" text-anchor="middle">
    Your Autonomous AI Software Engineer
  </text>
  
  <!-- Feature Pills -->
  <g transform="translate(300, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
    <text x="90" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#9ca3af" text-anchor="middle">
      Local-First
    </text>
    
    <!-- Pill 2 -->
    <rect x="200" y="0" width="180" height="40" rx="20" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
    <text x="290" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#9ca3af" text-anchor="middle">
      Multi-LLM
    </text>
    
    <!-- Pill 3 -->
    <rect x="400" y="0" width="180" height="40" rx="20" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
    <text x="490" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#9ca3af" text-anchor="middle">
      Sandbox Ready
    </text>
  </g>
  
  <!-- Footer URL -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="middle">
    istiyak.ai
  </text>
</svg>
