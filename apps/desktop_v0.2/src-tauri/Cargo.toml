[package]
name = "desktop_v02"
version = "0.2.0"
description = "Companion Chat UI v0.2 R&D"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_v02_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
