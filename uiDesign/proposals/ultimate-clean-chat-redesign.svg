<svg width="400" height="700" viewBox="0 0 400 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Matte Slate-Black Container -->
  <rect width="400" height="700" rx="16" fill="#070709" stroke="#121215" stroke-width="1"/>

  <!-- ==================== 1. WINDOW HEADER (Top Titlebar) ==================== -->
  <g id="header">
    <rect width="400" height="48" rx="16" fill="#040405" />
    
    <!-- macOS Window Buttons (Red, Yellow, Green) -->
    <circle cx="20" cy="24" r="5" fill="#ff5f56"/>
    <circle cx="34" cy="24" r="5" fill="#ffbd2e"/>
    <circle cx="48" cy="24" r="5" fill="#27c93f"/>

    <!-- Status dot & Companion Title -->
    <circle cx="78" cy="24" r="3" fill="#10b981"/>
    <text x="88" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9.5" fill="#ffffff" letter-spacing="0.5">ISTIYAK COMPANION</text>

    <!-- Header Controls (Right Aligned Icons) -->
    <g stroke="#55555a" stroke-width="1.2" fill="none" transform="translate(245, 15)">
      <!-- Profile Icon -->
      <g transform="translate(0, 0)">
        <circle cx="9" cy="7" r="3" />
        <path d="M 3 15 A 6 6 0 0 1 15 15" />
      </g>
      
      <!-- Telemetry Activity wave -->
      <path d="M 28 10 L 32 10 L 35 4 L 38 14 L 41 8 L 45 10 L 48 10" transform="translate(0, -1)"/>

      <!-- Sparkles icon -->
      <path d="M 64 6 L 66 10 L 70 11 L 66 12 L 64 16 L 62 12 L 58 11 L 62 10 Z" />

      <!-- Columns Split pane -->
      <rect x="82" y="2" width="12" height="12" rx="1.5" />
      <line x1="88" y1="2" x2="88" y2="14" />

      <!-- History Clock -->
      <circle cx="109" cy="8" r="6" />
      <path d="M 109 5 V 8 H 112" />
    </g>
  </g>


  <!-- ==================== 2. CHAT STREAM (Spacious & Bubble-Free) ==================== -->
  <g id="chat-messages" transform="translate(0, 48)">
    
    <!-- User Message 1: "hello" (Right-aligned, minimalist, flat-bubble borderless) -->
    <g transform="translate(15, 30)">
      <!-- Avatar on the right -->
      <circle cx="355" cy="20" r="10" fill="#040405" stroke="#222226" stroke-width="1"/>
      <!-- User symbol inside circle -->
      <circle cx="355" cy="18" r="3" stroke="#88888c" stroke-width="1" fill="none"/>
      <path d="M 349 25 A 6 6 0 0 1 361 25" stroke="#88888c" stroke-width="1" fill="none"/>

      <!-- Message Text Block (Matted bubble with no glow) -->
      <rect x="250" y="4" width="90" height="32" rx="10" fill="#0e0e12" stroke="#1c1c22" stroke-width="1"/>
      <text x="295" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">hello</text>
    </g>

    <!-- Assistant Message 1 -->
    <g transform="translate(15, 95)">
      <!-- Robot Avatar on the left -->
      <circle cx="15" cy="20" r="11" fill="#040405" stroke="#38bdf8" stroke-width="1"/>
      <!-- Robot icon inside circle -->
      <rect x="10" y="15" width="10" height="8" rx="1.5" stroke="#38bdf8" stroke-width="1" fill="none"/>
      <circle cx="13" cy="19" r="1" fill="#38bdf8"/>
      <circle cx="17" cy="19" r="1" fill="#38bdf8"/>
      <line x1="15" y1="15" x2="15" y2="13" stroke="#38bdf8" stroke-width="1"/>

      <!-- Message block (Flat & Borderless, Defined by negative space and soft margin) -->
      <g transform="translate(38, 5)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        <text x="0" y="16" font-size="11" fill="#e2e8f0" font-weight="500">Hello there! How can I help you today?</text>
        
        <!-- Metrics (Spacious and muted, Notion-style) -->
        <text x="0" y="44" font-family="monospace" font-size="9" fill="#55555c" font-weight="normal">cost: $0.000197  |  tokens: 2601 (2591 in / 10 out)</text>
      </g>
    </g>

    <!-- User Message 2: "hello" -->
    <g transform="translate(15, 175)">
      <!-- Avatar on the right -->
      <circle cx="355" cy="20" r="10" fill="#040405" stroke="#222226" stroke-width="1"/>
      <circle cx="355" cy="18" r="3" stroke="#88888c" stroke-width="1" fill="none"/>
      <path d="M 349 25 A 6 6 0 0 1 361 25" stroke="#88888c" stroke-width="1" fill="none"/>

      <!-- Text -->
      <rect x="250" y="4" width="90" height="32" rx="10" fill="#0e0e12" stroke="#1c1c22" stroke-width="1"/>
      <text x="295" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">hello</text>
    </g>

    <!-- Assistant Message 2 -->
    <g transform="translate(15, 240)">
      <!-- Robot Avatar -->
      <circle cx="15" cy="20" r="11" fill="#040405" stroke="#38bdf8" stroke-width="1"/>
      <rect x="10" y="15" width="10" height="8" rx="1.5" stroke="#38bdf8" stroke-width="1" fill="none"/>
      <circle cx="13" cy="19" r="1" fill="#38bdf8"/>
      <circle cx="17" cy="19" r="1" fill="#38bdf8"/>
      <line x1="15" y1="15" x2="15" y2="13" stroke="#38bdf8" stroke-width="1"/>

      <!-- Message block -->
      <g transform="translate(38, 5)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        <text x="0" y="16" font-size="11" fill="#e2e8f0" font-weight="500">Hello! Is there something specific you'd like</text>
        <text x="0" y="32" font-size="11" fill="#e2e8f0" font-weight="500">to discuss or need help with? I'm here and</text>
        <text x="0" y="48" font-size="11" fill="#e2e8f0" font-weight="500">ready to assist!</text>
        
        <!-- Metrics -->
        <text x="0" y="78" font-family="monospace" font-size="9" fill="#55555c" font-weight="normal">cost: $0.000198  |  tokens: 2616 (2601 in / 15 out)</text>
      </g>
    </g>
  </g>


  <!-- ==================== 3. ZEN BOTTOM INPUT BAR ==================== -->
  <g id="input-section" transform="translate(15, 595)">
    <!-- Thin line separator (No thick borders) -->
    <line x1="0" y1="0" x2="370" y2="0" stroke="#14141a" stroke-width="1" />
    
    <!-- Input Box container -->
    <rect y="10" width="370" height="75" rx="8" fill="#040405" stroke="#121215" stroke-width="1" />
    
    <!-- Placeholder Text -->
    <text x="15" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#44444a">Ask ISTIYAK to build code...</text>

    <!-- Divider inside input panel -->
    <line x1="15" y1="46" x2="355" y2="46" stroke="#0e0e12" stroke-width="0.8" />

    <!-- Bottom Controls & Action Bar -->
    <!-- Attachment clip icon -->
    <g stroke="#55555c" stroke-width="1.2" fill="none" transform="translate(15, 52)">
      <path d="M 6 12 L 6 4 A 2.5 2.5 0 0 1 11 4 L 11 11 A 1.5 1.5 0 0 1 8 11 L 8 5" />
    </g>

    <!-- Terminal >_ icon -->
    <g stroke="#55555c" stroke-width="1.2" fill="none" transform="translate(38, 52)">
      <path d="M 2 4 L 6 7 L 2 10" />
      <line x1="8" y1="10" x2="13" y2="10" />
    </g>

    <!-- Settings Gear icon -->
    <g stroke="#55555c" stroke-width="1.2" fill="none" transform="translate(62, 52)">
      <circle cx="8" cy="8" r="3" />
      <path d="M 8 2 L 8 4 M 8 12 L 8 14 M 2 8 H 4 M 12 8 H 14" />
    </g>

    <!-- Send Button (Flat background, clean arrow) -->
    <rect x="330" y="48" width="28" height="26" rx="4" fill="#131720" stroke="#1c212e" stroke-width="1" />
    <path d="M 339 61 L 347 56 L 339 58 Z" fill="#ffffff" />
  </g>
</svg>
