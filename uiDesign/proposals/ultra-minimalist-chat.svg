<svg width="400" height="680" viewBox="0 0 400 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Dark Frame (Ultra Minimalist) -->
  <rect width="400" height="680" rx="16" fill="#08080a" stroke="#121215" stroke-width="1.2"/>

  <!-- ==================== HEADER (Flat, Pitch-Black) ==================== -->
  <rect x="0" y="0" width="400" height="55" rx="16" fill="#050506" stroke="#121215" stroke-width="1"/>
  <!-- Status dot -->
  <circle cx="360" cy="27" r="3" fill="#10b981" />
  <!-- Logo avatar -->
  <circle cx="35" cy="27" r="10" fill="#08080a" stroke="#ffffff" stroke-width="1" />
  <circle cx="35" cy="27" r="3.5" fill="#10b981" />
  <text x="54" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff">Companion Chat</text>
  <text x="180" y="30" font-family="monospace" font-size="8" fill="#10b981" font-weight="bold">[UI]</text>

  <!-- ==================== MESSAGES LIST ==================== -->
  <!-- 1. User Message (Right bubble) -->
  <g transform="translate(40, 75)">
    <rect width="345" height="42" rx="4" fill="#0e0e12" stroke="#18181c" stroke-width="1"/>
    <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#ffffff">Scan project folders, identify tools,</text>
    <text x="12" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#ffffff">and verify the execution workflow.</text>
    <text x="300" y="12" font-family="monospace" font-size="7" fill="#555558" font-weight="bold">USER</text>
  </g>

  <!-- 2. System RAG Context Note (Flat banner) -->
  <g transform="translate(40, 127)">
    <rect width="345" height="28" rx="4" fill="#071512" stroke="#0a3d34" stroke-width="0.8" />
    <text x="10" y="13" font-family="monospace" font-size="8" font-weight="900" fill="#10b981">RAG SEARCH CONTEXT LOOKUP MATCH</text>
    <text x="10" y="21" font-family="monospace" font-size="8" fill="#a7f3d0">Location: packages/agent-core/src/agent/AgentWorkflow.ts</text>
  </g>

  <!-- 3. Assistant Message (Left bubble) -->
  <g transform="translate(15, 165)">
    <!-- Avatar -->
    <circle cx="10" cy="18" r="8" fill="#050506" stroke="#ffffff" stroke-width="1" />
    <circle cx="10" cy="18" r="2.5" fill="#10b981" />

    <!-- Bubble -->
    <rect x="25" y="0" width="345" height="55" rx="4" fill="#0c0c0e" stroke="#141417" stroke-width="1"/>
    <text x="36" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9ca3af">I found the workflow script. I will review the planner core,</text>
    <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9ca3af">check sandbox execution security, and run compiler tests.</text>
    <text x="280" y="11" font-family="monospace" font-size="7.5" fill="#555558" font-weight="bold">COMPANION</text>
  </g>

  <!-- ==================== ACTIVE WORKFLOW STATE CARD ==================== -->
  <g transform="translate(40, 235)">
    <rect width="345" height="135" rx="4" fill="#060607" stroke="#121215" stroke-width="1" />
    <!-- Mini Header -->
    <rect width="345" height="20" rx="4" fill="#121215" opacity="0.5" />
    <text x="10" y="13" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff" opacity="0.6">WORKFLOW EXECUTION CHECKS</text>
    
    <!-- Checklist -->
    <g transform="translate(10, 32)" font-family="monospace" font-size="8.5" fill="#88888c" font-weight="bold">
      <text x="0" y="12" fill="#10b981">✓ [x] Scan workspace directories</text>
      <text x="250" y="12" fill="#444448">0.8s</text>
      
      <text x="0" y="26" fill="#ffffff">⌛ [/] Read target core files</text>
      <text x="250" y="26" fill="#ffffff">ACTIVE</text>
      
      <text x="0" y="40" fill="#444448">☐ [ ] Run terminal compilation test</text>
      <text x="250" y="40" fill="#444448">PENDING</text>
    </g>

    <!-- Clean, Non-glowing progress bar -->
    <g transform="translate(10, 92)">
      <rect width="325" height="3" rx="1.5" fill="#121215" />
      <rect width="195" height="3" rx="1.5" fill="#ffffff" opacity="0.8" />
      <text x="0" y="15" font-family="monospace" font-size="8" fill="#444448">Step 02/03  |  Files changed: 0</text>
      <text x="260" y="15" font-family="monospace" font-size="8" fill="#10b981">Progress: 60%</text>
    </g>
  </g>

  <!-- ==================== RUN PERFORMANCE TELEMETRY CARD ==================== -->
  <g transform="translate(40, 385)">
    <rect width="345" height="110" rx="4" fill="#060607" stroke="#121215" stroke-width="1" />
    <text x="10" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#ffffff" opacity="0.6">METRICS</text>
    
    <!-- Mini progress-style indicators -->
    <g transform="translate(10, 26)" font-family="monospace" font-size="8" fill="#88888c">
      <!-- Metric 1 -->
      <text x="0" y="10">LLM CALLS</text>
      <rect x="90" y="3" width="140" height="4" rx="2" fill="#121215"/>
      <rect x="90" y="3" width="90" height="4" rx="2" fill="#88888c"/>
      <text x="245" y="10" fill="#ffffff">8 queries</text>

      <!-- Metric 2 -->
      <text x="0" y="24">AVG LATENCY</text>
      <rect x="90" y="17" width="140" height="4" rx="2" fill="#121215"/>
      <rect x="90" y="17" width="115" height="4" rx="2" fill="#88888c"/>
      <text x="245" y="24" fill="#ffffff">410ms</text>

      <!-- Metric 3 -->
      <text x="0" y="38">SPEED RATE</text>
      <rect x="90" y="31" width="140" height="4" rx="2" fill="#121215"/>
      <rect x="90" y="31" width="125" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
      <text x="245" y="38" fill="#ffffff">42 t/s</text>

      <!-- Total Cost panel -->
      <rect x="0" y="48" width="325" height="20" rx="2" fill="#08080a" stroke="#121215" stroke-width="0.5"/>
      <text x="8" y="61" fill="#88888c">Cumulative cost: <tspan fill="#10b981">$0.001842 USD</tspan></text>
    </g>
  </g>

  <!-- ==================== PROMPT INPUT FIELD ==================== -->
  <g transform="translate(20, 610)">
    <rect width="360" height="50" rx="6" fill="#050506" stroke="#121215" stroke-width="1"/>
    
    <!-- Clip attachment -->
    <path d="M 23 32 V 18 M 18 25 H 28" stroke="#555558" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Text area placeholder -->
    <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#444448">Send instruction to companion...</text>
    
    <!-- Send Button (Sleek monochrome) -->
    <rect x="325" y="10" width="24" height="26" rx="4" fill="#ffffff" />
    <path d="M 333 22 L 339 17 L 333 19 Z" fill="#08080a" />
  </g>
</svg>
