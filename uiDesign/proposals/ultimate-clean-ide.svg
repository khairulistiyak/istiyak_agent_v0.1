<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Premium Black Canvas -->
  <rect width="1200" height="720" rx="6" fill="#040405"/>

  <!-- ==================== 1. FLAT LEFT SIDEBAR (60px) ==================== -->
  <g id="activity-bar">
    <!-- Defined purely by background contrast, no border lines -->
    <rect x="0" y="0" width="60" height="720" fill="#020202" />
    
    <!-- Active selection indicator -->
    <circle cx="30" cy="45" r="2" fill="#ffffff" />

    <!-- Pure text abbreviations instead of icons -->
    <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      <text x="30" y="32" fill="#ffffff">EXP</text>
      <text x="30" y="92" fill="#3c3c43">SRC</text>
      <text x="30" y="142" fill="#3c3c43">GIT</text>
      <text x="30" y="192" fill="#3c3c43">DB</text>
      <text x="30" y="685" fill="#2c2c30">SET</text>
    </g>
  </g>


  <!-- ==================== 2. SPACIOUS FILE LIST (200px) ==================== -->
  <g id="file-explorer" transform="translate(60, 0)">
    <!-- No border lines, background matches canvas, defined by margins -->
    <rect x="0" y="0" width="200" height="720" fill="#040405" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9" fill="#3a3a3c" letter-spacing="1">WORKSPACE</text>
    
    <g transform="translate(24, 60)" font-family="monospace" font-size="10" font-weight="normal" letter-spacing="0.2">
      <!-- Muted tree list, no icons -->
      <text x="0" y="12" fill="#3a3a3c">apps</text>
      <text x="12" y="30" fill="#3a3a3c">desktop</text>
      <text x="24" y="48" fill="#3a3a3c">src</text>
      <text x="36" y="66" fill="#ffffff" font-weight="bold">ChatUI.tsx</text>
      
      <text x="0" y="90" fill="#3a3a3c">packages</text>
      <text x="12" y="108" fill="#3a3a3c">agent-core</text>
      <text x="0" y="132" fill="#555558">package.json</text>
      <text x="0" y="150" fill="#555558">turbo.json</text>
    </g>
  </g>


  <!-- ==================== 3. ZEN EDITOR PANEL (560px) ==================== -->
  <g id="editor-pane" transform="translate(260, 0)">
    <!-- Defined by a slightly lighter slate background, no border outline -->
    <rect width="560" height="720" fill="#08080a" />
    
    <!-- Flat minimalist tab header -->
    <rect width="560" height="35" fill="#040405" />
    
    <!-- Active tab (Matches editor background) -->
    <rect x="0" y="0" width="110" height="35" fill="#08080a" />
    <text x="20" y="21" font-family="monospace" font-size="9.5" fill="#ffffff" font-weight="bold">ChatUI.tsx</text>
    
    <!-- Inactive tab -->
    <text x="130" y="21" font-family="monospace" font-size="9.5" fill="#3c3c43">AgentWorkflow.ts</text>

    <!-- Monaco Code text (Spacious layout, monochrome with blue cursor) -->
    <g transform="translate(20, 65)" font-family="monospace" font-size="10.5" font-weight="normal" xml:space="preserve" letter-spacing="0.2">
      <!-- Line Numbers (Muted) -->
      <g fill="#2c2c30">
        <text x="0" y="15">10</text>
        <text x="0" y="32">11</text>
        <text x="0" y="49">12</text>
        <text x="0" y="66">13</text>
        <text x="0" y="83">14</text>
        <text x="0" y="100">15</text>
        <text x="0" y="117">16</text>
      </g>

      <!-- Code Block -->
      <g transform="translate(25, 0)">
        <text x="0" y="15" fill="#8e8e93">export default function <tspan fill="#ffffff" font-weight="bold">ChatUI</tspan>() {</text>
        <text x="0" y="32" fill="#8e8e93">  const [status, setStatus] = useState("idle");</text>
        <text x="0" y="49" fill="#8e8e93">  const [cost, setCost] = useState(0.0);</text>
        
        <text x="0" y="83" fill="#8e8e93">  const handleRun = async () =&gt; {</text>
        <text x="0" y="100" fill="#8e8e93">    setStatus("running");</text>
        
        <!-- Active line edit -->
        <text x="0" y="117" fill="#ffffff">    const res = await run</text>
        <line x1="165" y1="107" x2="165" y2="121" stroke="#ffffff" stroke-width="1"/>
      </g>
    </g>

    <!-- Zen Flat Autocomplete Suggestion -->
    <g transform="translate(190, 195)">
      <rect width="210" height="75" fill="#040405" stroke="#121215" stroke-width="1" />
      <rect x="2" y="2" width="206" height="20" fill="#0d0d10" />
      <text x="12" y="15" font-family="monospace" font-size="9" fill="#ffffff" font-weight="bold">runAgent(messages, model)</text>
      <text x="12" y="35" font-family="monospace" font-size="9" fill="#444448">runCommand(command)</text>
      <text x="12" y="55" font-family="monospace" font-size="9" fill="#444448">runnerState</text>
    </g>

    <!-- ==================== 4. BOTTOM TERMINAL ==================== -->
    <g id="bottom-terminal" transform="translate(0, 480)">
      <!-- Panel split defined only by contrast -->
      <rect width="560" height="240" fill="#020202" />
      
      <text x="20" y="22" font-family="monospace" font-size="9" fill="#3c3c43" font-weight="bold">CONSOLE</text>
      
      <g transform="translate(20, 45)" font-family="monospace" font-size="9" fill="#555558" letter-spacing="0.2">
        <text x="0" y="15" fill="#ffffff">istiyak$ <tspan fill="#555558">npm run test</tspan></text>
        <text x="0" y="35" fill="#ffffff">✓ AgentWorkflow.test.ts passed (12.4s)</text>
        <text x="0" y="50" fill="#ffffff">✓ SQLiteMemoryStore.test.ts passed (2.1s)</text>
        <text x="0" y="75" fill="#ffffff">Tests: 8 passed, 8 total</text>
      </g>
    </g>
  </g>


  <!-- ==================== 5. ULTIMATE CLEAN CHAT PANEL (380px) ==================== -->
  <g id="companion-chat" transform="translate(820, 0)">
    <!-- Base matches canvas, no border, separate by negative space -->
    <rect width="380" height="720" fill="#040405" />
    
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9.5" fill="#3a3a3c" letter-spacing="1">COMPANION</text>
    <circle cx="355" cy="26" r="2.5" fill="#10b981" />

    <!-- Chat Messages flowing like a clean document -->
    <g transform="translate(24, 60)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" letter-spacing="0.1">
      
      <!-- User Input Block -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" fill="#555558" font-family="monospace" font-size="8.5" font-weight="bold">YOU</text>
        <text x="0" y="28" fill="#ffffff" font-weight="normal">Increase workflow steps and add assertion check details.</text>
      </g>

      <!-- Assistant Response Block -->
      <g transform="translate(0, 60)">
        <text x="0" y="12" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">COMPANION</text>
        <text x="0" y="28" fill="#88888c">Accessing AgentWorkflow.ts. I will set the step limit to 40</text>
        <text x="0" y="44" fill="#88888c">and integrate validation permission parameters.</text>
      </g>

      <!-- Flat Permission Block -->
      <g transform="translate(0, 130)">
        <rect width="330" height="65" fill="#08080a" stroke="#222" stroke-width="0.5" />
        <text x="12" y="16" font-family="monospace" font-size="8" fill="#ef4444" font-weight="bold">COMMAND RUN REQUEST: npm run test</text>
        
        <!-- Approve / Block text actions -->
        <text x="12" y="44" font-family="monospace" font-size="9" fill="#10b981" font-weight="bold" cursor="pointer">APPROVE</text>
        <text x="80" y="44" font-family="monospace" font-size="9" fill="#555558" font-weight="bold" cursor="pointer">BLOCK</text>
      </g>

      <!-- Clean Plain Text Metrics -->
      <g transform="translate(0, 220)" font-family="monospace" font-size="8.5" fill="#3c3c43">
        <text x="0" y="10">calls: 8 queries</text>
        <text x="0" y="22">latency: 410ms</text>
        <text x="0" y="34">cost: $0.00184 USD</text>
      </g>
    </g>

    <!-- Borderless bottom input prompt -->
    <g id="input-bar" transform="translate(24, 650)">
      <line x1="0" y1="0" x2="330" y2="0" stroke="#121215" stroke-width="0.8"/>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#3c3c43">Write message...</text>
      <!-- Tiny blinking prompt cursor -->
      <line x1="90" y1="13" x2="90" y2="26" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>
</svg>
