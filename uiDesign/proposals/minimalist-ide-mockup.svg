<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Background Colors (Matte Dark/Charcoal) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>

    <!-- UI Accent Colors -->
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Main Matte Dark Frame -->
  <rect width="1200" height="720" rx="12" fill="url(#bg-grad)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- ==================== 1. LEFTMOST ACTIVITY BAR (60px) ==================== -->
  <g id="activity-bar">
    <rect x="0" y="0" width="60" height="720" rx="12" fill="#0b0c10" stroke="#181a20" stroke-width="1"/>
    
    <!-- Active Indicator Bar -->
    <rect x="0" y="32" width="3" height="30" rx="1.5" fill="#38bdf8" />

    <!-- Explorer Icon (Active) -->
    <g transform="translate(18, 35)">
      <path d="M 3 3 H 21 V 21 H 3 Z" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="3" y1="9" x2="21" y2="9" stroke="#f8fafc" stroke-width="1.5"/>
    </g>

    <!-- Search Icon -->
    <g transform="translate(18, 95)" opacity="0.4">
      <circle cx="11" cy="11" r="6" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <line x1="16" y1="16" x2="21" y2="21" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Source Control Icon -->
    <g transform="translate(18, 155)" opacity="0.4">
      <circle cx="8" cy="6" r="2.5" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="8" cy="18" r="2.5" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="16" cy="12" r="2.5" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="8" y1="8.5" x2="8" y2="15.5" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 8 12 Q 13 12 16 12" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Database Icon -->
    <g transform="translate(18, 215)" opacity="0.4">
      <path d="M 6 6 C 6 4 18 4 18 6 L 18 18 C 18 20 6 20 6 18 Z" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <path d="M 6 10 C 6 12 18 12 18 10" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <path d="M 6 14 C 6 16 18 16 18 14" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Bottom Settings Icon -->
    <g transform="translate(20, 675)" opacity="0.3">
      <circle cx="10" cy="10" r="4.5" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <path d="M 10 3 L 10 4.5 M 10 15.5 L 10 17 M 3 10 L 4.5 10 M 15.5 10 L 17 10" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>


  <!-- ==================== 2. MINIMALIST WORKSPACE EXPLORER (200px) ==================== -->
  <g id="file-explorer" transform="translate(60, 0)">
    <rect x="0" y="0" width="200" height="720" fill="#0e1116" stroke="#181a20" stroke-width="1" />
    
    <!-- Explorer Title -->
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-weight="700" font-size="10" fill="#64748b" letter-spacing="0.5">COMPANION WORKSPACE</text>
    
    <!-- Tree Files -->
    <g transform="translate(18, 55)" font-family="monospace" font-size="10.5" font-weight="normal">
      <!-- Folder: apps -->
      <path d="M 5 6 L 9 6 L 12 9 H 18 V 14 H 5 Z" fill="#64748b" opacity="0.7"/>
      <text x="24" y="11" fill="#cbd5e1">apps</text>

      <!-- Subfolder: desktop -->
      <path d="M 12 24 L 14 18 H 22 M 14 24 H 26 V 32 H 14 Z" fill="#64748b" opacity="0.6"/>
      <text x="32" y="29" fill="#cbd5e1">desktop</text>

      <!-- Subfolder: src -->
      <path d="M 22 42 L 24 36 H 32 M 24 42 H 36 V 50 H 24 Z" fill="#64748b" opacity="0.6"/>
      <text x="42" y="47" fill="#cbd5e1">src</text>

      <!-- Active File: ChatUI.tsx -->
      <rect x="34" y="58" width="9" height="11" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <text x="48" y="67" fill="#38bdf8" font-weight="bold">ChatUI.tsx</text>

      <!-- Folder: packages -->
      <path d="M 5 86 L 9 86 L 12 89 H 18 V 94 H 5 Z" fill="#64748b" opacity="0.7"/>
      <text x="24" y="91" fill="#94a3b8">packages</text>

      <!-- Folder: database -->
      <path d="M 5 104 L 9 104 L 12 107 H 18 V 112 H 5 Z" fill="#64748b" opacity="0.7"/>
      <text x="24" y="109" fill="#94a3b8">database</text>

      <!-- File: package.json -->
      <rect x="14" y="122" width="9" height="11" fill="none" stroke="#64748b" stroke-width="1"/>
      <text x="28" y="131" fill="#94a3b8">package.json</text>
    </g>
  </g>


  <!-- ==================== 3. EDITOR PANEL (560px) ==================== -->
  <g id="editor-pane" transform="translate(260, 0)">
    <rect x="0" y="0" width="560" height="720" fill="#0b0d11" stroke="#181a20" stroke-width="1"/>
    
    <!-- Clean Tab bar -->
    <rect x="0" y="0" width="560" height="35" fill="#0e1116" />
    
    <!-- Tab 1: ChatUI.tsx (Active) -->
    <rect x="0" y="0" width="130" height="35" fill="#0b0d11" />
    <rect x="0" y="0" width="130" height="2" fill="#38bdf8" /> <!-- Active Top Line Indicator -->
    <text x="20" y="21" font-family="monospace" font-size="10" font-weight="bold" fill="#f8fafc">ChatUI.tsx</text>
    <path d="M 104 15 L 110 21 M 110 15 L 104 21" stroke="#64748b" stroke-width="1.2"/>

    <!-- Tab 2: AgentWorkflow.ts (Inactive) -->
    <line x1="130" y1="0" x2="130" y2="35" stroke="#181a20" stroke-width="1"/>
    <text x="148" y="21" font-family="monospace" font-size="10" fill="#64748b">AgentWorkflow.ts</text>

    <!-- Monaco Code Window -->
    <g transform="translate(15, 60)" font-family="monospace" font-size="10.5" font-weight="normal" xml:space="preserve">
      <!-- Line Numbers (Muted) -->
      <g fill="#475569" font-weight="normal">
        <text x="0" y="15">10</text>
        <text x="0" y="32">11</text>
        <text x="0" y="49">12</text>
        <text x="0" y="66">13</text>
        <text x="0" y="83">14</text>
        <text x="0" y="100">15</text>
        <text x="0" y="117">16</text>
        <text x="0" y="134">17</text>
        <text x="0" y="151">18</text>
      </g>

      <!-- Code Texts -->
      <g transform="translate(25, 0)">
        <text x="0" y="15" fill="#f43f5e">export default function</text>
        <text x="150" y="15" fill="#60a5fa"> ChatUI() {</text>

        <text x="0" y="32" fill="#f43f5e">  const</text>
        <text x="45" y="32" fill="#e2e8f0"> [status, setStatus] = </text>
        <text x="190" y="32" fill="#60a5fa">useState</text>
        <text x="245" y="32" fill="#e2e8f0">(</text>
        <text x="252" y="32" fill="#34d399">"idle"</text>
        <text x="295" y="32" fill="#e2e8f0">);</text>

        <text x="0" y="49" fill="#f43f5e">  const</text>
        <text x="45" y="49" fill="#e2e8f0"> [cost, setCost] = </text>
        <text x="165" y="49" fill="#60a5fa">useState</text>
        <text x="220" y="49" fill="#cbd5e1">(0.0);</text>

        <text x="0" y="83" fill="#f43f5e">  const</text>
        <text x="45" y="83" fill="#e2e8f0"> handleRun = </text>
        <text x="125" y="83" fill="#f43f5e">async</text>
        <text x="165" y="83" fill="#e2e8f0"> () =&gt; {</text>

        <!-- Current edit cursor line -->
        <text x="0" y="100" fill="#e2e8f0">    setStatus(</text>
        <text x="75" y="100" fill="#34d399">"running"</text>
        <text x="145" y="100" fill="#e2e8f0">);</text>

        <text x="0" y="117" fill="#e2e8f0">    const res = await </text>
        <text x="142" y="117" fill="#60a5fa" font-weight="bold">run</text>
        <!-- Thin, clean cursor line (no heavy glow) -->
        <line x1="165" y1="106" x2="165" y2="120" stroke="#38bdf8" stroke-width="1.5"/>

        <text x="0" y="134" fill="#e2e8f0">    setCost(res.cost);</text>
        <text x="0" y="151" fill="#cbd5e1">  };</text>
      </g>
    </g>

    <!-- Clean, Flat Autocomplete Popup -->
    <g transform="translate(170, 195)">
      <rect width="250" height="120" rx="6" fill="#131720" stroke="#262f3f" stroke-width="1"/>
      
      <!-- List Item 1 (Selected) -->
      <rect x="4" y="4" width="242" height="23" rx="4" fill="#1f2937" />
      <circle cx="15" cy="15" r="3" fill="#34d399" />
      <text x="26" y="18" font-family="monospace" font-size="9.5" font-weight="bold" fill="#34d399">runAgent(messages, model...)</text>
      <text x="210" y="18" font-family="monospace" font-size="8" fill="#64748b">method</text>

      <!-- List Item 2 -->
      <circle cx="15" cy="38" r="3" fill="#38bdf8" />
      <text x="26" y="41" font-family="monospace" font-size="9.5" fill="#cbd5e1">runCommand(command)</text>
      <text x="210" y="41" font-family="monospace" font-size="8" fill="#64748b">method</text>

      <!-- List Item 3 -->
      <circle cx="15" cy="61" r="3" fill="#38bdf8" />
      <text x="26" y="64" font-family="monospace" font-size="9.5" fill="#cbd5e1">runnerState</text>
      <text x="210" y="64" font-family="monospace" font-size="8" fill="#64748b">property</text>

      <!-- Info footer -->
      <line x1="4" y1="100" x2="246" y2="100" stroke="#1f2937" stroke-width="0.8"/>
      <text x="12" y="110" font-family="monospace" font-size="7.5" fill="#64748b">Press Tab to insert method suggestion</text>
    </g>

    <!-- ==================== 4. MINIMAL BOTTOM TERMINAL (Console) ==================== -->
    <g id="bottom-terminal" transform="translate(0, 480)">
      <line x1="0" y1="0" x2="560" y2="0" stroke="#181a20" stroke-width="1.5"/>
      <rect x="0" y="1" width="560" height="239" fill="#080a0f" />
      
      <rect x="0" y="1" width="560" height="25" fill="#0d0f14" />
      <text x="15" y="17" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">TERMINAL CONSOLE</text>
      <text x="475" y="17" font-family="monospace" font-size="8.5" fill="#10b981">● status: ready</text>

      <g transform="translate(15, 42)" font-family="monospace" font-size="9" font-weight="normal" fill="#94a3b8">
        <text x="0" y="15" fill="#60a5fa">istiyak-companion-daemon$ <tspan fill="#ffffff">npm run test</tspan></text>
        <text x="0" y="32">&gt; packages/agent-core:test (jest)</text>
        
        <text x="0" y="52" fill="#34d399">✓ AgentWorkflow.test.ts passed (12.4s)</text>
        <text x="0" y="68" fill="#34d399">✓ SQLiteMemoryStore.test.ts passed (2.1s)</text>
        
        <text x="0" y="90" fill="#e2e8f0" font-weight="bold">Tests: <tspan fill="#34d399">8 passed</tspan>, 8 total</text>
        <text x="0" y="105" fill="#e2e8f0" font-weight="bold">Time:  14.5s</text>
        
        <text x="0" y="130" fill="#38bdf8">istiyak-companion-daemon$ <line x1="160" y1="120" x2="160" y2="131" stroke="#38bdf8" stroke-width="1.5" /></text>
      </g>
    </g>
  </g>


  <!-- ==================== 5. MINIMALIST COMPANION CHAT PANEL (380px) ==================== -->
  <g id="companion-chat" transform="translate(820, 0)">
    <rect x="0" y="0" width="380" height="720" rx="12" fill="#0e1116" stroke="#181a20" stroke-width="1.5" />
    
    <!-- Clean flat header -->
    <rect x="0" y="0" width="380" height="50" rx="12" fill="#0b0c10" stroke="#181a20" stroke-width="1"/>
    <circle cx="28" cy="25" r="9" fill="#0e1117" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="28" cy="25" r="3.5" fill="#34d399" />
    <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-weight="800" font-size="11.5" fill="#f8fafc">Istiyak AI Companion</text>
    
    <!-- Simple online dot -->
    <circle cx="340" cy="25" r="3.5" fill="#34d399" />
    <text x="312" y="28" font-family="monospace" font-size="8.5" fill="#34d399" font-weight="bold">ONLINE</text>

    <!-- Chat Messages list -->
    <g transform="translate(15, 65)">
      <!-- Message 1: User -->
      <g transform="translate(25, 0)">
        <rect width="325" height="42" rx="8" fill="#181f2f" stroke="#212a3e" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#ffffff">Increase workflow steps and add assertion check details.</text>
        <text x="280" y="11" font-family="monospace" font-size="7.5" fill="#64748b" font-weight="bold">USER</text>
      </g>

      <!-- Message 2: Companion -->
      <g transform="translate(0, 57)">
        <!-- Small round avatar -->
        <circle cx="12" cy="18" r="10" fill="#0b0c10" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="12" cy="18" r="3" fill="#34d399" />
        
        <!-- Bubble -->
        <rect x="25" y="0" width="325" height="55" rx="8" fill="#131720" stroke="#1d222e" stroke-width="1"/>
        <text x="38" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#cbd5e1">I found the workflow logic script. I will proceed to</text>
        <text x="38" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#cbd5e1">update maxSteps and integrate permissions check.</text>
        <text x="260" y="11" font-family="monospace" font-size="7.5" fill="#64748b" font-weight="bold">COMPANION</text>
      </g>

      <!-- Clean, Non-Glare Command Approval Card -->
      <g transform="translate(25, 127)">
        <rect width="325" height="85" rx="8" fill="#131720" stroke="#f43f5e" stroke-width="1" opacity="0.9" />
        <rect width="325" height="20" rx="8" fill="#f43f5e" opacity="0.1"/>
        <text x="12" y="14" font-family="monospace" font-size="8.5" font-weight="900" fill="#f43f5e">⚠️ LOCAL SANDBOX COMMAND RUN PERMISSION</text>
        
        <text x="12" y="38" font-family="monospace" font-size="9" fill="#e2e8f0">Command: <tspan fill="#fca5a5" font-weight="bold">npm run test</tspan></text>

        <!-- Buttons -->
        <!-- Approve button -->
        <rect x="12" y="55" width="140" height="20" rx="4" fill="#059669" />
        <text x="36" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#ffffff">Approve (রান করো)</text>

        <!-- Block button -->
        <rect x="165" y="55" width="140" height="20" rx="4" fill="#1e293b" stroke="#374151" stroke-width="1"/>
        <text x="195" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#cbd5e1">Block (রান করিও না)</text>
      </g>

      <!-- Flat Telemetry list (No heavy graphs) -->
      <g transform="translate(25, 227)">
        <rect width="325" height="110" rx="8" fill="#0b0c10" stroke="#1f2937" stroke-width="1" />
        <text x="12" y="18" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">WORKSPACE RUN STATISTICS</text>
        
        <g transform="translate(12, 32)" font-family="monospace" font-size="8.5" fill="#94a3b8">
          <text x="0" y="10">Session calls: <tspan fill="#ffffff">8 queries</tspan></text>
          <text x="0" y="24">Session cost:  <tspan fill="#34d399">$0.00184 USD</tspan></text>
          <text x="0" y="38">Engine latency: <tspan fill="#ffffff">410ms (avg)</tspan></text>
          <text x="0" y="52">RAG accuracy:  <tspan fill="#ffffff">98.5% (semantic match)</tspan></text>
        </g>
        
        <!-- Clean linear horizontal divider -->
        <line x1="12" y1="94" x2="313" y2="94" stroke="#1f2937" stroke-width="0.8"/>
      </g>
    </g>

    <!-- Clean, Flat Prompt Input Area -->
    <g id="input-bar" transform="translate(15, 645)">
      <rect width="350" height="60" rx="10" fill="#0b0c10" stroke="#181a20" stroke-width="1"/>
      
      <!-- Clip attachment -->
      <circle cx="22" cy="30" r="8" fill="#1e293b" />
      <path d="M 20 27 V 33 M 17 30 H 23" stroke="#94a3b8" stroke-width="1.2"/>
      
      <!-- Text input placeholder -->
      <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#4b5563">Type message to companion...</text>

      <!-- Active config tags -->
      <rect x="38" y="38" width="55" height="12" rx="3" fill="#1e293b" />
      <text x="42" y="47" font-family="monospace" font-size="7" fill="#94a3b8">Gemini-2.5</text>

      <rect x="98" y="38" width="45" height="12" rx="3" fill="#1e293b" />
      <text x="102" y="47" font-family="monospace" font-size="7" fill="#34d399">RAG: ON</text>

      <!-- Send button -->
      <rect x="310" y="15" width="28" height="30" rx="6" fill="#38bdf8" />
      <path d="M 319 30 L 327 24 L 319 26 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
