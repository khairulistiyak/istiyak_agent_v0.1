<svg width="400" height="680" viewBox="0 0 400 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Matte Dark Background -->
  <rect width="400" height="680" rx="20" fill="#0e1116" stroke="#1c212b" stroke-width="1.8"/>

  <!-- Subtle flat background grid lines (extremely light) -->
  <g opacity="0.02" stroke="#ffffff" stroke-width="0.8">
    <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250 M 0 300 L 400 300 M 0 350 L 400 350 M 0 400 L 400 400 M 0 450 L 400 450 M 0 500 L 400 500 M 0 550 L 400 550 M 0 600 L 400 600" />
    <path d="M 50 0 L 50 680 M 100 0 L 100 680 M 150 0 L 150 680 M 200 0 L 200 680 M 250 0 L 250 680 M 300 0 L 300 680 M 350 0 L 350 680" />
  </g>

  <!-- ==================== HEADER (Clean, Flat Dark) ==================== -->
  <rect x="0" y="0" width="400" height="60" rx="20" fill="#0b0c10" stroke="#181a20" stroke-width="1"/>
  <!-- Status light dot (Emerald green) -->
  <circle cx="360" cy="30" r="3.5" fill="#10b981" />
  <!-- Logo avatar -->
  <circle cx="35" cy="30" r="11" fill="#0e1116" stroke="#38bdf8" stroke-width="1" />
  <circle cx="35" cy="30" r="4.5" fill="#10b981" />
  <text x="56" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-weight="800" font-size="11.5" fill="#f8fafc">Istiyak AI Companion</text>
  <text x="205" y="33" font-family="monospace" font-size="8" fill="#10b981" font-weight="bold">[UI MODE]</text>

  <!-- ==================== CONVERSATION SCROLL AREA ==================== -->
  <!-- 1. User Message (Right bubble) -->
  <g transform="translate(40, 80)">
    <rect width="345" height="42" rx="8" fill="#181f2f" stroke="#212a3e" stroke-width="1"/>
    <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#ffffff">Scan project folders, identify tools,</text>
    <text x="12" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#ffffff">and verify the execution workflow.</text>
    <text x="300" y="12" font-family="monospace" font-size="7" fill="#64748b" font-weight="bold">USER</text>
  </g>

  <!-- 2. System RAG Context Note (Flat banner) -->
  <g transform="translate(40, 134)">
    <rect width="345" height="30" rx="6" fill="#0e1f1c" stroke="#115e59" stroke-width="0.8" />
    <text x="10" y="14" font-family="monospace" font-size="8" font-weight="900" fill="#10b981">🔍 AUTOMATIC RAG LOOKUP MATCH</text>
    <text x="10" y="23" font-family="monospace" font-size="8" fill="#a7f3d0">Indexed: packages/agent-core/src/agent/AgentWorkflow.ts</text>
  </g>

  <!-- 3. Assistant Message (Left bubble) -->
  <g transform="translate(15, 176)">
    <!-- Avatar -->
    <circle cx="12" cy="18" r="10" fill="#0b0c10" stroke="#38bdf8" stroke-width="1" />
    <circle cx="12" cy="18" r="3.5" fill="#10b981" />

    <!-- Bubble -->
    <rect x="25" y="0" width="345" height="60" rx="8" fill="#131720" stroke="#1d222e" stroke-width="1"/>
    <text x="38" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#cbd5e1">I found the workflow logic script in the workspace.</text>
    <text x="38" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#cbd5e1">I will now perform a plan review, check sandbox</text>
    <text x="38" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#cbd5e1">policies, and compile files step-by-step.</text>
    <text x="280" y="11" font-family="monospace" font-size="7.5" fill="#64748b" font-weight="bold">COMPANION</text>
  </g>

  <!-- ==================== ACTIVE WORKFLOW STATE CARD ==================== -->
  <g transform="translate(40, 250)">
    <rect width="345" height="145" rx="8" fill="#0b0c10" stroke="#1f2937" stroke-width="1" />
    <!-- Mini Header -->
    <rect width="345" height="22" rx="8" fill="#1f2937" opacity="0.4" />
    <text x="12" y="14" font-family="monospace" font-size="8.5" font-weight="900" fill="#38bdf8" letter-spacing="0.5">ACTIVE WORKFLOW EXECUTION</text>
    
    <!-- Checklist -->
    <g transform="translate(12, 38)" font-family="monospace" font-size="8.5" font-weight="bold">
      <!-- Item 1 Done -->
      <text x="0" y="12" fill="#10b981">✓ [x] Scan workspace directories</text>
      <text x="250" y="12" fill="#64748b">0.8s</text>
      
      <!-- Item 2 Active -->
      <text x="0" y="28" fill="#38bdf8">⌛ [/] Read target core files</text>
      <text x="250" y="28" fill="#38bdf8">ACTIVE</text>
      
      <!-- Item 3 Pending -->
      <text x="0" y="44" fill="#94a3b8">☐ [ ] Run terminal compilation test</text>
      <text x="250" y="44" fill="#64748b">PENDING</text>
    </g>

    <!-- Clean, Non-glowing progress bar -->
    <g transform="translate(12, 98)">
      <rect width="320" height="4" rx="2" fill="#1f2937" />
      <rect width="190" height="4" rx="2" fill="#38bdf8" />
      <text x="0" y="16" font-family="monospace" font-size="8" fill="#94a3b8">Step 02/03  |  Files changed: 0</text>
      <text x="260" y="16" font-family="monospace" font-size="8" fill="#10b981">Progress: 60%</text>
    </g>
  </g>

  <!-- ==================== RUN PERFORMANCE TELEMETRY CARD ==================== -->
  <g transform="translate(40, 410)">
    <rect width="345" height="120" rx="8" fill="#0b0c10" stroke="#1f2937" stroke-width="1" />
    <text x="12" y="18" font-family="monospace" font-size="8.5" font-weight="900" fill="#cbd5e1">WORKSPACE METRICS &amp; STATS</text>
    
    <!-- Mini progress-style indicators -->
    <g transform="translate(12, 32)" font-family="monospace" font-size="8" fill="#94a3b8">
      <!-- Metric 1 -->
      <text x="0" y="10">LLM QUERY CALLS</text>
      <rect x="110" y="3" width="130" height="6" rx="3" fill="#1f2937"/>
      <rect x="110" y="3" width="85" height="6" rx="3" fill="#94a3b8"/>
      <text x="255" y="10" fill="#ffffff">8 queries</text>

      <!-- Metric 2 -->
      <text x="0" y="26">AVG LLM LATENCY</text>
      <rect x="110" y="19" width="130" height="6" rx="3" fill="#1f2937"/>
      <rect x="110" y="19" width="105" height="6" rx="3" fill="#94a3b8"/>
      <text x="255" y="26" fill="#ffffff">410ms</text>

      <!-- Metric 3 -->
      <text x="0" y="42">AVG RUN SPEED</text>
      <rect x="110" y="35" width="130" height="6" rx="3" fill="#1f2937"/>
      <rect x="110" y="35" width="115" height="6" rx="3" fill="#38bdf8"/>
      <text x="255" y="42" fill="#38bdf8">42 t/s</text>

      <!-- Total Cost panel -->
      <rect x="0" y="55" width="320" height="20" rx="4" fill="#131720" stroke="#1c212b" stroke-width="0.5"/>
      <text x="8" y="68" fill="#cbd5e1">Cumulative cost: <tspan fill="#10b981">$0.001842 USD</tspan></text>
    </g>
  </g>

  <!-- ==================== PROMPT INPUT FIELD ==================== -->
  <g transform="translate(20, 600)">
    <rect width="360" height="60" rx="10" fill="#0b0c10" stroke="#181a20" stroke-width="1"/>
    
    <!-- Clip attachment -->
    <path d="M 23 37 V 23 M 18 30 H 28" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Text area placeholder -->
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" fill="#4b5563">Type message to companion...</text>
    
    <!-- Active Config Tags -->
    <rect x="42" y="38" width="55" height="12" rx="3" fill="#1e293b" />
    <text x="46" y="47" font-family="monospace" font-size="7" fill="#94a3b8">Gemini-2.5</text>

    <rect x="102" y="38" width="45" height="12" rx="3" fill="#1e293b" />
    <text x="106" y="47" font-family="monospace" font-size="7" fill="#10b981">RAG: ON</text>

    <!-- Send Button (Sleek light blue) -->
    <rect x="315" y="15" width="28" height="30" rx="6" fill="#38bdf8" />
    <path d="M 324 30 L 332 24 L 324 26 Z" fill="#ffffff" />
  </g>
</svg>
