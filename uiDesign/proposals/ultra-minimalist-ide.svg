<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Matte Pitch-Black Background (Ultra Minimalist) -->
  <rect width="1200" height="720" rx="8" fill="#080809" stroke="#17171a" stroke-width="1"/>

  <!-- ==================== 1. FLAT ACTIVITY BAR (60px) ==================== -->
  <g id="activity-bar">
    <rect x="0" y="0" width="60" height="720" fill="#050506" stroke="#121215" stroke-width="1"/>
    
    <!-- Active Icon Highlight (Pure White, No Glow) -->
    <rect x="0" y="32" width="2" height="26" fill="#ffffff" />

    <!-- Explorer (Active) -->
    <g transform="translate(20, 36)" stroke="#ffffff" stroke-width="1.2" fill="none">
      <rect x="0" y="0" width="20" height="18" rx="2" />
      <line x1="0" y1="6" x2="20" y2="6" />
    </g>

    <!-- Search -->
    <g transform="translate(20, 96)" stroke="#555558" stroke-width="1.2" fill="none" opacity="0.8">
      <circle cx="9" cy="9" r="5"/>
      <line x1="13" y1="13" x2="18" y2="18"/>
    </g>

    <!-- Version Control -->
    <g transform="translate(20, 156)" stroke="#555558" stroke-width="1.2" fill="none" opacity="0.8">
      <circle cx="6" cy="5" r="2"/>
      <circle cx="6" cy="15" r="2"/>
      <circle cx="14" cy="10" r="2"/>
      <line x1="6" y1="7" x2="6" y2="13"/>
      <path d="M 6 10 Q 11 10 12 10"/>
    </g>

    <!-- Settings (Bottom) -->
    <g transform="translate(20, 675)" stroke="#333336" stroke-width="1.2" fill="none">
      <circle cx="10" cy="10" r="4"/>
    </g>
  </g>


  <!-- ==================== 2. MONOCHROME FILE LIST (200px) ==================== -->
  <g id="file-explorer" transform="translate(60, 0)">
    <rect x="0" y="0" width="200" height="720" fill="#08080a" stroke="#121215" stroke-width="1" />
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="9.5" fill="#4b5563" letter-spacing="0.5">FILES</text>
    
    <!-- Directory Nodes (Pure Text, No Icons, High Contrast) -->
    <g transform="translate(18, 55)" font-family="monospace" font-size="10" font-weight="normal">
      <text x="0" y="12" fill="#4b5563">▼ apps</text>
      <text x="12" y="30" fill="#4b5563">▼ desktop</text>
      <text x="24" y="48" fill="#4b5563">▼ src</text>
      <text x="36" y="66" fill="#ffffff" font-weight="bold">ChatUI.tsx</text>
      
      <text x="0" y="90" fill="#4b5563">▶ packages</text>
      <text x="0" y="108" fill="#4b5563">▶ database</text>
      <text x="0" y="126" fill="#88888c">package.json</text>
      <text x="0" y="144" fill="#88888c">turbo.json</text>
    </g>
  </g>


  <!-- ==================== 3. FLAT CODE EDITOR (560px) ==================== -->
  <g id="editor-pane" transform="translate(260, 0)">
    <rect x="0" y="0" width="560" height="720" fill="#060607" stroke="#121215" stroke-width="1"/>
    
    <!-- Minimalist Tab Header -->
    <rect x="0" y="0" width="560" height="32" fill="#08080a" />
    
    <!-- Tab 1: Active -->
    <rect x="0" y="0" width="120" height="32" fill="#060607" />
    <rect x="0" y="0" width="120" height="1.5" fill="#ffffff" />
    <text x="16" y="19" font-family="monospace" font-size="9.5" fill="#ffffff" font-weight="bold">ChatUI.tsx</text>
    <path d="M 96 14 L 102 20 M 102 14 L 96 20" stroke="#555558" stroke-width="1"/>

    <!-- Tab 2: Inactive -->
    <line x1="120" y1="0" x2="120" y2="32" stroke="#121215" stroke-width="1"/>
    <text x="136" y="19" font-family="monospace" font-size="9.5" fill="#555558">AgentWorkflow.ts</text>

    <!-- Editor Lines -->
    <g transform="translate(15, 55)" font-family="monospace" font-size="10" font-weight="normal" xml:space="preserve">
      <!-- Line Numbers (Muted Grey) -->
      <g fill="#333336">
        <text x="0" y="15">10</text>
        <text x="0" y="30">11</text>
        <text x="0" y="45">12</text>
        <text x="0" y="60">13</text>
        <text x="0" y="75">14</text>
        <text x="0" y="90">15</text>
        <text x="0" y="105">16</text>
        <text x="0" y="120">17</text>
      </g>

      <!-- Code Text (Subtle white/gray syntax) -->
      <g transform="translate(25, 0)">
        <text x="0" y="15" fill="#e5e7eb">export default function <tspan fill="#60a5fa">ChatUI</tspan>() {</text>

        <text x="0" y="30" fill="#e5e7eb">  const [status, setStatus] = <tspan fill="#60a5fa">useState</tspan>(<tspan fill="#9ca3af">"idle"</tspan>);</text>
        <text x="0" y="45" fill="#e5e7eb">  const [cost, setCost] = <tspan fill="#60a5fa">useState</tspan>(0.0);</text>

        <text x="0" y="75" fill="#e5e7eb">  const handleRun = async () => {</text>
        <text x="0" y="90" fill="#e5e7eb">    setStatus(<tspan fill="#9ca3af">"running"</tspan>);</text>

        <!-- Cursor line -->
        <text x="0" y="105" fill="#e5e7eb">    const res = await <tspan fill="#ffffff" font-weight="bold">run</tspan></text>
        <line x1="162" y1="96" x2="162" y2="108" stroke="#ffffff" stroke-width="1.2"/>

        <text x="0" y="120" fill="#e5e7eb">    setCost(res.cost);</text>
      </g>
    </g>

    <!-- Ultra-Minimal Autocomplete Box -->
    <g transform="translate(170, 175)">
      <rect width="240" height="95" fill="#08080a" stroke="#1a1a1c" stroke-width="1"/>
      
      <!-- Selected -->
      <rect x="2" y="2" width="236" height="20" fill="#131316" />
      <text x="12" y="15" font-family="monospace" font-size="9" fill="#ffffff" font-weight="bold">runAgent(messages, model...)</text>
      
      <!-- Option 2 -->
      <text x="12" y="36" font-family="monospace" font-size="9" fill="#88888c">runCommand(command)</text>
      
      <!-- Option 3 -->
      <text x="12" y="56" font-family="monospace" font-size="9" fill="#88888c">runnerState</text>

      <line x1="2" y1="76" x2="238" y2="76" stroke="#121215" stroke-width="0.8"/>
      <text x="8" y="86" font-family="monospace" font-size="7.5" fill="#444448">Tab to insert suggestion</text>
    </g>

    <!-- ==================== 4. FLAT TERMINAL CONSOLE ==================== -->
    <g id="bottom-terminal" transform="translate(0, 480)">
      <line x1="0" y1="0" x2="560" y2="0" stroke="#121215" stroke-width="1"/>
      <rect x="0" y="1" width="560" height="239" fill="#040405" />
      
      <rect x="0" y="1" width="560" height="25" fill="#08080a" />
      <text x="15" y="17" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" opacity="0.6">TERMINAL</text>

      <g transform="translate(15, 42)" font-family="monospace" font-size="9" fill="#88888c">
        <text x="0" y="15" fill="#ffffff">istiyak-daemon$ <tspan fill="#88888c">npm run test</tspan></text>
        <text x="0" y="32">Running test suite packages/agent-core:test...</text>
        
        <text x="0" y="52" fill="#ffffff">✓ AgentWorkflow.test.ts (12.4s)</text>
        <text x="0" y="68" fill="#ffffff">✓ SQLiteMemoryStore.test.ts (2.1s)</text>
        
        <text x="0" y="90" fill="#ffffff">Tests: 8 passed, 8 total</text>
        <text x="0" y="110">istiyak-daemon$ <line x1="110" y1="101" x2="110" y2="111" stroke="#ffffff" stroke-width="1" /></text>
      </g>
    </g>
  </g>


  <!-- ==================== 5. ULTRA-MINIMALIST COMPANION CHAT PANEL (380px) ==================== -->
  <g id="companion-chat" transform="translate(820, 0)">
    <rect x="0" y="0" width="380" height="720" fill="#08080a" stroke="#121215" stroke-width="1" />
    
    <!-- Flat Header -->
    <rect x="0" y="0" width="380" height="50" fill="#050506" stroke="#121215" stroke-width="1"/>
    <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff">Companion Chat</text>
    <circle cx="355" cy="25" r="3" fill="#10b981" />
    <text x="316" y="28" font-family="monospace" font-size="8.5" fill="#10b981" font-weight="bold">ONLINE</text>

    <!-- Chat Messages list -->
    <g transform="translate(15, 65)">
      <!-- Message 1: User -->
      <g transform="translate(30, 0)">
        <rect width="320" height="35" rx="4" fill="#0e0e12" stroke="#18181c" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#e5e7eb">Increase max steps and check assertion details.</text>
      </g>

      <!-- Message 2: Companion -->
      <g transform="translate(0, 50)">
        <!-- Clean Text block without heavy borders -->
        <rect width="350" height="50" rx="4" fill="#0c0c0e" stroke="#141417" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9ca3af">I've accessed AgentWorkflow.ts. I will modify the steps count</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#9ca3af">limit and integrate security checks.</text>
      </g>

      <!-- Flat Permission Request Block -->
      <g transform="translate(0, 115)">
        <rect width="350" height="75" rx="4" fill="#0f090a" stroke="#ef4444" stroke-width="0.8" />
        <text x="12" y="16" font-family="monospace" font-size="8" font-weight="900" fill="#ef4444">PERMISSION: EXECUTE LOCAL TERMINAL COMMAND</text>
        <text x="12" y="32" font-family="monospace" font-size="9" fill="#e5e7eb">Command: npm run test</text>

        <!-- Clean Flat buttons -->
        <rect x="12" y="46" width="155" height="18" rx="2" fill="#047857" />
        <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff">Approve</text>

        <rect x="180" y="46" width="155" height="18" rx="2" fill="#1b1b1f" stroke="#2a2a2e" stroke-width="1"/>
        <text x="240" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="bold" fill="#9ca3af">Block</text>
      </g>

      <!-- Flat Telemetry list -->
      <g transform="translate(0, 205)">
        <rect width="350" height="85" rx="4" fill="#060607" stroke="#121215" stroke-width="1" />
        <text x="12" y="16" font-family="monospace" font-size="8.5" font-weight="bold" fill="#ffffff" opacity="0.6">METRICS</text>
        <g transform="translate(12, 28)" font-family="monospace" font-size="8.5" fill="#88888c">
          <text x="0" y="10">Calls logged: <tspan fill="#ffffff">8 queries</tspan></text>
          <text x="0" y="24">Latency:     <tspan fill="#ffffff">410ms</tspan></text>
          <text x="0" y="38">Cost tracker: <tspan fill="#10b981">$0.00184 USD</tspan></text>
        </g>
      </g>
    </g>

    <!-- Flat input bar -->
    <g id="input-bar" transform="translate(15, 655)">
      <rect width="350" height="50" rx="6" fill="#050506" stroke="#121215" stroke-width="1"/>
      <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#444448">Send instruction to companion...</text>
      
      <!-- Send arrow -->
      <rect x="315" y="12" width="24" height="24" rx="4" fill="#ffffff" />
      <path d="M 323 24 L 329 19 L 323 21 Z" fill="#08080a" />
    </g>
  </g>
</svg>
