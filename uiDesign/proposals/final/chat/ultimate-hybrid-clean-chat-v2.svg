<svg width="400" height="720" viewBox="0 0 400 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Seamless Matte Dark Background (V2 Premium Zen Theme) -->
  <rect width="400" height="720" rx="16" fill="#08090a" stroke="#16181d" stroke-width="1"/>

  <!-- ==================== 1. SEAMLESS TITLE BAR ==================== -->
  <!-- Title bar blends directly into the background without a solid separator card -->
  <g id="header">
    <!-- macOS Window controls (Subtle Flat Dark Gray) -->
    <circle cx="20" cy="24" r="4.5" fill="#22242a"/>
    <circle cx="34" cy="24" r="4.5" fill="#22242a"/>
    <circle cx="48" cy="24" r="4.5" fill="#22242a"/>

    <!-- App Title & Status -->
    <circle cx="78" cy="24" r="2" fill="#10b981"/>
    <text x="88" y="27.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" fill="#88888c" letter-spacing="1">ISTIYAK COMPANION</text>

    <!-- Header Actions (Zinc-700 subtle outline shapes) -->
    <g stroke="#44444a" stroke-width="1.2" fill="none" transform="translate(295, 16)">
      <!-- User profile -->
      <g transform="translate(0, 0)">
        <circle cx="7.5" cy="6" r="2.5" />
        <path d="M 2.5 12.5 A 5 5 0 0 1 12.5 12.5" />
      </g>
      
      <!-- Settings Gear -->
      <g transform="translate(26, 0)">
        <circle cx="7.5" cy="6.5" r="2.5" />
        <path d="M 7.5 1.5 V 3.5 M 7.5 9.5 V 11.5 M 2.5 6.5 H 4.5 M 10.5 6.5 H 12.5" />
        <path d="M 4 3 L 5.5 4.5 M 11 10 L 9.5 8.5 M 4 10 L 5.5 8.5 M 11 3 L 9.5 4.5" />
      </g>

      <!-- History Clock -->
      <g transform="translate(52, 0)">
        <circle cx="7.5" cy="6.5" r="5" />
        <path d="M 7.5 4 V 6.5 H 10" />
      </g>
    </g>
  </g>


  <!-- ==================== 2. CHAT STREAM (Sleek, Minimalist Zen Layout) ==================== -->
  <g id="chat-messages" transform="translate(0, 48)">
    
    <!-- User Message 1: "hello" (Thin-bordered soft gray bubble) -->
    <g transform="translate(15, 20)">
      <rect x="255" y="4" width="115" height="32" rx="8" fill="#121316" stroke="#1c1e24" stroke-width="1"/>
      <text x="312.5" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">hello</text>
    </g>

    <!-- Assistant Message 1: "Hello there..." (Clean alignment, muted headers) -->
    <g transform="translate(15, 75)">
      <g transform="translate(0, 5)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        <text x="0" y="14" font-family="monospace" font-size="8" fill="#44444a" font-weight="bold" letter-spacing="1">COMPANION</text>
        <text x="0" y="32" font-size="11" fill="#d1d5db" font-weight="500">Hello there! How can I help you today?</text>
        
        <!-- Cost statistics -->
        <text x="0" y="52" font-family="monospace" font-size="8" fill="#44444a">cost: $0.000154  |  tokens: 2314 (2304 in / 10 out)</text>
      </g>
    </g>

    <!-- User Message 2: "hello" -->
    <g transform="translate(15, 155)">
      <rect x="255" y="4" width="115" height="32" rx="8" fill="#121316" stroke="#1c1e24" stroke-width="1"/>
      <text x="312.5" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">hello</text>
    </g>

    <!-- Assistant Message 2: "Hello! Is there something specific..." -->
    <g transform="translate(15, 210)">
      <g transform="translate(0, 5)" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        <text x="0" y="14" font-family="monospace" font-size="8" fill="#44444a" font-weight="bold" letter-spacing="1">COMPANION</text>
        <text x="0" y="32" font-size="11" fill="#d1d5db" font-weight="500">Hello! Is there something specific you'd like to discuss</text>
        <text x="0" y="48" font-size="11" fill="#d1d5db" font-weight="500">or need help with? I'm here and ready to assist!</text>
        
        <!-- Cost statistics -->
        <text x="0" y="68" font-family="monospace" font-size="8" fill="#44444a">cost: $0.000155  |  tokens: 2329 (2314 in / 15 out)</text>
      </g>
    </g>

    <!-- ==================== 3. ACTIVE WORKFLOW PANEL (V2 Accent-Line Design) ==================== -->
    <!-- Borderless elegant panel with a flat unified look -->
    <g transform="translate(15, 320)">
      <!-- Panel box background -->
      <rect width="370" height="110" rx="8" fill="#0b0c0e" />

      <!-- Title Header -->
      <text x="16" y="16" font-family="monospace" font-size="8" font-weight="bold" fill="#44444a" letter-spacing="1">ACTIVE WORKFLOW EXECUTION</text>

      <!-- Minimalist Checklist with color status indicators -->
      <g transform="translate(16, 32)" font-family="monospace" font-weight="bold" font-size="8">
        <!-- Success Step: green dot -->
        <circle cx="4" cy="5" r="2.5" fill="#10b981"/>
        <text x="14" y="8" fill="#10b981">Scan workspace directories</text>
        <text x="264" y="8" fill="#44444a">0.8s</text>
        
        <!-- Active Step: pulsing slate blue dot -->
        <circle cx="4" cy="21" r="2.5" fill="#5f8aa8"/>
        <text x="14" y="24" fill="#d1d5db">Read target core files</text>
        <text x="264" y="24" fill="#5f8aa8">ACTIVE</text>
        
        <!-- Pending Step: dark muted dot -->
        <circle cx="4" cy="37" r="2.5" fill="#22242a"/>
        <text x="14" y="40" fill="#44444a">Run terminal compilation test</text>
      </g>

      <!-- Bottom Progress bar (1px thin line) and metrics -->
      <g transform="translate(16, 92)">
        <rect width="338" height="1" fill="#1c1e24" />
        <rect width="202" height="1" fill="#ffffff" opacity="0.6" />
        <text x="0" y="10" font-family="monospace" font-size="7.5" fill="#44444a">02/03 • 60% completed</text>
      </g>
    </g>
  </g>


  <!-- ==================== 4. BOTTOM INPUT BAR ==================== -->
  <g id="input-section" transform="translate(15, 615)">
    <!-- Thin line separator -->
    <line x1="0" y1="0" x2="370" y2="0" stroke="#16181d" stroke-width="1" />
    
    <!-- Input Box container (slightly highlighted for subtle contrast) -->
    <rect y="10" width="370" height="75" rx="10" fill="#121318" stroke="#1f232b" stroke-width="1" />
    
    <!-- Placeholder Text -->
    <text x="15" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#44444a">Ask companion anything...</text>

    <!-- Bottom Controls & Action Bar -->
    <!-- Attachment clip icon -->
    <g stroke="#44444a" stroke-width="1.2" fill="none" transform="translate(15, 52)">
      <path d="M 6 12 L 6 4 A 2.5 2.5 0 0 1 11 4 L 11 11 A 1.5 1.5 0 0 1 8 11 L 8 5" />
    </g>

    <!-- Terminal >_ icon -->
    <g stroke="#44444a" stroke-width="1.2" fill="none" transform="translate(38, 52)">
      <path d="M 2 4 L 6 7 L 2 10" />
      <line x1="8" y1="10" x2="13" y2="10" />
    </g>

    <!-- Settings Gear icon -->
    <g stroke="#44444a" stroke-width="1.2" fill="none" transform="translate(62, 52)">
      <circle cx="8" cy="8" r="3" />
      <path d="M 8 2 L 8 4 M 8 12 L 8 14 M 2 8 H 4 M 12 8 H 14" />
    </g>

    <!-- Send Button (Clean V2 matching user bubble background) -->
    <rect x="330" y="48" width="28" height="26" rx="4" fill="#15171c" stroke="#1c1e24" stroke-width="1" />
    <path d="M 339 61 L 347 56 L 339 58 Z" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
