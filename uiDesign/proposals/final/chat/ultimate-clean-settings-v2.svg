<svg width="400" height="820" viewBox="0 0 400 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Matte Pitch-Black Background (Zen Theme V2) -->
  <rect width="400" height="820" rx="16" fill="#08090a" stroke="#16181d" stroke-width="1"/>

  <!-- ==================== 1. SETTINGS HEADER ==================== -->
  <g id="header">
    <!-- Seamless transparent header bar matching main panel background -->
    
    <!-- Centered Title -->
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" fill="#88888c" letter-spacing="1">SETTINGS</text>

    <!-- Close Button (Far Right Corner) -->
    <g cursor="pointer" id="close-btn" transform="translate(355, 20)">
      <!-- Hitbox -->
      <rect x="-10" y="-10" width="30" height="30" fill="transparent" />
      <path d="M 0 0 L 12 12 M 12 0 L 0 12" stroke="#44444a" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>


  <!-- ==================== 2. TWO MASTER FOLDERS (Layout) ==================== -->
  <g id="settings-folders" transform="translate(24, 80)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    
    <!-- ==================== FOLDER 1: MODEL ENGINE CONFIG (Open) ==================== -->
    <g id="folder-model-engine">
      <!-- Folder Header -->
      <text x="16" y="15" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">▼  MODEL ENGINE CONFIG</text>
      
      <!-- Content (Indented) -->
      <g transform="translate(18, 30)" font-size="10" font-weight="normal" fill="#88888c">
        <!-- LLM Provider -->
        <text x="0" y="12" fill="#44444a" font-weight="bold">Provider</text>
        <rect x="0" y="20" width="310" height="24" rx="4" fill="#121318" stroke="#1f232b" stroke-width="1" />
        <text x="12" y="35" fill="#d1d5db">Google Gemini</text>
        <path d="M 285 30 L 290 35 L 295 30" stroke="#44444a" stroke-width="1.2" fill="none" />

        <!-- Model Selection -->
        <text x="0" y="64" fill="#44444a" font-weight="bold">Selected Model</text>
        <rect x="0" y="72" width="310" height="24" rx="4" fill="#121318" stroke="#1f232b" stroke-width="1" />
        <text x="12" y="87" fill="#d1d5db">Gemini 2.5 Pro</text>
        <path d="M 285 82 L 290 87 L 295 82" stroke="#44444a" stroke-width="1.2" fill="none" />

        <!-- Auth Method -->
        <text x="0" y="116" fill="#44444a" font-weight="bold">Authentication</text>
        <rect x="0" y="124" width="310" height="24" rx="4" fill="#121318" stroke="#1f232b" stroke-width="1" />
        <text x="12" y="139" fill="#d1d5db">API Key</text>
        <path d="M 285 134 L 290 139 L 295 134" stroke="#44444a" stroke-width="1.2" fill="none" />

        <!-- API Key Input -->
        <text x="0" y="168" fill="#44444a" font-weight="bold">API Key Value</text>
        <rect x="0" y="176" width="310" height="24" rx="4" fill="#121318" stroke="#1f232b" stroke-width="1" />
        <text x="12" y="191" fill="#44444a" font-family="monospace" letter-spacing="1">••••••••••••••••••••••••</text>
      </g>
    </g>


    <!-- ==================== FOLDER 2: SYSTEM PREFERENCES & UTILITIES (Open) ==================== -->
    <g id="folder-system-prefs" transform="translate(0, 260)">
      <!-- Folder Header -->
      <text x="16" y="15" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">▼  SYSTEM PREFERENCES &amp; UTILITIES</text>
      
      <!-- Content (Indented) -->
      <g transform="translate(18, 30)" font-size="10" font-weight="normal" fill="#88888c">
        
        <!-- Google Search Integration -->
        <g transform="translate(0, 0)">
          <text x="0" y="12" fill="#d1d5db" font-weight="bold">Enable Google Search</text>
          <!-- Flat Slide Toggle (Active) -->
          <rect x="260" y="2" width="28" height="12" rx="6" fill="#10b981" opacity="0.3"/>
          <circle cx="282" cy="8" r="5.5" fill="#10b981" />
        </g>

        <!-- CLI Docker Sandbox -->
        <g transform="translate(0, 30)">
          <text x="0" y="12" fill="#d1d5db" font-weight="bold">CLI Docker Sandbox</text>
          <text x="0" y="22" font-size="8" fill="#44444a">Executes terminal tasks in local isolated container</text>
          <!-- Flat Slide Toggle (Active) -->
          <rect x="260" y="2" width="28" height="12" rx="6" fill="#10b981" opacity="0.3"/>
          <circle cx="282" cy="8" r="5.5" fill="#10b981" />
        </g>

        <!-- Cloud Sandbox (Pro) -->
        <g transform="translate(0, 70)">
          <text x="0" y="12" fill="#44444a" font-weight="bold">SaaS Cloud Sandbox (Pro)</text>
          <!-- Flat Slide Toggle (Inactive) -->
          <rect x="260" y="2" width="28" height="12" rx="6" fill="#1c1e24" />
          <circle cx="266" cy="8" r="5.5" fill="#44444a" />
        </g>

        <!-- Full IDE Split Mode (Relocated) -->
        <g transform="translate(0, 105)">
          <text x="0" y="12" fill="#d1d5db" font-weight="bold">Full IDE Mode</text>
          <text x="0" y="22" font-size="8" fill="#44444a">Enable split pane file explorer and editor layout</text>
          <!-- Flat Slide Toggle (Inactive) -->
          <rect x="260" y="2" width="28" height="12" rx="6" fill="#1c1e24" />
          <circle cx="266" cy="8" r="5.5" fill="#44444a" />
        </g>

        <!-- Live Telemetry & Dashboard (Relocated) -->
        <g transform="translate(0, 140)">
          <text x="0" y="12" fill="#d1d5db" font-weight="bold">Telemetry &amp; Cost</text>
          <text x="0" y="22" font-size="8" fill="#44444a">View metrics and real-time usage cost dashboard</text>
          <!-- Action button -->
          <rect x="230" y="2" width="80" height="16" rx="2" fill="#15171c" stroke="#1c1e24" stroke-width="1" />
          <text x="270" y="13" fill="#ffffff" text-anchor="middle" font-size="8" font-weight="bold" cursor="pointer">OPEN CHART</text>
        </g>

        <!-- Marketplace & Extensions (Relocated) -->
        <g transform="translate(0, 175)">
          <text x="0" y="12" fill="#d1d5db" font-weight="bold">Marketplace &amp; Plugins</text>
          <text x="0" y="22" font-size="8" fill="#44444a">Browse and install helper extensions and customizations</text>
          <!-- Action button -->
          <rect x="230" y="2" width="80" height="16" rx="2" fill="#15171c" stroke="#1c1e24" stroke-width="1" />
          <text x="270" y="13" fill="#ffffff" text-anchor="middle" font-size="8" font-weight="bold" cursor="pointer">BROWSE</text>
        </g>

        <!-- Workspace Context (Branch & Reindex) -->
        <g transform="translate(0, 215)">
          <text x="0" y="12" fill="#44444a" font-weight="bold">Git Repository Branch</text>
          <text x="140" y="12" fill="#d1d5db" font-family="monospace" font-weight="bold">main</text>
          
          <!-- Reindex Button (Flat Zen Action) -->
          <rect x="0" y="24" width="310" height="24" rx="4" fill="#15171c" stroke="#1c1e24" stroke-width="1" />
          <text x="155" y="39" fill="#ffffff" text-anchor="middle" font-weight="bold">REINDEX WORKSPACE CODEBASE</text>
        </g>

        <!-- User account information -->
        <g transform="translate(0, 285)">
          <text x="0" y="12" fill="#44444a" font-weight="bold">Active Account</text>
          <text x="90" y="12" fill="#d1d5db">user@example.com</text>
          
          <rect x="260" y="2" width="50" height="16" rx="2" fill="#1c1012" stroke="#ef4444" stroke-width="0.8" />
          <text x="285" y="13" fill="#ef4444" text-anchor="middle" font-size="8.5" font-weight="bold" cursor="pointer">LOGOUT</text>
        </g>

        <!-- Workspace TODOs tasks -->
        <g transform="translate(0, 325)">
          <text x="0" y="12" fill="#ffffff" font-weight="bold">Workspace TODO comments (2)</text>
          
          <!-- Todo Item 1 -->
          <g transform="translate(0, 24)">
            <text x="0" y="10" fill="#88888c">☐ resolve signature in <tspan fill="#5f8aa8">CreateDirectoryTool.ts</tspan></text>
            <text x="290" y="10" fill="#44444a" text-anchor="end">line 12</text>
          </g>

          <!-- Todo Item 2 -->
          <g transform="translate(0, 42)">
            <text x="0" y="10" fill="#88888c">☐ clean package imports in <tspan fill="#5f8aa8">promptBuilder.ts</tspan></text>
            <text x="290" y="10" fill="#44444a" text-anchor="end">line 4</text>
          </g>
        </g>

      </g>
    </g>

  </g>
</svg>
