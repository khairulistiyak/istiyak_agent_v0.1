<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sci-fi Futuristic Dark Gradients & Neon Colors -->
    <linearGradient id="scifi-bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020305"/>
      <stop offset="50%" stop-color="#05070e"/>
      <stop offset="100%" stop-color="#010203"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ab7df8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="neon-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff7f00"/>
    </linearGradient>
    
    <!-- Pattern for Grid Background -->
    <pattern id="hud-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f172a" stroke-width="0.5" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Filters for Intense Neon Glows -->
    <filter id="cyan-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="purple-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="amber-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .font-mono { font-family: "Fira Code", "SF Mono", Consolas, monospace; }
      
      .text-title { font-weight: 800; fill: #ffffff; font-size: 13px; letter-spacing: 0.1em; }
      .text-label { font-weight: 600; fill: #64748b; font-size: 9px; letter-spacing: 0.12em; }
      .text-bright { font-weight: 500; fill: #f1f5f9; font-size: 12px; }
      .text-muted { font-weight: 400; fill: #475569; font-size: 11px; }
      .text-code { font-weight: 400; fill: #cbd5e1; font-size: 10.5px; }

      .pulse { animation: glow-blink 3s infinite ease-in-out; }
      @keyframes glow-blink {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" rx="16" fill="url(#scifi-bg)"/>
  <!-- Holographic Grid Overlay -->
  <rect width="1200" height="800" fill="url(#hud-grid)" rx="16"/>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="15.5" stroke="#1e293b" stroke-opacity="0.5"/>

  <!-- ==================== HEADER BAR (Sci-fi HUD Console) ==================== -->
  <g transform="translate(40, 24)">
    <rect width="1120" height="48" rx="6" fill="#040612" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.8"/>
    
    <!-- macOS style buttons -->
    <circle cx="20" cy="24" r="5" fill="#ef4444"/>
    <circle cx="36" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="24" r="5" fill="#10b981"/>

    <!-- Breadcrumb HUD -->
    <g transform="translate(80, 14)">
      <!-- Pulsing Brand hexagon -->
      <polygon points="4,0 12,0 16,7 12,14 4,14 0,7" fill="url(#neon-cyan)" class="pulse"/>
      <text x="24" y="12" class="font-sans text-title">COPILOT COCKPIT</text>
      <text x="175" y="11" class="font-sans text-label">CORE_ENG_V3.0</text>
    </g>

    <!-- Global Telemetry Status -->
    <g transform="translate(680, 14)">
      <text x="0" y="11" class="font-sans text-label">ACTIVE PIPELINE</text>
      <text x="0" y="24" class="font-sans text-bright" font-weight="bold" fill="#00f3ff">IndexedDB Migration</text>
      
      <text x="180" y="11" class="font-sans text-label">LLM ENGINE</text>
      <text x="180" y="24" class="font-sans text-bright" font-weight="bold" fill="#ab7df8">Gemini 3.5 Flash</text>

      <text x="320" y="11" class="font-sans text-label">LATENCY</text>
      <text x="320" y="24" class="font-sans text-bright" font-weight="bold" fill="#10b981">180ms</text>
      
      <circle cx="410" cy="18" r="4.5" fill="#10b981"/>
    </g>
  </g>

  <!-- ==================== LEFT SIDEBAR: HUD CONTROLLER & DIAGNOSTICS ==================== -->
  <g transform="translate(40, 88)">
    <rect width="240" height="672" rx="8" fill="#040612" fill-opacity="0.85" stroke="#1e293b" stroke-width="0.75"/>
    
    <!-- Title Section -->
    <g transform="translate(16, 20)">
      <text x="0" y="12" class="font-sans text-label">PIPELINE MONITOR</text>
      <line x1="0" y1="20" x2="208" y2="20" stroke="#1e293b" stroke-opacity="0.5"/>
    </g>

    <!-- Radial Progress Charts (Futuristic Dial) -->
    <g transform="translate(16, 60)">
      <!-- CPU Load Dial -->
      <g transform="translate(0, 0)">
        <circle cx="40" cy="40" r="30" fill="none" stroke="#0f172a" stroke-width="6"/>
        <!-- 72% progress arc -->
        <path d="M 40,10 A 30,30 0 1,1 11.48,30" fill="none" stroke="url(#neon-cyan)" stroke-width="6" stroke-linecap="round" filter="url(#cyan-glow)"/>
        <text x="40" y="44" class="font-mono text-bright" font-size="11" font-weight="bold" text-anchor="middle">72%</text>
        <text x="40" y="84" class="font-sans text-label" text-anchor="middle">CPU LOAD</text>
      </g>

      <!-- Token/Sec Output Dial -->
      <g transform="translate(128, 0)">
        <circle cx="40" cy="40" r="30" fill="none" stroke="#0f172a" stroke-width="6"/>
        <!-- 85% progress arc -->
        <path d="M 40,10 A 30,30 0 1,1 18.5,19" fill="none" stroke="url(#neon-purple)" stroke-width="6" stroke-linecap="round" filter="url(#purple-glow)"/>
        <text x="40" y="44" class="font-mono text-bright" font-size="11" font-weight="bold" text-anchor="middle">85</text>
        <text x="40" y="84" class="font-sans text-label" text-anchor="middle">TOKENS / S</text>
      </g>
    </g>

    <!-- Workspace Files topology details -->
    <g transform="translate(16, 180)">
      <text x="0" y="12" class="font-sans text-label">TARGET CONTEXT</text>
      <line x1="0" y1="20" x2="208" y2="20" stroke="#1e293b" stroke-opacity="0.5"/>
      
      <!-- List of files with mini telemetry graphs -->
      <g transform="translate(0, 28)">
        <!-- File 1 -->
        <g transform="translate(0, 0)">
          <text x="0" y="12" class="font-sans text-bright" font-weight="600">store/index.ts</text>
          <text x="0" y="24" class="font-sans text-muted" font-size="9.5">Modified • lines: +148 -43</text>
          <rect x="150" y="2" width="58" height="15" rx="3" fill="#082f49" stroke="#0284c7" stroke-dasharray="1,1"/>
          <text x="179" y="12" class="font-sans" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">WRITING</text>
        </g>
        
        <!-- File 2 -->
        <g transform="translate(0, 44)">
          <text x="0" y="12" class="font-sans text-bright" font-weight="600" fill-opacity="0.7">chatSlice.ts</text>
          <text x="0" y="24" class="font-sans text-muted" font-size="9.5">Done • lines: +42 -12</text>
          <rect x="150" y="2" width="58" height="15" rx="3" fill="#064e3b"/>
          <text x="179" y="12" class="font-sans" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle">DONE</text>
        </g>
      </g>
    </g>

    <!-- Real-time Token Cost spline chart -->
    <g transform="translate(16, 380)">
      <text x="0" y="12" class="font-sans text-label">THROUGHPUT REALTIME</text>
      <rect y="22" width="208" height="120" rx="4" fill="#020307" stroke="#1e293b" stroke-width="0.5"/>
      <path d="M5,100 Q40,60 70,80 T130,30 T170,90 T203,70" fill="none" stroke="url(#neon-cyan)" stroke-width="2" filter="url(#cyan-glow)"/>
      <path d="M5,100 Q40,60 70,80 T130,30 T170,90 T203,70 L203,115 L5,115 Z" fill="url(#neon-cyan)" fill-opacity="0.04"/>
      <text x="10" y="36" class="font-mono text-muted" font-size="9">Avg: 85.4 tok/s</text>
    </g>

    <!-- Connected indicator -->
    <g transform="translate(16, 630)">
      <rect width="208" height="30" rx="4" fill="#064e3b" fill-opacity="0.15" stroke="#10b981" stroke-width="0.5"/>
      <circle cx="14" cy="15" r="3.5" fill="#10b981" class="pulse"/>
      <text x="26" y="19" class="font-sans" fill="#34d399" font-size="10" font-weight="bold">DAEMON CORE ACTIVE</text>
    </g>
  </g>

  <!-- ==================== MAIN WORKSPACE: FOCUSED TASK ORCHESTRATION NODE GRAPH ==================== -->
  <!-- We visualize the agent steps as an advanced interactive topological node graph -->
  <g transform="translate(300, 88)">
    
    <!-- Background Graph grid boundary -->
    <rect width="860" height="672" rx="8" fill="#040612" fill-opacity="0.7" stroke="#1e293b" stroke-width="0.75"/>

    <!-- Graph Header -->
    <rect width="860" height="38" fill="#050814" rx="7" stroke="#1e293b" stroke-width="0.75"/>
    <text x="16" y="23" class="font-sans text-title">AGENT PIPELINE TOPOLOGY ORCHESTRATION</text>
    <text x="844" y="23" class="font-sans text-label" text-anchor="end">VIEW: TOP-LEVEL FLOW</text>

    <!-- ==================== TOPOLOGY BEZIER CONNECTIONS ==================== -->
    <g>
      <!-- Connection 1: User prompt -> Planner -->
      <path d="M190,130 Q260,130 330,130" fill="none" stroke="url(#neon-cyan)" stroke-width="1.5"/>
      <!-- Glowing flow circle packet -->
      <circle cx="260" cy="130" r="3.5" fill="#00f3ff" class="pulse" filter="url(#cyan-glow)"/>

      <!-- Connection 2: Planner -> RAG search -->
      <path d="M470,130 C510,130 520,70 560,70" fill="none" stroke="#10b981" stroke-width="1.5"/>
      
      <!-- Connection 3: Planner -> Code Writer -->
      <path d="M470,130 C510,130 520,240 560,240" fill="none" stroke="url(#neon-purple)" stroke-width="1.5"/>
      <circle cx="515" cy="180" r="3.5" fill="#ab7df8" class="pulse" filter="url(#purple-glow)"/>

      <!-- Connection 4: Code Writer -> Terminal Verify -->
      <path d="M690,380 C740,380 750,490 800,490" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Connection 5: Code Writer -> Permission gate -->
      <path d="M790,240 C810,240 820,180 840,180" fill="none" stroke="url(#neon-amber)" stroke-width="1.5"/>
    </g>

    <!-- ==================== TOPOLOGY GRAPH NODES ==================== -->

    <!-- NODE A: USER GOAL (Input node, Blue/Cyan theme) -->
    <g transform="translate(30, 90)">
      <rect width="160" height="80" rx="6" fill="#08101e" stroke="#00f3ff" stroke-width="1" filter="url(#cyan-glow)"/>
      <rect width="160" height="20" fill="#0c1d35" rx="5"/>
      <circle cx="10" cy="10" r="3" fill="#00f3ff"/>
      <text x="20" y="13" class="font-sans text-title" font-size="10">USER GOAL</text>
      
      <text x="10" y="38" class="font-sans text-bright" font-size="11" font-weight="bold">Migrate state storage</text>
      <text x="10" y="52" class="font-sans text-muted" font-size="10">Use IndexedDB storage</text>
      <text x="10" y="66" class="font-sans text-muted" font-size="10">with auto-import driver.</text>
    </g>

    <!-- NODE B: PLANNER INTENT ROUTER (AI Core Decision, Purple theme) -->
    <g transform="translate(330, 90)">
      <rect width="140" height="80" rx="6" fill="#130d22" stroke="#ab7df8" stroke-width="1" filter="url(#purple-glow)"/>
      <rect width="140" height="20" fill="#20113b" rx="5"/>
      <circle cx="10" cy="10" r="3" fill="#ab7df8"/>
      <text x="20" y="13" class="font-sans text-title" font-size="10">AI PLANNER</text>
      
      <text x="10" y="38" class="font-sans text-bright" font-size="11">Task Decomposition</text>
      <text x="10" y="52" class="font-sans" fill="#ab7df8" font-size="10" font-weight="bold">Active Strategy</text>
      <text x="10" y="66" class="font-sans text-muted" font-size="10">Steps: 4 mapped</text>
    </g>

    <!-- NODE C: RAG SEARCH DEPENDENCY (Completed green node) -->
    <g transform="translate(560, 30)">
      <rect width="160" height="60" rx="6" fill="#061e14" stroke="#10b981" stroke-width="0.75"/>
      <circle cx="12" cy="12" r="6" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
      <path d="M10 12L12 14L15 10" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
      <text x="26" y="15" class="font-sans text-bright" font-size="11" font-weight="bold">RAG File Indexer</text>
      <text x="10" y="38" class="font-sans text-muted" font-size="10">Read 5 dependents</text>
      <text x="10" y="48" class="font-sans text-muted" font-size="10">Status: Completed (240ms)</text>
    </g>

    <!-- NODE D: ACTIVE CODE WRITER (Displays Code changes inside node, Glowing purple) -->
    <g transform="translate(560, 110)">
      <!-- Outer Node Container -->
      <rect width="230" height="300" rx="8" fill="#04060d" stroke="#ab7df8" stroke-width="1.25" filter="url(#purple-glow)"/>
      <!-- Header bar inside node -->
      <rect width="230" height="24" fill="#130d22" rx="7"/>
      <circle cx="10" cy="12" r="3" fill="#ab7df8" class="pulse"/>
      <text x="20" y="15" class="font-sans text-title" font-size="10">FILE WRITER ACTIVE</text>
      <text x="220" y="15" class="font-sans" fill="#ab7df8" font-size="10" font-weight="bold" text-anchor="end">84%</text>

      <!-- Details of File Write inside Node -->
      <g transform="translate(12, 34)">
        <text x="0" y="12" class="font-mono text-label">FILE: store/index.ts</text>
        <line x1="0" y1="20" x2="206" y2="20" stroke="#1e293b" stroke-opacity="0.5"/>
        
        <!-- Live Code Diff Chunks -->
        <g transform="translate(0, 32)" class="font-mono" font-size="10">
          <text y="14" fill="#ef4444">- import { persist } from ...</text>
          <text y="28" fill="#10b981">+ import { persist, createJSON ...</text>
          <text y="42" fill="#10b981">+ const indexedDBStorage = {</text>
          <text y="56" fill="#10b981">+   getItem: async (name) =&gt; {</text>
          <text y="70" fill="#10b981">+     const value = await ...</text>
          <text y="84" fill="#10b981">+     return value || localStorage...</text>
          <text y="98" fill="#cbd5e1">    },</text>
          <text y="112" fill="#52525b">    setItem: async (name, value) ...</text>
        </g>

        <!-- Streaming parameters status -->
        <g transform="translate(0, 180)">
          <line x1="0" y1="0" x2="206" y2="0" stroke="#1e293b" stroke-opacity="0.5"/>
          <text x="0" y="14" class="font-sans text-muted" font-size="9.5">Added: +148 lines | Deleted: -43 lines</text>
          <text x="0" y="26" class="font-sans text-muted" font-size="9.5">Writing speed: 1.2 chunks/sec</text>
        </g>
      </g>
    </g>

    <!-- NODE E: PERMISSION LOCK GATE (Futuristic glowing Amber warning node) -->
    <g transform="translate(560, 430)">
      <rect width="230" height="196" rx="8" fill="#1c1106" stroke="#f59e0b" stroke-width="1.25" filter="url(#amber-glow)"/>
      <rect width="230" height="24" fill="#301c03" rx="7"/>
      <polygon points="10,6 15,15 5,15" fill="#f59e0b" class="pulse"/>
      <text x="20" y="15" class="font-sans text-title" font-size="9.5" fill="#f59e0b">RISKY COMMAND AUTHORIZATION</text>

      <g transform="translate(12, 36)">
        <text x="0" y="12" class="font-mono text-label" fill="#f59e0b" fill-opacity="0.6">COMMAND EXECUTOR</text>
        <text x="0" y="27" class="font-mono text-bright" font-size="11" font-weight="bold">npm run build</text>
        <text x="0" y="42" class="font-sans text-muted" font-size="9.5">Runs bundler verification script</text>

        <!-- Command safety status -->
        <rect y="52" width="206" height="38" rx="4" fill="#080c18" stroke="#1e293b" stroke-width="0.5"/>
        <text x="8" y="66" class="font-sans" fill="#ef4444" font-size="9" font-weight="bold">WARNING: RUNS OUTSIDE SANDBOX</text>
        <text x="8" y="78" class="font-sans text-muted" font-size="8">Explicit validation parameter is required.</text>

        <!-- Gate buttons -->
        <g transform="translate(0, 106)">
          <!-- Deny Button -->
          <rect x="0" y="0" width="94" height="24" rx="12" fill="#3c1e1e" stroke="#ef4444" stroke-width="0.5"/>
          <text x="47" y="15" class="font-sans" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">Deny</text>

          <!-- Approve Button -->
          <rect x="106" y="0" width="100" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
          <text x="156" y="15" class="font-sans" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">Approve</text>
        </g>
      </g>
    </g>

    <!-- NODE F: COMPILER TERMINAL (Queued Verification node, Gray theme) -->
    <g transform="translate(330, 430)">
      <rect width="140" height="74" rx="6" fill="#0b0e14" stroke="#1e293b" stroke-width="0.75"/>
      <circle cx="12" cy="12" r="5" fill="#1e293b" stroke="#52525b" stroke-width="0.5"/>
      <text x="26" y="15" class="font-sans text-bright" font-size="11" fill-opacity="0.6">Verify Bundler</text>
      <text x="10" y="38" class="font-sans text-muted" font-size="10">Command: npm run build</text>
      <text x="10" y="52" class="font-sans text-muted" font-size="10">Status: Queued</text>
    </g>

  </g>

  <!-- ==================== FLOATING SYSTEM LOG CONSOLE HUD (BOTTOM BAR) ==================== -->
  <g transform="translate(40, 720)">
    <!-- Frosted HUD styling -->
    <rect width="1120" height="52" rx="8" fill="#040612" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.8"/>
    
    <!-- Connected info status -->
    <circle cx="20" cy="26" r="3.5" fill="#00f3ff" class="pulse" filter="url(#cyan-glow)"/>
    <text x="32" y="30" class="font-sans text-bright" font-size="12" font-weight="bold">Telemetry feed online</text>
    
    <!-- Logging parameters -->
    <g transform="translate(240, 10)">
      <!-- Console scroll text -->
      <text x="0" y="18" class="font-mono text-muted" font-size="10.5">[Sentry] Monitoring active daemon stream on desktop client ...</text>
      <text x="0" y="30" class="font-mono" fill="#10b981" font-size="10.5">[Local Daemon] Successfully compiled apps/desktop bundle | dist/assets/index.js (517kB)</text>
    </g>
  </g>
</svg>
