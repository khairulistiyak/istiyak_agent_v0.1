<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Cyber Theme Palette -->
    <linearGradient id="workspace-bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>
    <linearGradient id="cyan-primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple-primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amber-primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Glowing Effects Filters -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="purple-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "Fira Code", "SF Mono", Monaco, Consolas, monospace; }
      
      .title-main { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .sub-lbl { font-weight: 600; fill: #4b5563; font-size: 9px; letter-spacing: 0.12em; }
      .txt-normal { font-weight: 500; fill: #f3f4f6; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #9ca3af; font-size: 11px; }
      .txt-dimmed { font-weight: 400; fill: #4b5563; font-size: 10.5px; }
      
      .pulse { animation: neon-blink 2s infinite ease-in-out; }
      @keyframes neon-blink {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="900" rx="16" fill="url(#workspace-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="899" rx="15.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(0, 0)">
    <rect width="1200" height="56" fill="#070913" stroke="#1f2937" stroke-width="0.75"/>
    
    <!-- Window OS Controls -->
    <circle cx="20" cy="28" r="5" fill="#ef4444"/>
    <circle cx="36" cy="28" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="28" r="5" fill="#10b981"/>

    <!-- Path Brand Tag -->
    <g transform="translate(80, 18)">
      <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="url(#cyan-primary)"/>
      <text x="26" y="12" class="font-sans title-main">COMPANION COCKPIT</text>
      <text x="185" y="11" class="font-sans txt-dimmed">/</text>
      <text x="200" y="12" class="font-mono txt-normal">architecture: core-agent-pipeline</text>
    </g>

    <!-- Global Connection Daemon Status -->
    <g transform="translate(740, 14)">
      <text x="0" y="11" class="font-sans sub-lbl">DAEMON ADDR</text>
      <text x="0" y="25" class="font-mono txt-normal" fill="#06b6d4">localhost:3001</text>
      
      <text x="130" y="11" class="font-sans sub-lbl">WORKSPACE TARGET</text>
      <text x="130" y="25" class="font-mono txt-normal">istiyak_agent_v0.1</text>

      <rect x="290" y="4" width="150" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
      <circle cx="302" cy="16" r="3.5" fill="#10b981" class="pulse"/>
      <text x="312" y="20" class="font-sans" fill="#34d399" font-size="9" font-weight="bold">PIPELINE SECURE</text>
    </g>
  </g>

  <!-- ==================== COLUMN 1: AGENT BRAIN MODULE (Width: 280) ==================== -->
  <g transform="translate(0, 56)">
    <rect width="280" height="844" fill="#080a14" stroke="#1f2937" stroke-width="0.75"/>

    <g transform="translate(20, 24)">
      <text x="0" y="12" class="font-sans sub-lbl" fill="#06b6d4">01 • AGENT BRAIN (CORE)</text>
      <line x1="0" y1="20" x2="240" y2="20" stroke="#1f2937" stroke-width="0.75"/>
      
      <!-- Planner Module Status -->
      <g transform="translate(0, 36)">
        <rect width="240" height="72" rx="8" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="12" y="20" class="font-sans txt-normal" font-weight="bold">AI Planner Engine</text>
        <text x="12" y="38" class="font-sans txt-muted" font-size="10">Decomposing goal into structured tasks</text>
        <!-- status indicator -->
        <circle cx="16" cy="54" r="3.5" fill="#10b981"/>
        <text x="26" y="58" class="font-sans txt-normal" font-size="10" fill="#10b981">State: Decomposing</text>
      </g>

      <!-- Reflection / Validation Engine -->
      <g transform="translate(0, 124)">
        <rect width="240" height="72" rx="8" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="12" y="20" class="font-sans txt-normal" font-weight="bold">Self-Reflection Loop</text>
        <text x="12" y="38" class="font-sans txt-muted" font-size="10">Checking error codes &amp; syntax exceptions</text>
        <circle cx="16" cy="54" r="3.5" fill="#a855f7" class="pulse"/>
        <text x="26" y="58" class="font-sans txt-normal" font-size="10" fill="#c084fc">State: Monitoring</text>
      </g>

      <!-- LLM Configuration Model Selector -->
      <g transform="translate(0, 212)">
        <rect width="240" height="96" rx="8" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="12" y="20" class="font-sans txt-normal" font-weight="bold">Model Configuration</text>
        
        <text x="12" y="42" class="font-sans txt-muted" font-size="9.5">PROVIDER: <tspan fill="#ffffff" font-weight="bold">gemini</tspan></text>
        <text x="12" y="58" class="font-sans txt-muted" font-size="9.5">SELECTED MODEL: <tspan fill="#ffffff" font-weight="bold">gemini-3.5-flash</tspan></text>
        
        <!-- API Limit Indicator -->
        <rect x="12" y="70" width="216" height="14" rx="3" fill="#1e293b"/>
        <text x="20" y="80" class="font-mono txt-muted" font-size="8">API budget limit: $10.00 max</text>
      </g>

      <!-- Active User Goal -->
      <g transform="translate(0, 324)">
        <text x="0" y="12" class="font-sans sub-lbl">ACTIVE USER OBJECTIVE</text>
        <rect y="22" width="240" height="110" rx="8" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <g transform="translate(12, 34)">
          <text x="0" y="12" class="font-sans txt-normal" font-weight="bold">Zustand Persistence</text>
          <text x="0" y="28" class="font-sans txt-muted" font-size="10.5">Switch state manager storage</text>
          <text x="0" y="42" class="font-sans txt-muted" font-size="10.5">backend to IndexedDB storage</text>
          <text x="0" y="56" class="font-sans txt-muted" font-size="10.5">with local storage automatic</text>
          <text x="0" y="70" class="font-sans txt-muted" font-size="10.5">migration driver sync.</text>
        </g>
      </g>

      <!-- Performance Telemetry splines -->
      <g transform="translate(0, 470)">
        <text x="0" y="12" class="font-sans sub-lbl">SPEED THROTTLING</text>
        <rect y="22" width="240" height="90" rx="8" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <!-- wave line -->
        <path d="M10,80 Q40,40 70,60 T130,30 T190,70 T230,50" fill="none" stroke="url(#cyan-primary)" stroke-width="2" filter="url(#cyan-glow)"/>
        <text x="12" y="38" class="font-mono txt-normal" font-size="9" fill="#06b6d4">Max: 85.4 tok/s</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2: ACTIVE WORKSPACE & CODE DIFF PANEL (Width: 620) ==================== -->
  <g transform="translate(280, 56)">
    <rect width="620" height="844" fill="#05070c" stroke="#1f2937" stroke-width="0.75"/>
    <line x1="0" y1="0" x2="0" y2="844" stroke="#1f2937" stroke-width="0.75"/>

    <g transform="translate(24, 24)">
      <text x="0" y="12" class="font-sans sub-lbl" fill="#8b5cf6">02 • WORKSPACE WORKER &amp; COMPILER</text>
      
      <!-- Editor Code Tab bar -->
      <g transform="translate(0, 36)">
        <rect width="572" height="34" fill="#11131e" rx="4" stroke="#1f2937" stroke-width="0.75"/>
        <!-- Tab 1 Selected -->
        <rect width="180" height="34" fill="#05070c" rx="4"/>
        <line x1="0" y1="33" x2="180" y2="33" stroke="#8b5cf6" stroke-width="2"/>
        <text x="16" y="21" class="font-sans txt-normal" fill="#a855f7" font-weight="bold">src/store/index.ts</text>
        <circle cx="160" cy="17" r="3" fill="#a855f7" class="pulse"/>
      </g>

      <!-- Side-by-Side Diff Layout -->
      <g transform="translate(0, 80)">
        <!-- Left: Original -->
        <g transform="translate(0, 0)">
          <rect width="280" height="420" fill="#05070c" stroke="#1f2937" stroke-width="0.5"/>
          <rect width="280" height="20" fill="#0e111d"/>
          <text x="12" y="14" class="font-sans sub-lbl">ORIGINAL CODE</text>
          
          <g transform="translate(12, 34)" class="font-mono" font-size="9.5">
            <g fill="#4b5563" text-anchor="end">
              <text x="10" y="15">62</text>
              <text x="10" y="32">63</text>
              <text x="10" y="49">64</text>
              <text x="10" y="66">65</text>
            </g>
            <g transform="translate(18, 0)">
              <text y="15" fill="#9ca3af">export const useChatStore = create(</text>
              <text y="32" fill="#9ca3af">  persist(</text>
              <rect x="-4" y="40" width="242" height="30" fill="#7f1d1d" fill-opacity="0.25"/>
              <text y="49" fill="#f87171">-   { name: "chat-storage" }</text>
              <text y="66" fill="#9ca3af">  )</text>
            </g>
          </g>
        </g>

        <!-- Right: Modified -->
        <g transform="translate(292, 0)">
          <rect width="280" height="420" fill="#05070c" stroke="#1f2937" stroke-width="0.5"/>
          <rect width="280" height="20" fill="#0e111d"/>
          <text x="12" y="14" class="font-sans sub-lbl" fill="#10b981">MODIFIED CODE (ACTIVE EDIT)</text>

          <g transform="translate(12, 34)" class="font-mono" font-size="9.5">
            <g fill="#4b5563" text-anchor="end">
              <text x="10" y="15">62</text>
              <text x="10" y="32">63</text>
              <text x="10" y="49">64</text>
              <text x="10" y="66">65</text>
              <text x="10" y="83">66</text>
              <text x="10" y="100">67</text>
            </g>
            <g transform="translate(18, 0)">
              <text y="15" fill="#9ca3af">export const useChatStore = create(</text>
              <text y="32" fill="#9ca3af">  persist(</text>
              
              <rect x="-4" y="40" width="242" height="52" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.3"/>
              <text y="49" fill="#34d399" font-weight="600">+   { name: "chat-storage",</text>
              <text y="66" fill="#34d399" font-weight="600">+     storage: createJSONStorage(</text>
              <text y="83" fill="#34d399" font-weight="600">+       () =&gt; indexedDBStorage</text>
              
              <text y="100" fill="#9ca3af">  )</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Terminal Runner / Compilation output -->
      <g transform="translate(0, 520)">
        <text x="0" y="12" class="font-sans sub-lbl">COMPILER CONSOLE VERIFICATION</text>
        <rect y="22" width="572" height="110" rx="6" fill="#040508" stroke="#1f2937" stroke-width="0.75"/>
        
        <g transform="translate(16, 38)" class="font-mono" font-size="10">
          <text y="12" fill="#52525b">❯ tsc &amp;&amp; npm run build --workspace=desktop</text>
          <text y="26" fill="#cbd5e1">vite v7.0.4 building compiler environment...</text>
          <text y="40" fill="#10b981">✓ compiled successfully in 2.18s | bundle size: 517kB</text>
          <text y="54" fill="#a3a3a3">Status: waiting for validation check</text>
        </g>
      </g>

      <!-- HUMAN-IN-THE-LOOP APPROVAL WARNING DIALOG -->
      <g transform="translate(0, 670)">
        <rect width="572" height="110" rx="8" fill="#1c1106" stroke="#d97706" stroke-width="1.25" filter="url(#panel-shadow)"/>
        <rect width="572" height="24" fill="#2d1c10" rx="7"/>
        <polygon points="12,7 16,15 8,15" fill="#f59e0b" class="pulse"/>
        <text x="24" y="15" class="font-sans title-main" font-size="9" fill="#f59e0b">HUMAN APPROVAL GATEWAY REQID: APP-770</text>

        <g transform="translate(16, 36)">
          <text x="0" y="12" class="font-mono txt-muted" font-size="9">Tool: run_command | Sandbox Policy: UNSANDBOXED</text>
          <text x="0" y="26" class="font-sans txt-normal" font-weight="bold">Allow compiling client apps bundle with modified storage?</text>

          <g transform="translate(380, 8)">
            <!-- Deny -->
            <rect x="0" y="0" width="80" height="24" rx="12" fill="#3b1d1d" stroke="#ef4444" stroke-width="0.5"/>
            <text x="40" y="15" class="font-sans" fill="#fca5a5" font-size="9.5" font-weight="bold" text-anchor="middle">Deny</text>
            
            <!-- Approve -->
            <rect x="90" y="0" width="80" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
            <text x="130" y="15" class="font-sans" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">Approve</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 3: RAG MEMORY & TOOLS MANIFEST (Width: 300) ==================== -->
  <g transform="translate(900, 56)">
    <rect width="300" height="844" fill="#080a14" stroke="#1f2937" stroke-width="0.75"/>
    <line x1="0" y1="0" x2="0" y2="844" stroke="#1f2937" stroke-width="0.75"/>

    <g transform="translate(20, 24)">
      <text x="0" y="12" class="font-sans sub-lbl" fill="#ec4899">03 • RAG MEMORY &amp; ACTIVE TOOLS</text>
      <line x1="0" y1="20" x2="260" y2="20" stroke="#1f2937" stroke-width="0.75"/>

      <!-- RAG Workspace Index status -->
      <g transform="translate(0, 36)">
        <rect width="260" height="110" rx="8" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="12" y="20" class="font-sans txt-normal" font-weight="bold">RAG Memory Indexer</text>
        
        <circle cx="20" cy="44" r="4.5" fill="#10b981"/>
        <text x="32" y="47" class="font-sans txt-normal" font-size="10.5">Workspace Indexed (100%)</text>
        <text x="32" y="60" class="font-sans txt-muted" font-size="9.5">Total files tracked: 148 files</text>
        
        <!-- Mini line metric -->
        <rect x="12" y="78" width="236" height="16" rx="4" fill="#070913" stroke="#1f2937" stroke-width="0.5"/>
        <text x="20" y="89" class="font-mono txt-muted" font-size="8">Index path: .git/objects/index</text>
      </g>

      <!-- Active Tools Registry list -->
      <g transform="translate(0, 166)">
        <text x="0" y="12" class="font-sans sub-lbl">ACTIVE TOOL REGISTRY STATUS</text>
        
        <!-- Tool list -->
        <g transform="translate(0, 24)">
          <!-- Tool 1: scan_project -->
          <g transform="translate(0, 0)">
            <rect width="260" height="34" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.5"/>
            <circle cx="16" cy="17" r="4" fill="#10b981"/>
            <text x="28" y="20" class="font-mono txt-normal" font-size="10.5">scan_project</text>
            <text x="248" y="20" class="font-sans txt-muted" font-size="9.5" text-anchor="end" fill="#10b981">SUCCESS</text>
          </g>

          <!-- Tool 2: read_file -->
          <g transform="translate(0, 44)">
            <rect width="260" height="34" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.5"/>
            <circle cx="16" cy="17" r="4" fill="#10b981"/>
            <text x="28" y="20" class="font-mono txt-normal" font-size="10.5">read_file</text>
            <text x="248" y="20" class="font-sans txt-muted" font-size="9.5" text-anchor="end" fill="#10b981">SUCCESS</text>
          </g>

          <!-- Tool 3: precise_edit -->
          <g transform="translate(0, 88)">
            <rect width="260" height="34" rx="4" fill="#1b122c" stroke="#6b21a8" stroke-width="0.75"/>
            <circle cx="16" cy="17" r="4" fill="#a855f7" class="pulse"/>
            <text x="28" y="20" class="font-mono txt-normal" font-size="10.5" fill="#d8b4fe">precise_edit</text>
            <text x="248" y="20" class="font-sans txt-normal" font-size="9.5" text-anchor="end" fill="#c084fc" font-weight="bold">RUNNING</text>
          </g>

          <!-- Tool 4: run_command -->
          <g transform="translate(0, 132)">
            <rect width="260" height="34" rx="4" fill="#2d1c10" stroke="#d97706" stroke-width="0.75"/>
            <circle cx="16" cy="17" r="4" fill="#f59e0b" class="pulse"/>
            <text x="28" y="20" class="font-mono txt-normal" font-size="10.5" fill="#fde047">run_command</text>
            <text x="248" y="20" class="font-sans txt-normal" font-size="9.5" text-anchor="end" fill="#f59e0b" font-weight="bold">PENDING</text>
          </g>
        </g>
      </g>

      <!-- Exception/Warning logs panel -->
      <g transform="translate(0, 386)">
        <text x="0" y="12" class="font-sans sub-lbl">DAEMON EXCEPTION WARN DIARY</text>
        <rect y="22" width="260" height="152" rx="8" fill="#1c0f0f" stroke="#7f1d1d" stroke-width="0.75"/>
        
        <g transform="translate(12, 36)" class="font-mono" font-size="9.5">
          <text y="12" fill="#fca5a5" font-weight="bold">[WARN] QuotaExceededError</text>
          <text y="24" fill="#fca5a5">• Target: localStorage (Desktop)</text>
          <text y="36" fill="#fca5a5">• Size: &gt; 5.0MB allocated</text>
          
          <line x1="0" y1="46" x2="236" y2="46" stroke="#7f1d1d" stroke-width="0.75"/>
          
          <text y="64" fill="#34d399" font-weight="bold">[RESOLVED] Storage Migration</text>
          <text y="76" fill="#cbd5e1">• Initialised indexedDBStorage</text>
          <text y="88" fill="#cbd5e1">• Migrating state storage key</text>
          <text y="100" fill="#cbd5e1">• LocalStorage swept: OK</text>
        </g>
      </g>
    </g>
  </g>
</svg>
