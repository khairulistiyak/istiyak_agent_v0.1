<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deepest Minimalist Dark Palette -->
    <linearGradient id="zen-bg" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050506"/>
      <stop offset="1" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glowing Accent Filter -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .font-mono { font-family: "SF Mono", SFMono-Regular, Consolas, monospace; }
      
      /* Typography System */
      .title-hero { font-weight: 500; fill: #ffffff; font-size: 15px; letter-spacing: -0.01em; }
      .text-regular { font-weight: 400; fill: #d1d5db; font-size: 12px; }
      .text-muted { font-weight: 400; fill: #52525b; font-size: 12px; }
      .text-label { font-weight: 600; fill: #3f3f46; font-size: 9px; letter-spacing: 0.1em; }
      .text-code { font-weight: 400; fill: #e4e4e7; font-size: 11.5px; line-height: 1.6; }
      
      /* Pulsing Dot animation */
      .pulse-dot { animation: pulse 2.5s infinite ease-in-out; }
      @keyframes pulse {
        0% { opacity: 0.4; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.4; transform: scale(0.95); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" rx="16" fill="url(#zen-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="15.5" stroke="#18181b" stroke-opacity="0.5"/>

  <!-- ==================== HEADER (Ultra-Minimalist) ==================== -->
  <g transform="translate(60, 40)">
    <!-- Brand mark -->
    <rect width="12" height="12" rx="4" fill="url(#purple-glow)"/>
    <text x="24" y="11" class="font-sans title-hero">istiyak companion</text>
    <text x="170" y="10" class="font-sans text-muted" font-size="11">|</text>
    <text x="186" y="11" class="font-mono text-muted" font-size="11">zen workspace: store migration</text>

    <!-- Small active status -->
    <g transform="translate(980, 0)">
      <circle cx="0" cy="5" r="2.5" fill="#10b981"/>
      <text x="10" y="9" class="font-sans text-label" fill="#10b981">COPILOT ACTIVE</text>
    </g>
  </g>

  <!-- ==================== LEFT COLUMN: FILE VIEW (Width: 220) ==================== -->
  <g transform="translate(60, 100)">
    <!-- Files header -->
    <text x="0" y="10" class="font-sans text-label">WORKING SET</text>
    
    <g transform="translate(0, 24)">
      <!-- File 1: store/index.ts (Active editing) -->
      <g transform="translate(0, 0)">
        <circle cx="4" cy="10" r="2.5" fill="#c084fc" class="pulse-dot"/>
        <text x="18" y="14" class="font-sans text-regular" font-weight="500">store/index.ts</text>
        <text x="18" y="27" class="font-sans text-muted" font-size="9.5">Writing store replacement...</text>
      </g>

      <!-- File 2: chatSlice.ts (Completed) -->
      <g transform="translate(0, 48)">
        <circle cx="4" cy="10" r="2.5" fill="#10b981"/>
        <text x="18" y="14" class="font-sans text-muted">chatSlice.ts</text>
        <text x="130" y="14" class="font-mono" fill="#10b981" font-size="9" font-weight="600">+42 -12</text>
      </g>

      <!-- File 3: settingsStore.ts (Completed) -->
      <g transform="translate(0, 84)">
        <circle cx="4" cy="10" r="2.5" fill="#3f3f46"/>
        <text x="18" y="14" class="font-sans text-muted">settingsStore.ts</text>
      </g>

      <!-- File 4: App.tsx (Queued) -->
      <g transform="translate(0, 120)">
        <circle cx="4" cy="10" r="2.5" fill="#3f3f46" fill-opacity="0.4"/>
        <text x="18" y="14" class="font-sans text-muted" fill-opacity="0.5">App.tsx</text>
      </g>
    </g>

    <!-- Session Stats -->
    <g transform="translate(0, 440)">
      <text x="0" y="10" class="font-sans text-label">METRICS</text>
      
      <g transform="translate(0, 20)" font-size="11.5">
        <text x="0" y="12" class="font-sans text-muted">Read files</text>
        <text x="180" y="12" class="font-mono text-regular" text-anchor="end">12</text>

        <text x="0" y="32" class="font-sans text-muted">Modified files</text>
        <text x="180" y="32" class="font-mono text-regular" text-anchor="end">3</text>

        <text x="0" y="52" class="font-sans text-muted">Added lines</text>
        <text x="180" y="52" class="font-mono" fill="#10b981" font-weight="600" text-anchor="end">+148</text>

        <text x="0" y="72" class="font-sans text-muted">Deleted lines</text>
        <text x="180" y="72" class="font-mono" fill="#ef4444" font-weight="600" text-anchor="end">-43</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: TIMELINE AND DIFF (Width: 840) ==================== -->
  <g transform="translate(300, 100)">
    
    <!-- User Instruction Text (Ultra-minimal: no container box, just floating elegant text) -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" class="font-sans text-label">USER INSTRUCTION</text>
      <text x="0" y="28" class="font-sans text-regular" font-size="14" fill="#f3f4f6">"My app crashes with local storage quota. Please rewrite the Zustand store to use IndexedDB with auto-migration."</text>
    </g>

    <!-- Steps Timeline -->
    <g transform="translate(0, 72)">
      <!-- Central timeline line (extremely subtle) -->
      <line x1="8" y1="12" x2="8" y2="440" stroke="#27272a" stroke-opacity="0.4" stroke-width="0.75"/>

      <!-- STEP 1: COMPLETED -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="14" r="2.5" fill="#10b981"/>
        <text x="24" y="18" class="font-sans lbl-step-title">Step 1: Workspace analysis</text>
        <text x="760" y="16" class="font-sans text-muted" text-anchor="end">240ms</text>
      </g>

      <!-- STEP 2: COMPLETED -->
      <g transform="translate(0, 52)">
        <circle cx="8" cy="14" r="2.5" fill="#10b981"/>
        <text x="24" y="18" class="font-sans lbl-step-title">Step 2: Architecture design formulated</text>
        <text x="760" y="16" class="font-sans text-muted" text-anchor="end">120ms</text>
      </g>

      <!-- STEP 3: ACTIVE CODE MODIFICATION (THE FOCUSED ZONE) -->
      <g transform="translate(0, 104)">
        <!-- Pulsing active circle -->
        <circle cx="8" cy="16" r="4.5" fill="#c084fc" filter="url(#soft-glow)"/>
        <circle cx="8" cy="16" r="2" fill="#c084fc"/>
        
        <text x="24" y="20" class="font-sans lbl-step-title" fill="#c084fc" font-weight="600">Step 3: Modify store configuration and write IndexedDB storage driver</text>
        <text x="760" y="19" class="font-sans" fill="#c084fc" font-size="11" font-weight="600" text-anchor="end">Writing (84%)</text>
        
        <!-- Clean, borderless diff card -->
        <g transform="translate(24, 36)">
          <!-- Very dark background canvas for the diff -->
          <rect width="736" height="196" rx="8" fill="#09090b" stroke="#27272a" stroke-width="0.5"/>
          
          <g transform="translate(16, 16)">
            <!-- File Header Path -->
            <text x="0" y="10" class="font-mono text-label">FILE MODIFICATION: store/index.ts</text>
            
            <g transform="translate(0, 28)" class="font-mono text-code">
              <!-- Code Lines with clean diff highlight -->
              <text y="16" fill="#f87171">- import { persist } from "zustand/middleware";</text>
              <text y="34" fill="#34d399">+ import { persist, createJSONStorage, StateStorage } from "zustand/middleware";</text>
              <text y="52" fill="#34d399">+ const indexedDBStorage: StateStorage = {</text>
              <text y="70" fill="#34d399">+   getItem: async (name) =&gt; {</text>
              <text y="88" fill="#34d399">+     const val = await new Promise((resolve) =&gt; { ... });</text>
              <text y="106" fill="#34d399">+     return val || localStorage.getItem(name);</text>
              <text y="124" fill="#a1a1aa">  },</text>
              <text y="142" class="text-muted">  setItem: async (name, value) =&gt; { ... }</text>
            </g>
          </g>
        </g>
      </g>

      <!-- STEP 4: QUEUED -->
      <g transform="translate(0, 364)">
        <circle cx="8" cy="14" r="2.5" fill="#3f3f46" fill-opacity="0.6"/>
        <text x="24" y="17" class="font-sans lbl-step-title" fill="#52525b">Step 4: Verify build compilation correctness</text>
        <text x="760" y="16" class="font-sans text-muted" text-anchor="end">Queued</text>
      </g>
    </g>

    <!-- ==================== FLOATING CONTROL OPTIONS (Zero-gravity style) ==================== -->
    <g transform="translate(180, 592)">
      <!-- A completely clean, borderless floating bar -->
      <rect width="400" height="38" rx="19" fill="#0d0d0f" stroke="#27272a" stroke-width="0.5"/>
      <circle cx="16" cy="19" r="3.5" fill="#c084fc" class="pulse-dot"/>
      <text x="28" y="23" class="font-sans text-regular" font-size="11.5">Writing store/index.ts</text>
      
      <!-- Mini action items -->
      <g transform="translate(210, 6)">
        <rect width="50" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
        <text x="25" y="16" class="font-sans text-regular" font-size="10.5" font-weight="600" text-anchor="middle">Stop</text>

        <rect x="56" y="0" width="60" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
        <text x="86" y="16" class="font-sans text-regular" font-size="10.5" font-weight="600" text-anchor="middle">Discard</text>

        <rect x="122" y="0" width="56" height="26" rx="13" fill="#ffffff"/>
        <text x="150" y="16" class="font-sans" fill="#000000" font-size="10.5" font-weight="700" text-anchor="middle">Accept</text>
      </g>
    </g>
  </g>
</svg>
