<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Micro-Compact, Translucent pills match) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">COGNITIVE PLANNER - IMPLEMENTATION TASKMAP</text>
    <text x="360" y="11" class="font-sans txt-muted">/</text>
    <text x="374" y="12" class="font-mono subtitle">08_ARCH_PLANNING_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== PLAN CHECKLIST CONTENT (BORDERLESS ZEN STYLE) ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Goal Statement -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="font-sans lbl-flow">GOAL PROPOSAL</text>
      <text x="0" y="28" class="font-sans txt-main">Replace WebKit localStorage with IndexedDB async persistence backend inside Zustand store to prevent QuotaExceededError crashes, migrating existing local session logs dynamically.</text>
    </g>

    <line x1="0" y1="48" x2="736" y2="48" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.5"/>

    <!-- Step Timeline -->
    <g transform="translate(0, 68)">
      <text x="0" y="12" class="font-sans lbl-flow">EXECUTION CHECKLIST</text>
      
      <!-- Thread line -->
      <line x1="6" y1="32" x2="6" y2="108" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2" stroke-opacity="0.5"/>

      <!-- Phase 1 Done -->
      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="2.5" fill="#10b981"/>
        <text x="18" y="10" class="font-sans txt-bold" fill="#10b981">✓  Phase 1: Scan project context &amp; read store/index.ts</text>
        <text x="18" y="23" class="font-sans txt-muted">Scan workspace file structure to verify Zustand state imports and schema bindings.</text>
      </g>

      <!-- Phase 2 Active -->
      <g transform="translate(0, 68)">
        <circle cx="6" cy="6" r="2.5" fill="#3b82f6"/>
        <text x="18" y="10" class="font-sans txt-bold" fill="#3b82f6">▶  Phase 2: Refactor store with custom IndexedDBStateStorage driver</text>
        <text x="18" y="23" class="font-sans txt-muted">Modify store/index.ts to write custom getItem/setItem methods routing to localForage.</text>
      </g>

      <!-- Phase 3 Planned -->
      <g transform="translate(0, 112)">
        <circle cx="6" cy="6" r="2.5" fill="#52525b"/>
        <text x="18" y="10" class="font-sans txt-main" fill="#a1a1aa">☐  Phase 3: Run terminal compiler tsc build checks</text>
        <text x="18" y="23" class="font-sans txt-muted">Compile apps/desktop using npm run build to verify syntax type-safety.</text>
      </g>
    </g>

    <line x1="0" y1="228" x2="736" y2="228" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.5"/>

    <!-- Target Impacted Files Manifest -->
    <g transform="translate(0, 248)">
      <text x="0" y="12" class="font-sans lbl-flow">IMPACTED FILES</text>
      
      <g transform="translate(0, 22)">
        <!-- File Tag 1 -->
        <rect width="170" height="22" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <rect x="6" y="3" width="24" height="16" rx="8" fill="#1e293b" fill-opacity="0.15" stroke="#334155" stroke-opacity="0.4" stroke-width="0.75"/>
        <circle cx="12" cy="11" r="1.5" fill="#3178c6"/>
        <text x="17" y="14" class="font-mono txt-bold" font-size="7" fill="#cbd5e1">ts</text>
        <text x="38" y="15" class="font-sans txt-normal" font-size="10.5">src/store/index.ts</text>
        
        <!-- File Tag 2 -->
        <g transform="translate(180, 0)">
          <rect width="200" height="22" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
          <rect x="6" y="3" width="28" height="16" rx="8" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="0.75"/>
          <circle cx="12" cy="11" r="1.5" fill="#0ea5e9"/>
          <text x="17" y="14" class="font-mono txt-bold" font-size="7" fill="#00f3ff">tsx</text>
          <text x="42" y="15" class="font-sans txt-normal" font-size="10.5">src/components/ChatUI.tsx</text>
        </g>
      </g>
    </g>

    <!-- Translucent Pill Buttons matching 07-accept-reject-zen.svg styles -->
    <g transform="translate(380, 302)">
      <!-- Modify plan (Translucent Slate Gray Pill) -->
      <rect x="0" y="0" width="156" height="24" rx="12" fill="#1f2937" fill-opacity="0.15" stroke="#1f2937" stroke-width="0.75"/>
      <text x="78" y="15" class="font-sans txt-bold" fill="#a3a3a3" font-size="10" text-anchor="middle">Modify plan details</text>

      <!-- Approve plan & execute (Translucent Cyan Pill) -->
      <rect x="166" y="0" width="190" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
      <text x="250" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Approve plan &amp; run</text>
      
      <!-- Cyan Key Cap indicator -->
      <rect x="320" y="5" width="22" height="14" rx="2" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.5"/>
      <text x="331" y="13" class="font-sans txt-bold" font-size="7" fill="#22d3ee" text-anchor="middle">⏎</text>
    </g>

  </g>
</svg>
