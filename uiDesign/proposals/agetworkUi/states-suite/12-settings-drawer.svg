<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Micro-Compact, Translucent pills match) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="450" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="449" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">COMPANION SETTINGS DRAWER</text>
    <text x="250" y="11" class="font-sans txt-muted">/</text>
    <text x="264" y="12" class="font-mono subtitle">12_SETTINGS_GUARD_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== SETTINGS FORM ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Row 1: API Configuration -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="font-sans lbl-flow">API PROVIDER ACCESS KEY</text>
      <rect y="20" width="736" height="34" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
      <text x="16" y="41" class="font-mono txt-main">Gemini API Key:  ••••••••••••••••••••••••••••••••••••••••</text>
      
      <!-- Edit Key Button (Translucent Gray) -->
      <g transform="translate(640, 25)">
        <rect width="80" height="24" rx="12" fill="#1f2937" fill-opacity="0.15" stroke="#1f2937" stroke-width="0.75"/>
        <text x="40" y="15" class="font-sans txt-bold" fill="#a3a3a3" font-size="10" text-anchor="middle">Change Key</text>
      </g>
    </g>

    <!-- Row 2: Secure Sandbox Switch -->
    <g transform="translate(0, 80)">
      <text x="0" y="12" class="font-sans lbl-flow">SECURITY EXECUTION SANDBOX</text>
      <rect y="20" width="736" height="42" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
      <text x="16" y="45" class="font-sans txt-bold">Sandbox Isolation Shield</text>
      <text x="170" y="45" class="font-sans txt-muted">Enforce execution inside Docker container sandbox</text>
      
      <!-- Toggle switch (Checked: Active) -->
      <g transform="translate(660, 29)">
        <rect width="60" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
        <circle cx="48" cy="12" r="9" fill="#10b981"/>
        <text x="14" y="16" class="font-sans txt-bold" font-size="8" fill="#34d399">ON</text>
      </g>
    </g>

    <!-- Row 3: Workspace Path and Budget Guard -->
    <g transform="translate(0, 160)">
      <text x="0" y="12" class="font-sans lbl-flow">COMPILER &amp; WORKSPACE BOUNDS</text>
      
      <!-- Workspace Directory -->
      <g transform="translate(0, 20)">
        <text x="0" y="12" class="font-sans txt-muted">Active Workspace Directory</text>
        <text x="0" y="28" class="font-mono txt-main">/Volumes/SSD/0.1/istiyak_agent_v0.1</text>
      </g>
      
      <!-- Budget limit -->
      <g transform="translate(420, 20)">
        <text x="0" y="12" class="font-sans txt-muted">Session Cost Budget Guard</text>
        <text x="0" y="28" class="font-mono txt-main">$10.00 max session budget limit <tspan fill="#10b981">(Active)</tspan></text>
      </g>
    </g>

    <line x1="0" y1="260" x2="736" y2="260" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Bottom Action panel (Translucent buttons match 07-accept-reject-zen.svg) -->
    <g transform="translate(380, 290)">
      <!-- Discard / Close (Translucent Slate Gray Pill) -->
      <rect x="0" y="0" width="156" height="24" rx="12" fill="#1f2937" fill-opacity="0.15" stroke="#1f2937" stroke-width="0.75"/>
      <text x="78" y="15" class="font-sans txt-bold" fill="#a3a3a3" font-size="10" text-anchor="middle">Discard modifications</text>

      <!-- Save settings (Translucent Cyan Pill) -->
      <rect x="166" y="0" width="190" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
      <text x="250" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Save configuration</text>
      
      <!-- Cyan Key Cap indicator -->
      <rect x="320" y="5" width="22" height="14" rx="2" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.5"/>
      <text x="331" y="13" class="font-sans txt-bold" font-size="7" fill="#22d3ee" text-anchor="middle">⏎</text>
    </g>
  </g>
</svg>
