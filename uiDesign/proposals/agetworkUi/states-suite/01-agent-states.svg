<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Unified Spec Theme) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }

      .pulse { animation: zenglow 2.5s infinite ease-in-out; }
      @keyframes zenglow {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Clean dark backdrop -->
  <rect width="800" height="520" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="519" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">AGENT STATE TIMELINE SPECIFICATION</text>
    <text x="280" y="11" class="font-sans txt-muted">/</text>
    <text x="294" y="12" class="font-mono subtitle">01_CHATUI_STATES_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== STATE 1: IDLE / READY ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">01 • READY</text>
    <circle cx="6" cy="28" r="2.5" fill="#10b981"/>
    <text x="20" y="32" class="font-sans txt-main">Ready to assist. Ask companion to code, build, or inspect files.</text>
    <text x="736" y="32" class="font-mono txt-muted" text-anchor="end">⌘ K</text>
  </g>

  <!-- ==================== STATE 2: THINKING / PLANNING ==================== -->
  <g transform="translate(32, 145)">
    <text x="0" y="12" class="font-sans lbl-flow">02 • PLANNING</text>
    <circle cx="6" cy="28" r="2.5" fill="#3b82f6" class="pulse"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#3b82f6">Formulating task pipeline...</text>
    <text x="180" y="32" class="font-sans txt-main">Scanning workspace files and target dependencies</text>
  </g>

  <!-- ==================== STATE 3: EXECUTING / CALLING TOOL ==================== -->
  <g transform="translate(32, 210)">
    <text x="0" y="12" class="font-sans lbl-flow">03 • EXECUTING</text>
    <circle cx="6" cy="28" r="2.5" fill="#a855f7" class="pulse"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#c084fc">Calling tool:</text>
    <text x="100" y="32" class="font-mono txt-main">precise_edit</text>
    
    <!-- Flat micro progress line -->
    <text x="240" y="32" class="font-sans txt-muted">Writing</text>
    <g transform="translate(290, 20)">
      <rect width="24" height="14" rx="7" fill="#3178c6" fill-opacity="0.1" stroke="#3178c6" stroke-width="0.5"/>
      <circle cx="6" cy="7" r="1.5" fill="#3178c6"/>
      <text x="11" y="10" class="font-mono txt-bold" font-size="6.5" fill="#cbd5e1">ts</text>
    </g>
    <text x="324" y="32" class="font-mono txt-main">src/store/index.ts</text>
    <line x1="440" y1="28" x2="570" y2="28" stroke="#1f2937" stroke-width="2"/>
    <line x1="440" y1="28" x2="540" y2="28" stroke="#a855f7" stroke-width="2"/>
    <text x="575" y="32" class="font-mono txt-bold" font-size="10" fill="#a855f7">80%</text>
  </g>

  <!-- ==================== STATE 4: PENDING USER APPROVAL ==================== -->
  <g transform="translate(32, 275)">
    <text x="0" y="12" class="font-sans lbl-flow">04 • PENDING APPROVAL</text>
    <polygon points="6,24 9,31 3,31" fill="#f59e0b" class="pulse"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#f59e0b">Permission Pending:</text>
    <text x="146" y="32" class="font-mono txt-main" font-size="11">npm run build --workspace=desktop</text>

    <!-- Translucent pill style buttons matching standard -->
    <g transform="translate(420, 16)">
      <!-- Discard (Translucent Red Pill) -->
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.75"/>
      <text x="65" y="15" class="font-sans txt-bold" fill="#f87171" font-size="10" text-anchor="middle">Discard changes</text>

      <!-- Approve (Translucent Cyan Pill) -->
      <rect x="140" y="0" width="176" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
      <text x="228" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10" text-anchor="middle">Approve and build (⏎)</text>
    </g>
  </g>

  <!-- ==================== STATE 5: SUCCESS / COMPLETED ==================== -->
  <g transform="translate(32, 355)">
    <text x="0" y="12" class="font-sans lbl-flow">05 • COMPLETED</text>
    <circle cx="6" cy="28" r="2.5" fill="#10b981"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#10b981">Task completed successfully</text>
    <text x="190" y="32" class="font-sans txt-muted">Switched store persistence layer to IndexedDB storage (4.8s • $0.0042)</text>
  </g>

  <!-- ==================== STATE 6: ERROR / EXCEPTION ==================== -->
  <g transform="translate(32, 420)">
    <text x="0" y="12" class="font-sans lbl-flow">06 • ERROR</text>
    <circle cx="6" cy="28" r="2.5" fill="#ef4444"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#ef4444">Exception:</text>
    <text x="92" y="32" class="font-sans txt-main">WebKit localStorage quota limit exceeded.</text>
    <text x="350" y="32" class="font-sans txt-muted">(Auto-migrated session writes to IndexedDB)</text>
  </g>
</svg>
