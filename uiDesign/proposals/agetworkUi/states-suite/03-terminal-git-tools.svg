<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Unified Spec Theme) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop -->
  <rect width="800" height="520" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="519" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">TERMINAL &amp; GIT TOOLS SPECIFICATION</text>
    <text x="290" y="11" class="font-sans txt-muted">/</text>
    <text x="304" y="12" class="font-mono subtitle">03_SHELL_GIT_ENGINE_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== run_command / sandbox ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">01 • run_command / sandbox / process_manager</text>
    <circle cx="6" cy="28" r="2.5" fill="#f59e0b"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#f59e0b">Run terminal command:</text>
    <text x="156" y="32" class="font-mono txt-main">npm run build --workspace=desktop</text>
    <text x="440" y="32" class="font-sans txt-muted">(Sandbox: inactive • PID: 88720)</text>

    <!-- Shell console details -->
    <g transform="translate(20, 52)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#1f2937" stroke-width="1.5"/>
      <g transform="translate(10, 0)" class="font-mono" font-size="10.5">
        <text y="12" fill="#52525b">&gt; vite build</text>
        <text y="28" fill="#10b981">✓ compiled successfully in 2.18s</text>
        <text y="44" fill="#a1a1aa">Process exited with status 0 (Success)</text>
      </g>
    </g>
  </g>

  <!-- ==================== git_status ==================== -->
  <g transform="translate(32, 220)">
    <text x="0" y="12" class="font-sans lbl-flow">02 • git_status / git_diff</text>
    <circle cx="6" cy="28" r="2.5" fill="#3b82f6"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#3b82f6">Git workspace check:</text>
    <text x="150" y="32" class="font-sans txt-muted">Branch <tspan fill="#ffffff" font-family="monospace">main</tspan> has modified files</text>

    <g transform="translate(20, 52)">
      <text x="0" y="12" class="font-mono txt-main" fill="#ef4444">M</text>
      <g transform="translate(20, 0)">
        <rect width="24" height="14" rx="7" fill="#3178c6" fill-opacity="0.1" stroke="#3178c6" stroke-width="0.5"/>
        <circle cx="6" cy="7" r="1.5" fill="#3178c6"/>
        <text x="11" y="10" class="font-mono txt-bold" font-size="6.5" fill="#cbd5e1">ts</text>
      </g>
      <text x="50" y="12" class="font-mono txt-main">apps/desktop/src/store/index.ts</text>

      <text x="0" y="28" class="font-mono txt-main" fill="#10b981">U</text>
      <g transform="translate(20, 16)">
        <rect width="28" height="14" rx="7" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="0.5"/>
        <circle cx="6" cy="7" r="1.5" fill="#ec4899"/>
        <text x="11" y="10" class="font-mono txt-bold" font-size="6.5" fill="#cbd5e1">svg</text>
      </g>
      <text x="54" y="28" class="font-mono txt-main">uiDesign/proposals/agetworkUi/copilot-agent-ui-spec.svg</text>
    </g>
  </g>

  <!-- ==================== git_commit / git_log / git_checkout / git_stash ==================== -->
  <g transform="translate(32, 360)">
    <text x="0" y="12" class="font-sans lbl-flow">03 • git_commit / git_log / git_checkout / git_stash</text>
    <circle cx="6" cy="28" r="2.5" fill="#10b981"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#10b981">Staged &amp; committed changes:</text>
    <text x="190" y="32" class="font-mono txt-main">SHA: a28fc8a</text>
    <text x="20" y="52" class="font-sans txt-muted">Message: <tspan fill="#cbd5e1">feat(desktop): switch store persistence backend to IndexedDB and sweep localstorage</tspan></text>
  </g>
</svg>
