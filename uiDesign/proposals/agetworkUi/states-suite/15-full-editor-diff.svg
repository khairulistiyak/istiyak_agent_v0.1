<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Full Editor Diff) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">FULL EDITOR SPLIT CODE COMPARISON</text>
    <text x="280" y="11" class="font-sans txt-muted">/</text>
    <text x="294" y="12" class="font-mono subtitle">15_EDITOR_FULL_DIFF_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== SIDE-BY-SIDE DIFF PANELS ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Left panel: BEFORE -->
    <g transform="translate(0, 0)">
      <rect width="360" height="230" rx="4" fill="#05060b" stroke="#1f2937" stroke-width="0.75"/>
      <rect width="360" height="20" fill="#11131e" rx="3"/>
      <text x="12" y="13" class="font-sans lbl-flow">ORIGINAL (BEFORE)</text>
      
      <g transform="translate(12, 36)" class="font-mono" font-size="10">
        <g fill="#4b5563" text-anchor="end">
          <text x="12" y="15">62</text>
          <text x="12" y="32">63</text>
          <text x="12" y="49">64</text>
          <text x="12" y="66">65</text>
        </g>
        <g transform="translate(20, 0)">
          <text y="15" fill="#a1a1aa">export const useChatStore = create(</text>
          <text y="32" fill="#a1a1aa">  persist( (set) =&gt; ({ messages: [] }),</text>
          <rect x="-4" y="40" width="310" height="16" fill="#7f1d1d" fill-opacity="0.25"/>
          <text y="49" fill="#f87171">-   { name: "chat-storage" }</text>
          <text y="66" fill="#a1a1aa">  )</text>
        </g>
      </g>
    </g>

    <!-- Right panel: AFTER -->
    <g transform="translate(376, 0)">
      <rect width="360" height="230" rx="4" fill="#05060b" stroke="#1f2937" stroke-width="0.75"/>
      <rect width="360" height="20" fill="#11131e" rx="3"/>
      <text x="12" y="13" class="font-sans lbl-flow" fill="#10b981">MODIFIED (AFTER)</text>
      
      <g transform="translate(12, 36)" class="font-mono" font-size="10">
        <g fill="#4b5563" text-anchor="end">
          <text x="12" y="15">62</text>
          <text x="12" y="32">63</text>
          <text x="12" y="49">64</text>
          <text x="12" y="66">65</text>
          <text x="12" y="83">66</text>
          <text x="12" y="100">67</text>
        </g>
        <g transform="translate(20, 0)">
          <text y="15" fill="#a1a1aa">export const useChatStore = create(</text>
          <text y="32" fill="#a1a1aa">  persist( (set) =&gt; ({ messages: [] }),</text>
          <rect x="-4" y="40" width="310" height="50" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.3"/>
          <text y="49" fill="#34d399">+   {</text>
          <text y="66" fill="#34d399">+     name: "chat-storage",</text>
          <text y="83" fill="#34d399">+     storage: createJSONStorage(() =&gt; indexedDBStorage)</text>
          <text y="100" fill="#a1a1aa">  )</text>
        </g>
      </g>
    </g>

    <!-- Floating Compact Review Bar (matching 07-accept-reject-zen.svg) -->
    <g transform="translate(138, 252)">
      <!-- Sleek container -->
      <!-- Zen Glass Capsule (ts) -->
      <g transform="translate(10, 8)">
        <rect width="24" height="16" rx="8" fill="#1e293b" fill-opacity="0.15" stroke="#334155" stroke-opacity="0.4" stroke-width="0.75"/>
        <circle cx="6" cy="8" r="1.5" fill="#3178c6"/>
        <text x="11" y="11" class="font-mono txt-bold" font-size="7" fill="#cbd5e1">ts</text>
      </g>
      
      <!-- Status text & diff counts -->
      <text x="42" y="20" class="font-mono txt-bold" font-size="10" fill="#cbd5e1">index.ts</text>
      <text x="96" y="20" class="font-sans txt-muted" font-size="10">1 chunk pending</text>
      
      <!-- Clean separators -->
      <line x1="190" y1="8" x2="190" y2="24" stroke="#1f2937" stroke-width="1"/>

      <g transform="translate(202, 4)">
        <!-- Discard / Reject -->
        <text x="0" y="16" class="font-sans txt-bold" fill="#ef4444" font-size="10.5" cursor="pointer">Reject</text>
        <rect x="36" y="5" width="18" height="12" rx="2" fill="#2d1515" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.3"/>
        <text x="45" y="13" class="font-sans txt-bold" font-size="7" fill="#fca5a5" text-anchor="middle">⌫</text>

        <text x="68" y="16" class="font-sans txt-muted" font-size="10.5">|</text>

        <!-- Ask to edit -->
        <text x="82" y="16" class="font-sans txt-muted" font-size="10.5" cursor="pointer">Modify</text>
        
        <text x="130" y="16" class="font-sans txt-muted" font-size="10.5">|</text>

        <!-- Accept Button (Translucent Cyan Pill) -->
        <rect x="144" y="2" width="76" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="172" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10" text-anchor="middle">Accept</text>
        
        <!-- Compact key indicator -->
        <rect x="198" y="6" width="18" height="12" rx="2" fill="#0e7490" fill-opacity="0.3" stroke="#06b6d4" stroke-width="0.5"/>
        <text x="207" y="14" class="font-sans txt-bold" font-size="7" fill="#22d3ee" text-anchor="middle">⏎</text>
      </g>
    </g>
  </g>
</svg>
