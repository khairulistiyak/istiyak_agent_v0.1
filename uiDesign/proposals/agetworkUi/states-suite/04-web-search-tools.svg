<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Unified Spec Theme) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop -->
  <rect width="800" height="520" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="519" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">WEB SEARCH &amp; FETCH TOOLS SPECIFICATION</text>
    <text x="310" y="11" class="font-sans txt-muted">/</text>
    <text x="324" y="12" class="font-mono subtitle">04_WEB_CRAWLER_ENGINE_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== google_search ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">01 • google_search / url_context</text>
    <circle cx="6" cy="28" r="2.5" fill="#3b82f6"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#3b82f6">Query web context:</text>
    <text x="140" y="32" class="font-sans txt-main">"WebKit storage quota exceeded localstorage tauri"</text>
    <text x="460" y="32" class="font-sans txt-muted">(3 results found • 520ms)</text>

    <!-- Search items -->
    <g transform="translate(20, 52)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" class="font-sans txt-bold" fill="#38bdf8">Tauri WebKit LocalStorage limits • GitHub Issue #8820</text>
        <text x="0" y="26" class="font-sans txt-muted">WebKit enforces 5MB limit. Solution is custom IndexedDB store adapter...</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 48)">
        <text x="0" y="12" class="font-sans txt-bold" fill="#38bdf8">How to configure Zustand with IndexedDB storage | Dev.to</text>
        <text x="0" y="26" class="font-sans txt-muted">Implement StateStorage driver callbacks manually to override default storage...</text>
      </g>
    </g>
  </g>

  <!-- ==================== fetch_url / crawl_website ==================== -->
  <g transform="translate(32, 280)">
    <text x="0" y="12" class="font-sans lbl-flow">02 • fetch_url / crawl_website</text>
    <circle cx="6" cy="28" r="2.5" fill="#10b981"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#10b981">Fetch page abstract:</text>
    <text x="145" y="32" class="font-mono txt-main">https://tauri.app/docs/api/js/dialog</text>
    <text x="390" y="32" class="font-sans txt-muted">(DOM parsed • 24KB extracted • 320ms)</text>

    <!-- Content result box -->
    <g transform="translate(20, 52)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1f2937" stroke-width="1.5"/>
      <g transform="translate(10, 0)" class="font-mono" font-size="10">
        <text y="12" fill="#52525b">// Web documentation segment:</text>
        <text y="26" fill="#cbd5e1">import { ask, confirm } from '@tauri-apps/plugin-dialog'; // returns confirmation dialog modal</text>
      </g>
    </g>
  </g>
</svg>
