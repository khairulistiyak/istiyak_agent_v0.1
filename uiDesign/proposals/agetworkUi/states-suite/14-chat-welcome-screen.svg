<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Micro-Compact, Translucent pills match) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">CHAT TEMPLATE &amp; WELCOME SCREEN</text>
    <text x="260" y="11" class="font-sans txt-muted">/</text>
    <text x="274" y="12" class="font-mono subtitle">14_WELCOME_IDLE_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== MAIN CONTENT (WELCOME SCREEN) ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Brand Logo and Welcome Message -->
    <g transform="translate(0, 20)">
      <!-- Minimal Brand Icon -->
      <polygon points="12,0 24,6 24,18 12,24 0,18 0,6" fill="none" stroke="#00f3ff" stroke-width="1.5"/>
      <polygon points="12,4 20,8 20,16 12,20 4,16 4,8" fill="#00f3ff" fill-opacity="0.2"/>
      
      <text x="40" y="16" class="font-sans txt-bold" font-size="14">How can I help you today?</text>
      <text x="40" y="32" class="font-sans txt-muted">Choose a template or press ⌘K to select agent tools configuration.</text>
    </g>

    <!-- Prompt example cards (2x2 grid) -->
    <g transform="translate(0, 90)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="350" height="46" rx="6" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="16" y="26" class="font-sans txt-main" font-weight="bold">Create a React theme selector component</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(386, 0)">
        <rect width="350" height="46" rx="6" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="16" y="26" class="font-sans txt-main" font-weight="bold">Refactor Zustand store to IndexedDB</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(0, 60)">
        <rect width="350" height="46" rx="6" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="16" y="26" class="font-sans txt-main" font-weight="bold">Scan workspace to fix storage limits</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(386, 60)">
        <rect width="350" height="46" rx="6" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
        <text x="16" y="26" class="font-sans txt-main" font-weight="bold">Add compile test script to build pipeline</text>
      </g>
    </g>

    <line x1="0" y1="230" x2="736" y2="230" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Bottom Input command bar -->
    <g transform="translate(0, 252)">
      <rect width="736" height="38" rx="19" fill="#0d0f16" stroke="#1f2937" stroke-width="1"/>
      <circle cx="20" cy="19" r="3.5" fill="#00f3ff"/>
      <text x="36" y="23" class="font-sans txt-main" fill="#737373">Ask companion to build or code...</text>
      
      <!-- keyboard shortcut -->
      <rect x="680" y="10" width="38" height="18" rx="4" fill="#161824" stroke="#1f2937" stroke-width="0.5"/>
      <text x="699" y="22" class="font-sans txt-muted" font-size="9" font-weight="bold" text-anchor="middle">⌘ K</text>
    </g>
  </g>
</svg>
