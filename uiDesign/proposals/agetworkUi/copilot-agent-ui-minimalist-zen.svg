<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-minimal Zen Dark Theme Palette -->
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      /* Typography System */
      .txt-header { font-weight: 600; fill: #ffffff; font-size: 14px; letter-spacing: -0.01em; }
      .txt-subheader { font-weight: 500; fill: #7f7f7f; font-size: 11px; letter-spacing: 0.05em; }
      .txt-body { font-weight: 400; fill: #a3a3a3; font-size: 12px; line-height: 1.6; }
      .txt-highlight { font-weight: 500; fill: #ffffff; font-size: 12px; }
      .txt-muted { font-weight: 400; fill: #525252; font-size: 11px; }
      .txt-code { font-weight: 400; fill: #e5e5e5; font-size: 11.5px; }

      .pulse { animation: zenglow 2.5s infinite ease-in-out; }
      @keyframes zenglow {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Clean Obsidian Background (Zero grid, zero heavy frames) -->
  <rect width="1200" height="800" fill="#050505"/>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="12" stroke="#121212" stroke-opacity="0.8"/>

  <!-- ==================== HEADER BAR (Text-Only, borderless) ==================== -->
  <g transform="translate(48, 36)">
    <!-- Brand Logo Text -->
    <text x="0" y="14" class="font-sans txt-header">Companion</text>
    <text x="96" y="12" class="font-sans txt-muted">/</text>
    <text x="116" y="14" class="font-mono txt-subheader">STORE_MIGRATION</text>

    <!-- Right Side System Telemetry (Minimal pills, no background) -->
    <g transform="translate(930, 2)">
      <!-- Active pipeline status indicator -->
      <circle cx="8" cy="8" r="3" fill="#10b981" class="pulse"/>
      <text x="18" y="11" class="font-sans txt-highlight" font-size="11">Active</text>
      
      <text x="76" y="10" class="font-sans txt-muted">|</text>
      
      <!-- LLM Engine details -->
      <text x="96" y="11" class="font-sans txt-muted">gemini-3.5-flash</text>
    </g>
    
    <!-- Minimal divider line -->
    <line x1="0" y1="36" x2="1104" y2="36" stroke="#121212" stroke-width="1"/>
  </g>

  <!-- ==================== MAIN COLUMNAR WORKSPACE ==================== -->

  <!-- LEFT COLUMN: Simplified Text Stream (Width: 380) -->
  <g transform="translate(48, 108)">
    <text x="0" y="12" class="font-sans txt-subheader">ACTIVITY STREAM</text>
    
    <!-- Stream timeline (Text list with micro dots, zero cards/boxes) -->
    <g transform="translate(0, 36)">
      <!-- Stream 1 -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="8" r="2" fill="#10b981"/>
        <text x="20" y="12" class="font-sans txt-highlight">Scanned store config</text>
        <text x="20" y="28" class="font-sans txt-body" font-size="11">Located 5 local state instances in codebase</text>
        <text x="350" y="12" class="font-mono txt-muted" text-anchor="end">240ms</text>
      </g>

      <!-- Stream 2 (Active editing step) -->
      <g transform="translate(0, 64)">
        <circle cx="6" cy="8" r="2.5" fill="#3b82f6" class="pulse"/>
        <text x="20" y="12" class="font-sans txt-highlight" fill="#3b82f6">Modifying store/index.ts</text>
        <text x="20" y="28" class="font-sans txt-body" font-size="11">Injecting IndexedDB as secondary storage target</text>
        <text x="350" y="12" class="font-mono txt-muted" text-anchor="end">Active</text>
        
        <!-- Nested minimal parameters -->
        <g transform="translate(20, 42)">
          <text x="0" y="12" class="font-sans txt-body" font-size="10.5">Speed: <tspan fill="#ffffff">85 tokens/sec</tspan></text>
          <text x="120" y="12" class="font-sans txt-body" font-size="10.5">Lines: <tspan fill="#10b981">+148</tspan> <tspan fill="#ef4444">-43</tspan></text>
        </g>
      </g>

      <!-- Stream 3 (Next execution block) -->
      <g transform="translate(0, 150)">
        <circle cx="6" cy="8" r="2" fill="#525252"/>
        <text x="20" y="12" class="font-sans txt-muted" font-weight="600">Verification built pipeline</text>
        <text x="20" y="28" class="font-sans txt-muted" font-size="11">Will trigger tsc verification suite on compile</text>
        <text x="350" y="12" class="font-mono txt-muted" text-anchor="end">Queued</text>
      </g>
    </g>
  </g>

  <!-- Vertical separator (Ultra-thin whitespace line) -->
  <line x1="448" y1="108" x2="448" y2="600" stroke="#121212" stroke-width="1"/>

  <!-- RIGHT COLUMN: Flat Text Code Viewer (Width: 704) -->
  <g transform="translate(496, 108)">
    <text x="0" y="12" class="font-sans txt-subheader">ACTIVE WORKSPACE FILE</text>
    <text x="656" y="12" class="font-mono txt-muted" text-anchor="end">src/store/index.ts</text>

    <!-- Code Editor block (No windows, just clean type) -->
    <g transform="translate(0, 36)" class="font-mono" font-size="11">
      
      <!-- Clean line numbers -->
      <g fill="#404040" text-anchor="end">
        <text x="16" y="15">62</text>
        <text x="16" y="35">63</text>
        <text x="16" y="55">64</text>
        <text x="16" y="75">65</text>
        <text x="16" y="95">66</text>
        <text x="16" y="115">67</text>
        <text x="16" y="135">68</text>
        <text x="16" y="155">69</text>
        <text x="16" y="175">70</text>
        <text x="16" y="195">71</text>
      </g>

      <!-- Code syntax stream -->
      <g transform="translate(32, 0)">
        <text y="15" fill="#a3a3a3">export const useChatStore = create(</text>
        <text y="35" fill="#a3a3a3">  persist(</text>
        <text y="55" fill="#a3a3a3">    (set) =&gt; ({</text>
        <text y="75" fill="#a3a3a3">      messages: [],</text>
        <text y="95" fill="#a3a3a3">    }),</text>
        
        <!-- Modified lines showing inline clean styling (Soft colors, no boxes) -->
        <text y="115" fill="#10b981">+   {</text>
        <text y="135" fill="#10b981">+     name: "chat-storage",</text>
        <text y="155" fill="#3b82f6">+     storage: createJSONStorage(() =&gt; indexedDBStorage),</text>
        
        <text y="175" fill="#a3a3a3">    }</text>
        <text y="195" fill="#a3a3a3">  )</text>
      </g>
    </g>

    <!-- Floating verification permission indicator (Elegant prompt text, no borders) -->
    <g transform="translate(32, 380)">
      <text x="0" y="12" class="font-sans txt-highlight" fill="#d97706">Pending permission required</text>
      <text x="0" y="28" class="font-sans txt-body" font-size="11">Approve execution of terminal compilation command:</text>
      <text x="0" y="44" class="font-mono txt-highlight" font-size="11.5">npm run build --workspace=desktop</text>

      <g transform="translate(0, 56)">
        <!-- Reject -->
        <text x="0" y="14" class="font-sans txt-highlight" fill="#a3a3a3" font-size="11" font-weight="bold" cursor="pointer">Discard changes</text>
        <text x="110" y="14" class="font-sans txt-muted">or</text>
        <!-- Accept -->
        <text x="135" y="14" class="font-sans txt-highlight" fill="#10b981" font-size="11" font-weight="bold" cursor="pointer">Approve and build</text>
      </g>
    </g>
  </g>

  <!-- ==================== FLOATING COMMAND BAR (Raycast-Style search palette) ==================== -->
  <!-- Floating centered at the bottom, soft drop shadow -->
  <g transform="translate(320, 680)">
    <!-- Soft outer drop shadow pill container -->
    <rect width="560" height="52" rx="26" fill="#0d0d0d" stroke="#1c1c1c" stroke-width="1"/>
    
    <!-- Pulse active state -->
    <circle cx="28" cy="26" r="3.5" fill="#3b82f6" class="pulse"/>
    
    <text x="46" y="30" class="font-sans txt-body" font-size="12" fill="#737373">Ask companion to code or build...</text>
    
    <!-- Keyboard shortcut indicator -->
    <rect x="496" y="17" width="38" height="18" rx="4" fill="#171717" stroke="#262626" stroke-width="0.5"/>
    <text x="515" y="29" class="font-sans txt-muted" font-size="9" font-weight="bold" text-anchor="middle">⌘ K</text>
  </g>
</svg>
