<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Micro-Compact, Translucent pills match) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">COMMAND PALETTE &amp; MODE SELECTOR</text>
    <text x="320" y="11" class="font-sans txt-muted">/</text>
    <text x="334" y="12" class="font-mono subtitle">09_MODE_PALETTE_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== MAIN CONTENT (BORDERLESS SELECTOR DROPDOWN) ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Floating Palette Input Bar -->
    <g transform="translate(0, 0)">
      <rect width="736" height="34" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
      <circle cx="16" cy="17" r="3.5" fill="#00f3ff"/>
      <text x="28" y="21" class="font-sans txt-main" fill="#a3a3a3">Active Mode Selector...</text>
      <text x="724" y="21" class="font-sans txt-muted" text-anchor="end">⌘K</text>
    </g>

    <!-- Dropdown Options list (Zen minimalist stack) -->
    <g transform="translate(0, 50)">
      
      <!-- Option 1: Chat Mode -->
      <g transform="translate(0, 0)">
        <rect width="736" height="38" rx="4" fill="#090a10" stroke="#121215" stroke-width="0.5"/>
        <text x="16" y="23" class="font-sans txt-bold">Chat Mode</text>
        <text x="110" y="23" class="font-sans txt-muted">Conversational answers only. Block all tools.</text>
        <rect x="696" y="11" width="24" height="15" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="708" y="21" class="font-sans txt-muted" font-size="8" text-anchor="middle">⌥C</text>
      </g>

      <!-- Option 2: Plan Mode -->
      <g transform="translate(0, 44)">
        <rect width="736" height="38" rx="4" fill="#090a10" stroke="#121215" stroke-width="0.5"/>
        <text x="16" y="23" class="font-sans txt-bold">Plan Mode</text>
        <text x="110" y="23" class="font-sans txt-muted">Generate implementation checklists and roadmaps. No writes.</text>
        <rect x="696" y="11" width="24" height="15" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="708" y="21" class="font-sans txt-muted" font-size="8" text-anchor="middle">⌥P</text>
      </g>

      <!-- Option 3: Assist Mode -->
      <g transform="translate(0, 88)">
        <rect width="736" height="38" rx="4" fill="#090a10" stroke="#121215" stroke-width="0.5"/>
        <text x="16" y="23" class="font-sans txt-bold">Assist Mode</text>
        <text x="110" y="23" class="font-sans txt-muted">Read-only file access. Semantic code search. Edit blocked.</text>
        <rect x="696" y="11" width="24" height="15" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="708" y="21" class="font-sans txt-muted" font-size="8" text-anchor="middle">⌥S</text>
      </g>

      <!-- Option 4: Agent Mode (ACTIVE SELECTED) -->
      <g transform="translate(0, 132)">
        <!-- Highlighted row with subtle blue/cyan outline -->
        <rect width="736" height="38" rx="4" fill="#0c1926" stroke="#06b6d4" stroke-width="0.75"/>
        
        <circle cx="16" cy="19" r="3" fill="#06b6d4"/>
        <text x="32" y="23" class="font-sans txt-bold" fill="#00f3ff">Agent Mode</text>
        <text x="130" y="23" class="font-sans txt-main">Autonomous coding assistant. Read/write/run with approval gates.</text>
        
        <!-- Active Pill Badge -->
        <rect x="636" y="11" width="46" height="16" rx="3" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.5"/>
        <text x="659" y="22" class="font-sans" fill="#22d3ee" font-size="8" font-weight="bold" text-anchor="middle">ACTIVE</text>
        
        <rect x="696" y="11" width="24" height="15" rx="3" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.5"/>
        <text x="708" y="21" class="font-sans txt-bold" fill="#ffffff" font-size="8" text-anchor="middle">⌥A</text>
      </g>
    </g>

    <line x1="0" y1="236" x2="736" y2="236" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Model selection context details -->
    <g transform="translate(0, 252)">
      <text x="0" y="12" class="font-sans lbl-flow">ACTIVE MODEL BACKEND</text>
      <text x="0" y="28" class="font-mono txt-main">SELECTED: gemini-3.5-flash <tspan fill="#4b5563">(context: 1.0M tokens • latency: 180ms)</tspan></text>
      
      <!-- Translucent action pills matching suite -->
      <g transform="translate(480, 14)">
        <rect x="0" y="0" width="130" height="24" rx="12" fill="#1f2937" fill-opacity="0.15" stroke="#1f2937" stroke-width="0.75"/>
        <text x="65" y="15" class="font-sans txt-bold" fill="#a3a3a3" font-size="10" text-anchor="middle">Configure API Keys</text>

        <rect x="140" y="0" width="116" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="198" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Save changes</text>
      </g>
    </g>
  </g>
</svg>
