<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Minimalist File Icon Library) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
      
      /* Sleek page icon style properties */
      .page-outline { stroke: #27272a; stroke-width: 1.25; fill: none; }
      .page-fold { stroke: #27272a; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="500" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#f59e0b"/>
    <text x="24" y="12" class="font-sans title">FILE SYSTEM ICON SET SPECIFICATION</text>
    <text x="310" y="11" class="font-sans txt-muted">/</text>
    <text x="324" y="12" class="font-mono subtitle">11_FILE_ICONS_LIBRARY</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== ICONS LIST GRID (ULTRA-CLEAN MINIMAL OUTLINES) ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">WORKSPACE FILE TYPE COMPACT OUTLINE TAGS</text>
    
    <!-- Row 1: Code scripts -->
    <g transform="translate(0, 32)">
      <!-- 1. TypeScript (.ts) -->
      <g transform="translate(0, 0)">
        <!-- Page Symbol Icon -->
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <!-- File stripe accent -->
        <line x1="4" y1="6" x2="4" y2="14" stroke="#3178c6" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">TypeScript</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#3178c6">.ts</text>
      </g>

      <!-- 2. TSX React (.tsx) -->
      <g transform="translate(180, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#0ea5e9" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">TS React</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#0ea5e9">.tsx</text>
      </g>

      <!-- 3. JavaScript (.js) -->
      <g transform="translate(360, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#eab308" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">JavaScript</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#eab308">.js</text>
      </g>

      <!-- 4. JSX React (.jsx) -->
      <g transform="translate(540, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#f97316" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">JS React</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#f97316">.jsx</text>
      </g>
    </g>

    <!-- Row 2: Config and markup -->
    <g transform="translate(0, 100)">
      <!-- 5. JSON Config (.json) -->
      <g transform="translate(0, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#cd7f32" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">JSON Config</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#cd7f32">.json</text>
      </g>

      <!-- 6. HTML document (.html) -->
      <g transform="translate(180, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#e34f26" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">HTML Web</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#e34f26">.html</text>
      </g>

      <!-- 7. CSS Styles (.css) -->
      <g transform="translate(360, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#1572b6" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">CSS Styles</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#1572b6">.css</text>
      </g>

      <!-- 8. Markdown document (.md) -->
      <g transform="translate(540, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#a1a1aa" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">Markdown</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#a1a1aa">.md</text>
      </g>
    </g>

    <!-- Row 3: Assets & Directories -->
    <g transform="translate(0, 168)">
      <!-- 9. Vector Graphic (.svg) -->
      <g transform="translate(0, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#ec4899" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">SVG Vector</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#ec4899">.svg</text>
      </g>

      <!-- 10. Folder / Directory (folder) -->
      <g transform="translate(180, 0)">
        <!-- Flat Line Folder Symbol -->
        <path d="M4 4 L8 4 L10 6 L18 6 L18 16 L4 16 Z" stroke="#27272a" stroke-width="1.25" fill="none"/>
        <line x1="4" y1="6" x2="18" y2="6" stroke="#27272a" stroke-width="1"/>
        <line x1="4" y1="6" x2="4" y2="12" stroke="#b45309" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">Directory</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#b45309">folder</text>
      </g>

      <!-- 11. Plain Text (.txt) -->
      <g transform="translate(360, 0)">
        <path d="M4 2 L12 2 L16 6 L16 18 L4 18 Z" class="page-outline"/>
        <path d="M12 2 L12 6 L16 6" class="page-fold"/>
        <line x1="4" y1="6" x2="4" y2="14" stroke="#71717a" stroke-width="1.5"/>
        
        <text x="24" y="14" class="font-sans txt-bold">Plain Text</text>
        <text x="130" y="14" class="font-mono txt-bold" font-size="10.5" fill="#71717a">.txt</text>
      </g>
    </g>

    <line x1="0" y1="236" x2="736" y2="236" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- UI Implementation Details -->
    <g transform="translate(0, 252)">
      <text x="0" y="12" class="font-sans lbl-flow">DESIGN RULES FOR DYNAMIC RENDERING</text>
      <text x="0" y="28" class="font-sans txt-main">1. File icons use a hollow monochrome page outline shape with folded corner to save screen clutter.</text>
      <text x="0" y="44" class="font-sans txt-main">2. Color categorization is represented as a single 1.5px vertical left border stripe next to the document fold.</text>
      <text x="0" y="60" class="font-sans txt-main">3. Extension names display in Fira Code font matching the color stripe key to stand out cleanly.</text>

      <!-- Close / Back button matching suite style -->
      <g transform="translate(620, 78)">
        <rect width="116" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="58" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Close Spec</text>
      </g>
    </g>
  </g>
</svg>
