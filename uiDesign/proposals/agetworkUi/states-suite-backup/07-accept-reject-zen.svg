<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Micro-Compact Elements) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #4b5563; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #4b5563; font-size: 8.5px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11px; }
      .txt-muted { font-weight: 400; fill: #4b5563; font-size: 10px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">ACCEPT / REJECT ARCHACTIVE INTERFACES</text>
    <text x="320" y="11" class="font-sans txt-muted">/</text>
    <text x="334" y="12" class="font-mono subtitle">07_ARCH_HITL_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== FLOW 1: CODE EDITOR INLINE REVIEW BAR ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">01 • CODE EDITOR INLINE REVIEW (MICRO-COMPACT FLOATING BAR)</text>
    
    <!-- Code lines mock -->
    <g transform="translate(20, 24)" class="font-mono" font-size="10">
      <text y="15" fill="#4b5563">62   export const useChatStore = create(</text>
      <text y="32" fill="#34d399">+   persist( (set) =&gt; ({ messages: [] }), {</text>
      <text y="49" fill="#34d399">+     storage: createJSONStorage(() =&gt; indexedDBStorage)</text>
      <text y="66" fill="#4b5563">65   })</text>
    </g>

    <!-- Micro-Compact Floating Review Control Bar (Cursor Style) -->
    <g transform="translate(20, 96)">
      <!-- Sleek, narrow container: height 32px (down from 42px) -->
      <rect width="460" height="32" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
      
      <!-- Status text & diff counts -->
      <text x="12" y="20" class="font-mono txt-bold" font-size="10" fill="#a855f7">index.ts</text>
      <text x="70" y="20" class="font-sans txt-muted" font-size="10">1 chunk pending</text>
      
      <!-- Clean separators -->
      <line x1="165" y1="8" x2="165" y2="24" stroke="#1f2937" stroke-width="1"/>

      <g transform="translate(178, 4)">
        <!-- Discard / Reject: Flat text link with micro keycap, no red pill -->
        <text x="0" y="16" class="font-sans txt-bold" fill="#ef4444" font-size="10.5" cursor="pointer">Reject</text>
        <rect x="36" y="5" width="18" height="12" rx="2" fill="#2d1515" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.3"/>
        <text x="45" y="13" class="font-sans txt-bold" font-size="7" fill="#fca5a5" text-anchor="middle">⌫</text>

        <text x="68" y="16" class="font-sans txt-muted" font-size="10.5">|</text>

        <!-- Ask to edit: Flat link -->
        <text x="82" y="16" class="font-sans txt-muted" font-size="10.5" cursor="pointer">Modify</text>
        
        <text x="128" y="16" class="font-sans txt-muted" font-size="10.5">|</text>

        <!-- Accept Button (The ONLY highlighted action pill in the entire bar) -->
        <rect x="142" y="2" width="76" height="20" rx="4" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="170" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10" text-anchor="middle">Accept</text>
        
        <!-- Compact key indicator -->
        <rect x="196" y="6" width="18" height="12" rx="2" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.5"/>
        <text x="205" y="14" class="font-sans txt-bold" font-size="7" fill="#22d3ee" text-anchor="middle">⏎</text>
      </g>
    </g>
  </g>

  <!-- ==================== FLOW 2: TERMINAL COMMAND EXECUTOR ==================== -->
  <g transform="translate(32, 230)">
    <text x="0" y="12" class="font-sans lbl-flow">02 • TERMINAL SHELL SECURITY GATEWAY (MICRO-COMPACT CARD)</text>
    
    <g transform="translate(20, 24)">
      <!-- Warning Header -->
      <polygon points="4,10 8,17 0,17" fill="#f59e0b"/>
      <text x="14" y="14" class="font-sans txt-bold" fill="#f59e0b" font-size="10.5">Security confirmation required</text>
      
      <!-- Command Code -->
      <text x="0" y="34" class="font-mono txt-bold" font-size="11.5" fill="#cbd5e1">npm run build --workspace=desktop</text>

      <!-- Options Control Links (Compact, inline options) -->
      <g transform="translate(0, 52)">
        <!-- Decline (Crimson Text, no pill) -->
        <text x="0" y="16" class="font-sans txt-bold" fill="#ef4444" font-size="10.5" cursor="pointer">Deny</text>
        
        <text x="36" y="16" class="font-sans txt-muted" font-size="10.5">|</text>

        <!-- Force sandbox (Slate Gray Text, no pill) -->
        <text x="50" y="16" class="font-sans txt-muted" font-size="10.5" cursor="pointer">Run in Sandbox</text>
        
        <text x="136" y="16" class="font-sans txt-muted" font-size="10.5">|</text>

        <!-- Approve (The ONLY highlighted action pill) -->
        <rect x="150" y="2" width="128" height="20" rx="4" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="214" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10" text-anchor="middle">Approve and run</text>
      </g>
    </g>
  </g>
</svg>
