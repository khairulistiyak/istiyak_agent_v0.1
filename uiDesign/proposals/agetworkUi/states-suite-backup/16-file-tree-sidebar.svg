<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (File Tree Sidebar) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">WORKSPACE FILE EXPLORER SIDEBAR</text>
    <text x="290" y="11" class="font-sans txt-muted">/</text>
    <text x="304" y="12" class="font-mono subtitle">16_SIDEBAR_FILETREE_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== FILE EXPLORER TREE (ZEN MINIMAL LAYOUT) ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">ISTIYAK_AGENT_V0.1 (MONOREPO ROOT)</text>
    
    <g transform="translate(12, 26)">
      <!-- Directory Tree Guide Lines -->
      <line x1="6" y1="8" x2="6" y2="218" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
      <line x1="26" y1="52" x2="26" y2="188" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
      <line x1="46" y1="96" x2="46" y2="160" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>

      <!-- Node 1: apps/ -->
      <g transform="translate(0, 0)">
        <line x1="6" y1="12" x2="16" y2="12" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
        <path d="M20 9H24L26 11H34V19H20V9Z" fill="#b45309" stroke="#b45309" stroke-width="0.5"/>
        <text x="38" y="16" class="font-sans txt-bold">apps/</text>
      </g>

      <!-- Node 2: apps/desktop/ -->
      <g transform="translate(20, 22)">
        <line x1="6" y1="12" x2="16" y2="12" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
        <path d="M20 9H24L26 11H34V19H20V9Z" fill="#b45309" stroke="#b45309" stroke-width="0.5"/>
        <text x="38" y="16" class="font-sans txt-bold">desktop/</text>
      </g>

      <!-- Node 3: apps/desktop/src/ -->
      <g transform="translate(40, 44)">
        <line x1="6" y1="12" x2="16" y2="12" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
        <path d="M20 9H24L26 11H34V19H20V9Z" fill="#b45309" stroke="#b45309" stroke-width="0.5"/>
        <text x="38" y="16" class="font-sans txt-bold">src/</text>
      </g>

      <!-- Node 4: apps/desktop/src/components/ChatUI.tsx (Untracked - Green) -->
      <g transform="translate(60, 66)">
        <line x1="6" y1="12" x2="16" y2="12" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
        <rect x="20" y="6" width="18" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="0.5"/>
        <text x="22" y="15" class="font-mono txt-bold" font-size="7.5" fill="#22d3ee">TSX</text>
        <text x="44" y="16" class="font-sans txt-bold" fill="#10b981">ChatUI.tsx</text>
        
        <rect x="636" y="4" width="16" height="15" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
        <text x="644" y="14" class="font-mono txt-bold" font-size="8" fill="#34d399" text-anchor="middle">U</text>
      </g>

      <!-- Node 5: apps/desktop/src/store/index.ts (Modified - Yellow) -->
      <g transform="translate(60, 88)">
        <line x1="6" y1="12" x2="16" y2="12" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
        <rect x="20" y="6" width="14" height="12" rx="2" fill="#3178c6" fill-opacity="0.1" stroke="#3178c6" stroke-width="0.5"/>
        <text x="22" y="15" class="font-mono txt-bold" font-size="7.5" fill="#38bdf8">TS</text>
        <text x="40" y="16" class="font-sans txt-bold" fill="#eab308">index.ts</text>
        
        <rect x="636" y="4" width="16" height="15" rx="3" fill="#451a03" stroke="#d97706" stroke-width="0.5"/>
        <text x="644" y="14" class="font-mono txt-bold" font-size="8" fill="#fbbf24" text-anchor="middle">M</text>
      </g>

      <!-- Node 6: packages/ -->
      <g transform="translate(0, 196)">
        <line x1="6" y1="12" x2="16" y2="12" stroke="#1f2937" stroke-width="1.25" stroke-opacity="0.5"/>
        <path d="M20 9H24L26 11H34V19H20V9Z" fill="#b45309" stroke="#b45309" stroke-width="0.5"/>
        <text x="38" y="16" class="font-sans txt-bold">packages/</text>
      </g>
    </g>

    <line x1="0" y1="262" x2="736" y2="262" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Bottom sidebar telemetry indicators -->
    <g transform="translate(0, 276)">
      <text x="0" y="12" class="font-sans lbl-flow">GIT COMPONENT METRICS</text>
      <text x="0" y="28" class="font-sans txt-muted">Working Tree: <tspan fill="#eab308" font-weight="bold">1 Modified</tspan> | <tspan fill="#10b981" font-weight="bold">1 Untracked</tspan> | Workspace Sync: <tspan fill="#ffffff">OK (localhost:3001)</tspan></text>
      
      <!-- Close button matching suite -->
      <g transform="translate(620, 14)">
        <rect width="116" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="58" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Close Sidebar</text>
      </g>
    </g>
  </g>
</svg>
