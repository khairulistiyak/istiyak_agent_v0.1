<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Micro-Compact, Translucent pills match) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">CONTEXT SELECTOR PALETTE</text>
    <text x="230" y="11" class="font-sans txt-muted">/</text>
    <text x="244" y="12" class="font-mono subtitle">13_CONTEXT_SELECTOR_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== CONTENT ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Active Prompt Input Bar with '@' symbol -->
    <g transform="translate(0, 0)">
      <rect width="736" height="34" rx="4" fill="#11131e" stroke="#1f2937" stroke-width="0.75"/>
      <circle cx="16" cy="17" r="3.5" fill="#00f3ff"/>
      <text x="28" y="21" class="font-sans txt-main" fill="#ffffff">Ask companion about <tspan fill="#00f3ff" font-weight="bold">@</tspan></text>
      <line x1="140" y1="10" x2="140" y2="24" stroke="#00f3ff" stroke-width="1.25"/> <!-- Blink cursor -->
      <text x="724" y="21" class="font-sans txt-muted" text-anchor="end">⌘K</text>
    </g>

    <!-- Floating context suggestions popup (Zen list) -->
    <g transform="translate(0, 48)">
      
      <!-- Option 1: File Reference (index.ts) -->
      <g transform="translate(0, 0)">
        <rect width="736" height="36" rx="4" fill="#0c1926" stroke="#06b6d4" stroke-width="0.75"/>
        <circle cx="16" cy="18" r="2.5" fill="#06b6d4"/>
        <text x="32" y="22" class="font-mono txt-bold" fill="#00f3ff">src/store/index.ts</text>
        <text x="200" y="22" class="font-sans txt-muted">Add active state storage file to context buffer</text>
        
        <!-- file tag -->
        <rect x="660" y="10" width="60" height="16" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="690" y="21" class="font-sans" fill="#9ca3af" font-size="8" font-weight="bold" text-anchor="middle">FILE [TS]</text>
      </g>

      <!-- Option 2: File Reference (AgentRunner.ts) -->
      <g transform="translate(0, 42)">
        <rect width="736" height="36" rx="4" fill="#090a10" stroke="#121215" stroke-width="0.5"/>
        <text x="32" y="22" class="font-mono txt-bold">packages/agent-core/src/agent/AgentRunner.ts</text>
        <text x="340" y="22" class="font-sans txt-muted">Brain execution loop driver</text>
        
        <rect x="660" y="10" width="60" height="16" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="690" y="21" class="font-sans" fill="#9ca3af" font-size="8" font-weight="bold" text-anchor="middle">FILE [TS]</text>
      </g>

      <!-- Option 3: Git status reference -->
      <g transform="translate(0, 84)">
        <rect width="736" height="36" rx="4" fill="#090a10" stroke="#121215" stroke-width="0.5"/>
        <text x="32" y="22" class="font-mono txt-bold" fill="#38bdf8">git_diff</text>
        <text x="100" y="22" class="font-sans txt-muted">Attach current workspace modified lines diff comparison</text>
        
        <rect x="660" y="10" width="60" height="16" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="690" y="21" class="font-sans" fill="#38bdf8" font-size="8" font-weight="bold" text-anchor="middle">GIT LOG</text>
      </g>

      <!-- Option 4: Web Search Query option -->
      <g transform="translate(0, 126)">
        <rect width="736" height="36" rx="4" fill="#090a10" stroke="#121215" stroke-width="0.5"/>
        <text x="32" y="22" class="font-mono txt-bold" fill="#f59e0b">google_search</text>
        <text x="140" y="22" class="font-sans txt-muted">Trigger external web search reference target</text>
        
        <rect x="660" y="10" width="60" height="16" rx="3" fill="#1e293b" stroke="#1f2937" stroke-width="0.5"/>
        <text x="690" y="21" class="font-sans" fill="#fbbf24" font-size="8" font-weight="bold" text-anchor="middle">WEB ENG</text>
      </g>
    </g>

    <line x1="0" y1="228" x2="736" y2="228" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Bottom navigation and close options -->
    <g transform="translate(0, 244)">
      <text x="0" y="12" class="font-sans lbl-flow">NAVIGATION SHORTCUTS</text>
      <text x="0" y="28" class="font-sans txt-muted">Use <tspan fill="#ffffff" font-weight="bold">↑↓</tspan> keys to navigate suggestions, <tspan fill="#ffffff" font-weight="bold">⏎</tspan> key to select &amp; attach to context, <tspan fill="#ffffff" font-weight="bold">Esc</tspan> to close popup.</text>
      
      <!-- Close button matching suite -->
      <g transform="translate(620, 14)">
        <rect width="116" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="58" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Close Panel</text>
      </g>
    </g>
  </g>
</svg>
