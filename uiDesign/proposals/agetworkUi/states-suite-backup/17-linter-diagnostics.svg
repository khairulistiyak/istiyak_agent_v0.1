<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Linter Diagnostics Card) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
      
      .pulse { animation: blink 2.5s infinite ease-in-out; }
      @keyframes blink {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#ef4444"/>
    <text x="24" y="12" class="font-sans title" fill="#ffffff">COMPILER DIAGNOSTICS &amp; ERROR TRACER</text>
    <text x="290" y="11" class="font-sans txt-muted">/</text>
    <text x="304" y="12" class="font-mono subtitle">17_LINTER_DIAGNOSTICS_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== DIAGNOSTICS CARD (BORDERLESS RED THEMED WARNING CARD) ==================== -->
  <g transform="translate(32, 80)">
    
    <!-- Header Warning Card -->
    <g transform="translate(0, 0)">
      <rect width="736" height="48" rx="6" fill="#2d1313" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.75"/>
      <circle cx="20" cy="24" r="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.5" class="pulse"/>
      <line x1="18" y1="20" x2="22" y2="28" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="22" y1="20" x2="18" y2="28" stroke="#ffffff" stroke-width="1.2"/>
      
      <text x="36" y="22" class="font-sans txt-bold" fill="#ef4444">Lint compilation check failed - 1 error found</text>
      <text x="36" y="36" class="font-sans txt-main" font-size="11" fill="#fca5a5">Type 'StateStorage' is not assignable to type 'Storage'. Property 'getItem' is missing in type.</text>
    </g>

    <!-- Error line code preview -->
    <g transform="translate(0, 72)">
      <text x="0" y="12" class="font-sans lbl-flow">ERROR FILE LOCATION: SRC/STORE/INDEX.TS:L64</text>
      
      <!-- Code preview block -->
      <g transform="translate(0, 24)" class="font-mono" font-size="10.5">
        <text y="15" fill="#4b5563">62   export const useChatStore = create(</text>
        <text y="32" fill="#4b5563">63     persist( (set) =&gt; ({ messages: [] }), {</text>
        
        <!-- Error line red underline highlight -->
        <rect x="0" y="38" width="736" height="18" fill="#7f1d1d" fill-opacity="0.15"/>
        <text y="49" fill="#cbd5e1">64       storage: createJSONStorage(() =&gt; localStorage)</text>
        <text y="58" fill="#ef4444" font-weight="bold">                ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</text>
        <text y="70" fill="#ef4444" font-size="9" font-weight="bold">                [tsc: error TS2322] Type 'StateStorage' is not assignable...</text>
        
        <text y="88" fill="#4b5563">65     })</text>
      </g>
    </g>

    <line x1="0" y1="230" x2="736" y2="230" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Linter suggestion Action buttons -->
    <g transform="translate(0, 252)">
      <text x="0" y="12" class="font-sans lbl-flow">COMPILER SUGGESTED ACTIONS</text>
      
      <g transform="translate(432, 12)">
        <!-- Ignore (Translucent Slate Gray Pill) -->
        <rect x="0" y="0" width="130" height="24" rx="12" fill="#1f2937" fill-opacity="0.15" stroke="#1f2937" stroke-width="0.75"/>
        <text x="65" y="15" class="font-sans txt-bold" fill="#a3a3a3" font-size="10" text-anchor="middle">Ignore diagnostics</text>

        <!-- Auto Fix (Translucent Cyan Pill) -->
        <rect x="140" y="0" width="164" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="212" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Auto-repair error (⏎)</text>
      </g>
    </g>
  </g>
</svg>
