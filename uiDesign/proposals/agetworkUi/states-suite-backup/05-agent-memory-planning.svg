<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-Minimal Premium Zen Palette -->
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 600; fill: #ffffff; font-size: 13px; letter-spacing: -0.01em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-tool { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #d4d4d8; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
      
      .pulse { animation: zenglow 2.5s infinite ease-in-out; }
      @keyframes zenglow {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Clean dark backdrop -->
  <rect width="800" height="600" rx="8" fill="#050508"/>
  <rect x="0.5" y="0.5" width="799" height="599" rx="7.5" stroke="#121215" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" class="font-sans title">Memory, Planning and Delegation Tools Spec</text>
    <text x="270" y="12" class="font-sans txt-muted">/</text>
    <text x="281" y="14" class="font-mono subtitle">05_COGNITIVE_ENGINE</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#121215" stroke-width="1"/>
  </g>

  <!-- ==================== read_memory / write_memory / compress_memory / summarize_memory ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-tool">01 • read_memory / write_memory / compress_memory / summarize_memory</text>
    <circle cx="6" cy="28" r="2.5" fill="#3b82f6"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#3b82f6">Memory checkpoint logged:</text>
    <text x="190" y="32" class="font-sans txt-muted">Stored in workspace semantic index</text>
    <text x="20" y="52" class="font-sans txt-main">Successfully resolved localStorage overflow error by implementing Zustand IndexedDB storage driver.</text>
  </g>

  <!-- ==================== create_plan / update_plan / reflect / walkthrough ==================== -->
  <g transform="translate(32, 200)">
    <text x="0" y="12" class="font-sans lbl-tool">02 • create_plan / update_plan / reflect / walkthrough</text>
    <circle cx="6" cy="28" r="2.5" fill="#10b981"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#10b981">Task Roadmap updated:</text>
    <text x="160" y="32" class="font-sans txt-muted">Active timeline checklist (3 steps mapped)</text>
    
    <g transform="translate(20, 52)">
      <text x="0" y="12" class="font-sans txt-main" fill="#10b981">✓  Step 1: Scanned workspace and read store/index.ts file</text>
      <text x="0" y="28" class="font-sans txt-main" fill="#a855f7">•  Step 2: Modify Zustand storage persist mechanism to IndexedDB (80% complete)</text>
      <text x="0" y="44" class="font-sans txt-muted">•  Step 3: Run compilation verification build</text>
    </g>
  </g>

  <!-- ==================== delegate_agent / spawn_sub_agent / merge_result ==================== -->
  <g transform="translate(32, 380)">
    <text x="0" y="12" class="font-sans lbl-tool">03 • delegate_agent / spawn_sub_agent / merge_result</text>
    <circle cx="6" cy="28" r="2.5" fill="#a855f7" class="pulse"/>
    <text x="20" y="32" class="font-sans txt-bold" fill="#c084fc">Delegated sub-agent thread:</text>
    <text x="195" y="32" class="font-mono txt-main">sub-agent-7704</text>
    <text x="310" y="32" class="font-sans txt-muted">Status: Active</text>

    <!-- Sub-timeline details -->
    <g transform="translate(20, 52)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#121215" stroke-width="1.5"/>
      <g transform="translate(10, 0)" class="font-sans" font-size="11">
        <text y="12" class="font-sans txt-bold" fill="#93c5fd">Task: "Verify local database migrations schema"</text>
        <text y="26" class="font-sans txt-muted">Sub-agent is scanning schema.prisma and verifying type assertions (2 steps completed)</text>
      </g>
    </g>
  </g>
</svg>
