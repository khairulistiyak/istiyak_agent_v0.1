<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Mode Architecture Theme Palette (Code Block Widget) -->
    <linearGradient id="solid-bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060b"/>
      <stop offset="100%" stop-color="#0c0d15"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .subtitle { font-weight: 500; fill: #52525b; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-flow { font-weight: 600; fill: #52525b; font-size: 9px; letter-spacing: 0.08em; }
      .txt-main { font-weight: 400; fill: #cbd5e1; font-size: 11.5px; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 11.5px; }
      .txt-muted { font-weight: 400; fill: #52525b; font-size: 10.5px; }
    </style>
  </defs>

  <!-- Clean dark backdrop matching architecture style -->
  <rect width="800" height="420" rx="12" fill="url(#solid-bg)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <polygon points="5,0 13,0 17,7 13,14 5,14 0,7" fill="#06b6d4"/>
    <text x="24" y="12" class="font-sans title">CHAT FEED CODE BLOCK WIDGET</text>
    <text x="250" y="11" class="font-sans txt-muted">/</text>
    <text x="264" y="12" class="font-mono subtitle">18_CHAT_CODEBLOCK_SPEC</text>
    <line x1="0" y1="26" x2="736" y2="26" stroke="#1f2937" stroke-width="0.75"/>
  </g>

  <!-- ==================== MAIN CONTENT (CODE BLOCK WIDGET) ==================== -->
  <g transform="translate(32, 80)">
    <text x="0" y="12" class="font-sans lbl-flow">MARKDOWN IN-FEED CODE BLOCK (WITH COPY STATES)</text>
    
    <!-- Code block wrapper -->
    <rect y="22" width="736" height="280" rx="4" fill="#08090f" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Code block Header bar (translucent dark) -->
    <rect y="22" width="736" height="26" fill="#11131e" rx="3"/>
    <text x="12" y="38" class="font-mono txt-bold" font-size="9" fill="#00f3ff">typescript</text>
    
    <!-- Copy Actions on the right (Showing both idle and copied success states) -->
    <g transform="translate(560, 23)">
      <!-- Copy button state (Idle) -->
      <g transform="translate(0, 0)">
        <rect width="70" height="18" rx="3" fill="#1f2937" fill-opacity="0.15" stroke="#1f2937" stroke-width="0.5"/>
        <!-- File System rule note: using built-in system icons by simply placing text / triggers -->
        <text x="35" y="12" class="font-sans txt-muted" font-size="9.5" text-anchor="middle" fill="#a3a3a3">Copy Code</text>
      </g>
      
      <!-- Copy button state (Copied Success - Green) -->
      <g transform="translate(80, 0)">
        <rect width="80" height="18" rx="3" fill="#064e3b" fill-opacity="0.15" stroke="#10b981" stroke-width="0.5"/>
        <text x="40" y="12" class="font-sans txt-bold" font-size="9.5" fill="#34d399" text-anchor="middle">✓ Copied</text>
      </g>
    </g>

    <!-- Code Block Body (Sample implementation syntax) -->
    <g transform="translate(16, 68)" class="font-mono" font-size="11">
      <text y="15" fill="#9ca3af"><tspan fill="#a855f7">import</tspan> { StateStorage } <tspan fill="#a855f7">from</tspan> <tspan fill="#10b981">'zustand/middleware'</tspan>;</text>
      <text y="32" fill="#9ca3af"><tspan fill="#a855f7">import</tspan> { get, set, del } <tspan fill="#a855f7">from</tspan> <tspan fill="#10b981">'idb-keyval'</tspan>;</text>
      
      <text y="64" fill="#9ca3af"><tspan fill="#a855f7">export const</tspan> indexedDBStorage: StateStorage = {</text>
      <text y="81" fill="#cbd5e1">  getItem: <tspan fill="#3b82f6">async</tspan> (name) <tspan fill="#a855f7">=&gt;</tspan> (<tspan fill="#3b82f6">await</tspan> get(name)) || <tspan fill="#3b82f6">null</tspan>,</text>
      <text y="98" fill="#cbd5e1">  setItem: <tspan fill="#3b82f6">async</tspan> (name, value) <tspan fill="#a855f7">=&gt;</tspan> <tspan fill="#3b82f6">await</tspan> set(name, value),</text>
      <text y="115" fill="#cbd5e1">  removeItem: <tspan fill="#3b82f6">async</tspan> (name) <tspan fill="#a855f7">=&gt;</tspan> <tspan fill="#3b82f6">await</tspan> del(name),</text>
      <text y="132" fill="#9ca3af">};</text>
    </g>

    <line x1="0" y1="316" x2="736" y2="316" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>

    <!-- Dynamic instructions for developers -->
    <g transform="translate(0, 332)">
      <text x="0" y="12" class="font-sans lbl-flow">DESIGN HIGHLIGHTS FOR CODE SNIPPETS</text>
      <text x="0" y="28" class="font-sans txt-main">1. In-feed code blocks must render inside a dark `#08090f` slate card with custom syntax coloring.</text>
      <text x="0" y="44" class="font-sans txt-main">2. The Copy button toggle should provide instant visual feedback (changing to green "✓ Copied" for 2 seconds).</text>

      <!-- Done close button matching Zen style -->
      <g transform="translate(620, 18)">
        <rect width="116" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.75"/>
        <text x="58" y="15" class="font-sans txt-bold" fill="#22d3ee" font-size="10.5" text-anchor="middle">Close Panel</text>
      </g>
    </g>
  </g>
</svg>
