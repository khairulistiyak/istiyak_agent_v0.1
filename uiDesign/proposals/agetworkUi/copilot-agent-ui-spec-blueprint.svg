<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyber Dark Theme Palette & Glowing Gradients -->
    <linearGradient id="main-bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0c0f17"/>
    </linearGradient>
    <linearGradient id="neon-cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="neon-amber-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "Fira Code", "SF Mono", Monaco, Menlo, Consolas, monospace; }
      
      /* Typography */
      .title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .sub-title { font-weight: 600; fill: #6b7280; font-size: 9px; letter-spacing: 0.1em; }
      .txt-bright { font-weight: 600; fill: #f3f4f6; font-size: 11.5px; }
      .txt-normal { font-weight: 400; fill: #9ca3af; font-size: 11.5px; }
      .txt-dim { font-weight: 400; fill: #4b5563; font-size: 11px; }
      .txt-code { font-weight: 400; fill: #cbd5e1; font-size: 10px; }
      
      /* Status Colors */
      .color-read { fill: #38bdf8; }
      .color-write { fill: #a855f7; }
      .color-success { fill: #10b981; }
      .color-warn { fill: #f59e0b; }
      .color-error { fill: #ef4444; }

      .pulse { animation: status-glow 2s infinite ease-in-out; }
      @keyframes status-glow {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="900" rx="12" fill="url(#main-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="899" rx="11.5" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(0, 0)">
    <rect width="1200" height="56" fill="#070913" stroke="#1f2937" stroke-width="0.75"/>
    
    <!-- OS Control Dots -->
    <circle cx="20" cy="28" r="5" fill="#ef4444"/>
    <circle cx="36" cy="28" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="28" r="5" fill="#10b981"/>

    <!-- Breadcrumbs -->
    <g transform="translate(80, 18)">
      <polygon points="4,0 12,0 16,7 12,14 4,14 0,7" fill="url(#neon-cyan-grad)"/>
      <text x="24" y="12" class="font-sans title">ChatUI SPECIFICATION BLUEPRINT</text>
      <text x="270" y="11" class="font-sans txt-dim">/</text>
      <text x="285" y="12" class="font-mono txt-bright">state-flow: full_telemetry</text>
    </g>

    <!-- Global API / Session Stats Telemetry -->
    <g transform="translate(680, 14)">
      <!-- Cost Tracker -->
      <text x="0" y="11" class="font-sans sub-title">SESSION COST</text>
      <text x="0" y="25" class="font-mono txt-bright" fill="#10b981">$0.00428</text>

      <!-- Token Speeds -->
      <text x="120" y="11" class="font-sans sub-title">THROUGHPUT</text>
      <text x="120" y="25" class="font-mono txt-bright">85.4 tok/s</text>

      <!-- Latency Dial -->
      <text x="230" y="11" class="font-sans sub-title">ROUND-TRIP</text>
      <text x="230" y="25" class="font-mono txt-bright" fill="#06b6d4">180ms</text>

      <!-- Connection State -->
      <rect x="340" y="4" width="130" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
      <circle cx="352" cy="16" r="3.5" fill="#10b981" class="pulse"/>
      <text x="362" y="20" class="font-sans" fill="#34d399" font-size="9" font-weight="bold">DAEMON CORE V3</text>
    </g>
  </g>

  <!-- ==================== LEFT SIDEBAR: AGENT RUNNER CONTROL & PROGRESS (Width: 440) ==================== -->
  <g transform="translate(0, 56)">
    <rect width="440" height="844" fill="#080a14" stroke="#1f2937" stroke-width="0.75"/>

    <!-- Section Title: Execution Timeline -->
    <g transform="translate(24, 20)">
      <text x="0" y="12" class="font-sans sub-title">AGENT RUNTIME LOG PIPELINE</text>
      <line x1="0" y1="20" x2="392" y2="20" stroke="#1f2937" stroke-width="0.75"/>
    </g>

    <!-- TIMELINE DETAIL FLOW (Showing every state/event explicitly) -->
    <g transform="translate(24, 60)">
      <line x1="8" y1="12" x2="8" y2="480" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- 1. ACTION: scan_project [STATUS: Success] -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="4.5" fill="#10b981" stroke="#047857" stroke-width="1"/>
        <text x="24" y="11" class="font-sans txt-bright">Step 1: scan_project</text>
        <text x="24" y="25" class="font-sans txt-normal" font-size="10.5">Scanned root directories for workspace mapping.</text>
        
        <!-- Metadata pills -->
        <g transform="translate(24, 32)">
          <rect width="70" height="15" rx="3" fill="#1e293b"/>
          <text x="35" y="11" class="font-mono txt-dim" font-size="8" text-anchor="middle" fill="#9ca3af">status: OK</text>
          
          <rect x="76" y="0" width="70" height="15" rx="3" fill="#1e293b"/>
          <text x="111" y="11" class="font-mono txt-dim" font-size="8" text-anchor="middle" fill="#9ca3af">time: 140ms</text>
        </g>
      </g>

      <!-- 2. ACTION: read_file [STATUS: Success] -->
      <g transform="translate(0, 68)">
        <circle cx="8" cy="8" r="4.5" fill="#10b981" stroke="#047857" stroke-width="1"/>
        <text x="24" y="11" class="font-sans txt-bright" fill="#38bdf8">Step 2: read_file (Target File)</text>
        <text x="24" y="25" class="font-mono txt-normal" font-size="10" fill="#cbd5e1">PATH: apps/desktop/src/store/index.ts</text>
        
        <!-- Metadata details -->
        <g transform="translate(24, 32)">
          <rect width="82" height="15" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="0.5"/>
          <text x="41" y="11" class="font-mono" font-size="8" text-anchor="middle" fill="#38bdf8" font-weight="bold">READ FILE</text>
          
          <rect x="88" y="0" width="60" height="15" rx="3" fill="#1e293b"/>
          <text x="118" y="11" class="font-mono txt-dim" font-size="8" text-anchor="middle" fill="#9ca3af">size: 14.8KB</text>

          <rect x="154" y="0" width="60" height="15" rx="3" fill="#1e293b"/>
          <text x="184" y="11" class="font-mono txt-dim" font-size="8" text-anchor="middle" fill="#9ca3af">time: 180ms</text>
        </g>
      </g>

      <!-- 3. ACTION: precise_edit [STATUS: Active Writing 84%] -->
      <g transform="translate(0, 136)">
        <circle cx="8" cy="8" r="6.5" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
        <circle cx="8" cy="8" r="2.5" fill="#a855f7" class="pulse" filter="url(#glow-cyan)"/>
        
        <text x="24" y="11" class="font-sans txt-bright" fill="#c084fc">Step 3: precise_edit (Applying modifications)</text>
        <text x="24" y="25" class="font-mono txt-normal" font-size="10" fill="#e9d5ff">TARGET: src/store/index.ts</text>
        
        <!-- Live indicators & write metrics card -->
        <g transform="translate(24, 34)">
          <rect width="368" height="188" rx="8" fill="#120c22" stroke="#6b21a8" stroke-width="1" stroke-opacity="0.8"/>
          <!-- Active step header bar -->
          <rect width="368" height="24" fill="#1e1135" rx="7"/>
          <circle cx="12" cy="12" r="3.5" fill="#a855f7" class="pulse"/>
          <text x="22" y="16" class="font-sans title" font-size="9" fill="#d8b4fe">LIVE WRITE STREAM METRICS</text>
          <text x="356" y="16" class="font-mono" fill="#a855f7" font-size="9" font-weight="bold" text-anchor="end">84% WRITTEN</text>

          <g transform="translate(12, 36)">
            <!-- Specific lines details -->
            <text x="0" y="12" class="font-sans txt-normal" font-size="10.5">Lines: <tspan fill="#10b981">+148 additions</tspan> | <tspan fill="#ef4444">-43 deletions</tspan></text>
            <text x="0" y="26" class="font-sans txt-normal" font-size="10.5">Vercel AI SDK Mode: <tspan fill="#cbd5e1" font-weight="bold">streamText / ReAct</tspan></text>
            <text x="0" y="40" class="font-sans txt-normal" font-size="10.5">Active Chunk: <tspan fill="#d8b4fe" font-weight="bold">4 / 5 chunks</tspan></text>
            <line x1="0" y1="48" x2="344" y2="48" stroke="#3b0764" stroke-width="0.75"/>

            <!-- Streaming parser status values -->
            <text x="0" y="64" class="font-sans sub-title" fill="#a855f7">LATEST PARSED DIFF CHUNK</text>
            <rect y="72" width="344" height="64" rx="4" fill="#07040d" stroke="#3b0764" stroke-width="0.5"/>
            <g transform="translate(8, 76)" class="font-mono" font-size="9.5">
              <text y="12" fill="#10b981">+ storage: createJSONStorage(</text>
              <text y="24" fill="#10b981">+   () =&gt; indexedDBStorage</text>
              <text y="36" fill="#10b981">+ )</text>
              <text y="48" fill="#52525b">  // end of chunk 4</text>
            </g>
          </g>
        </g>
      </g>

      <!-- 4. ACTION: run_command [STATUS: Pending User Approval Gate] -->
      <g transform="translate(0, 370)">
        <circle cx="8" cy="8" r="6.5" fill="#3f1a07" stroke="#f59e0b" stroke-width="1.5"/>
        <polygon points="8,5 11,11 5,11" fill="#f59e0b" class="pulse"/>
        
        <text x="24" y="11" class="font-sans txt-bright" fill="#f59e0b">Step 4: run_command (Safety Check)</text>
        <text x="24" y="25" class="font-sans txt-normal" font-size="10.5">Executing compiler verification tests</text>
        
        <!-- Command approval gate metadata -->
        <g transform="translate(24, 32)">
          <rect width="108" height="15" rx="3" fill="#451a03" stroke="#d97706" stroke-width="0.5"/>
          <text x="54" y="11" class="font-mono" font-size="8" text-anchor="middle" fill="#fbbf24" font-weight="bold">PENDING APPROVAL</text>
          
          <rect x="114" y="0" width="112" height="15" rx="3" fill="#1e293b"/>
          <text x="170" y="11" class="font-mono txt-dim" font-size="8" text-anchor="middle" fill="#9ca3af">command: npm run build</text>
        </g>
      </g>

      <!-- 5. ACTION: done [STATUS: Queued] -->
      <g transform="translate(0, 434)">
        <circle cx="8" cy="8" r="4.5" fill="#11131e" stroke="#1f2937" stroke-width="1.5"/>
        <text x="24" y="11" class="font-sans txt-dim">Step 5: done (End Session)</text>
        <text x="24" y="24" class="font-sans txt-dim" font-size="10.5">Verify result and commit</text>
      </g>
    </g>

    <!-- Quota Warning and Local Storage Limits details -->
    <g transform="translate(24, 760)">
      <rect width="392" height="58" rx="6" fill="#1c0f0f" stroke="#7f1d1d" stroke-width="0.75"/>
      <polygon points="18,20 23,29 13,29" fill="#ef4444" class="pulse"/>
      <text x="32" y="24" class="font-sans" fill="#fca5a5" font-size="11" font-weight="bold">SYSTEM QUOTA TELEMETRY</text>
      <text x="32" y="38" class="font-sans txt-normal" font-size="10" fill="#fca5a5">Tauri WebKit LocalStorage has exceeded limit (5.0MB).</text>
      <text x="32" y="48" class="font-sans txt-normal" font-size="10" fill="#fca5a5">Auto-migration module active: Redirecting writes to IndexedDB.</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: SYSTEM WORKSPACE, CODE DIFF AND TERMINAL (Width: 760) ==================== -->
  <g transform="translate(440, 56)">
    <rect width="760" height="844" fill="#05070c" stroke="#1f2937" stroke-width="0.75"/>
    <line x1="0" y1="0" x2="0" y2="844" stroke="#1f2937" stroke-width="0.75"/>

    <!-- Tab indicators bar -->
    <g transform="translate(0, 0)">
      <rect width="760" height="38" fill="#070913" stroke="#1f2937" stroke-width="0.75"/>
      
      <!-- Selected Tab: index.ts -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" fill="#05070c" stroke="#1f2937" stroke-width="0.5"/>
        <line x1="0" y1="37" x2="180" y2="37" stroke="#0ea5e9" stroke-width="2"/>
        <text x="24" y="23" class="font-sans txt-bright" fill="#06b6d4">src/store/index.ts</text>
        
        <!-- Live writing dot -->
        <circle cx="160" cy="18" r="3.5" fill="#a855f7" class="pulse"/>
      </g>

      <!-- Other tabs -->
      <g transform="translate(180, 0)">
        <text x="24" y="23" class="font-sans txt-normal" fill="#4b5563">App.tsx</text>
        <line x1="100" y1="0" x2="100" y2="38" stroke="#1f2937" stroke-width="0.75"/>
      </g>
    </g>

    <!-- Side-by-Side Code Diff Reviewer Grid -->
    <g transform="translate(0, 38)">
      <!-- Left Split: BEFORE -->
      <g transform="translate(0, 0)">
        <rect width="380" height="520" fill="#05070c" stroke="#1f2937" stroke-width="0.5"/>
        <rect width="380" height="24" fill="#090c15" stroke="#1f2937" stroke-width="0.5"/>
        <text x="16" y="16" class="font-sans sub-title">ORIGINAL (BEFORE)</text>
        
        <!-- Code lines -->
        <g transform="translate(16, 40)" class="font-mono" font-size="10">
          <g fill="#4b5563" text-anchor="end">
            <text x="12" y="15">62</text>
            <text x="12" y="32">63</text>
            <text x="12" y="49">64</text>
            <text x="12" y="66">65</text>
            <text x="12" y="83">66</text>
            <text x="12" y="100">67</text>
            <text x="12" y="117">68</text>
          </g>
          
          <g transform="translate(24, 0)">
            <text y="15" fill="#9ca3af">export const useChatStore = create(</text>
            <text y="32" fill="#9ca3af">  persist(</text>
            <text y="49" fill="#9ca3af">    (set) =&gt; ({</text>
            <text y="66" fill="#9ca3af">      messages: [],</text>
            <text y="83" fill="#9ca3af">    }),</text>
            
            <rect x="-6" y="90" width="326" height="34" fill="#7f1d1d" fill-opacity="0.25"/>
            <text y="100" fill="#f87171">-   {</text>
            <text y="117" fill="#f87171">-     name: "chat-storage",</text>
          </g>
        </g>
      </g>

      <!-- Right Split: AFTER -->
      <g transform="translate(380, 0)">
        <rect width="380" height="520" fill="#05070c" stroke="#1f2937" stroke-width="0.5"/>
        <rect width="380" height="24" fill="#090c15" stroke="#1f2937" stroke-width="0.5"/>
        <text x="16" y="16" class="font-sans sub-title" fill="#10b981">MODIFIED (AFTER)</text>

        <!-- Code lines -->
        <g transform="translate(16, 40)" class="font-mono" font-size="10">
          <g fill="#4b5563" text-anchor="end">
            <text x="12" y="15">62</text>
            <text x="12" y="32">63</text>
            <text x="12" y="49">64</text>
            <text x="12" y="66">65</text>
            <text x="12" y="83">66</text>
            <text x="12" y="100">67</text>
            <text x="12" y="117">68</text>
            <text x="12" y="134">69</text>
            <text x="12" y="151">70</text>
          </g>

          <g transform="translate(24, 0)">
            <text y="15" fill="#9ca3af">export const useChatStore = create(</text>
            <text y="32" fill="#9ca3af">  persist(</text>
            <text y="49" fill="#9ca3af">    (set) =&gt; ({</text>
            <text y="66" fill="#9ca3af">      messages: [],</text>
            <text y="83" fill="#9ca3af">    }),</text>
            
            <rect x="-6" y="90" width="326" height="68" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.3"/>
            <text y="100" fill="#34d399" font-weight="600">+   {</text>
            <text y="117" fill="#34d399" font-weight="600">+     name: "chat-storage",</text>
            <text y="134" fill="#34d399" font-weight="600">+     storage: createJSONStorage(</text>
            <text y="151" fill="#34d399" font-weight="600">+       () =&gt; indexedDBStorage</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Separator for Terminal -->
    <line x1="0" y1="558" x2="760" y2="558" stroke="#1f2937" stroke-width="0.75"/>

    <!-- ==================== SECURITY GATE / PERMISSION DIALOG ==================== -->
    <g transform="translate(24, 574)">
      <rect width="712" height="136" rx="8" fill="#1c1106" stroke="#d97706" stroke-width="1.25" filter="url(#glow-amber)"/>
      <!-- Header bar inside Warning card -->
      <rect width="712" height="26" fill="#2d1c10" rx="7"/>
      <polygon points="12,7 17,16 7,16" fill="#d97706" class="pulse"/>
      <text x="24" y="16" class="font-sans title" font-size="9.5" fill="#f59e0b">PENDING HUMAN-IN-THE-LOOP AUTHORIZATION</text>
      
      <!-- Command info and warning parameters -->
      <g transform="translate(16, 38)">
        <text x="0" y="12" class="font-mono txt-dim" fill="#f59e0b" fill-opacity="0.8">ACTION: run_command (Verify compilation environment)</text>
        <text x="0" y="27" class="font-mono txt-bright" font-size="12">npm run build --workspace=desktop</text>
        <text x="0" y="42" class="font-sans txt-normal" font-size="10.5">Executing compiler to verify Zustand storage type safety. Run outside Sandbox: <tspan fill="#ef4444" font-weight="bold">TRUE</tspan></text>

        <!-- Dynamic Action buttons -->
        <g transform="translate(0, 56)">
          <!-- Decline Button -->
          <rect x="0" y="0" width="160" height="28" rx="14" fill="#3b1d1d" stroke="#ef4444" stroke-width="0.5"/>
          <text x="80" y="17" class="font-sans" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">Discard modifications</text>

          <!-- Override Sandbox option -->
          <rect x="176" y="0" width="180" height="28" rx="14" fill="#1e130c" stroke="#d97706" stroke-width="0.5"/>
          <text x="266" y="17" class="font-sans" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Override Sandbox settings</text>

          <!-- Approve Button -->
          <rect x="372" y="0" width="180" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
          <text x="462" y="17" class="font-sans" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Approve and Execute command</text>
        </g>
      </g>
    </g>

    <!-- ==================== RUNNING TERMINAL / COMPILER OUTPUT ==================== -->
    <g transform="translate(24, 726)">
      <rect width="712" height="100" rx="6" fill="#040508" stroke="#1f2937" stroke-width="0.75"/>
      <rect width="712" height="20" fill="#090a0f" rx="5"/>
      <text x="12" y="13" class="font-sans sub-title">LIVE COMPILATION CONSOLE</text>

      <g transform="translate(12, 32)" class="font-mono" font-size="10">
        <text y="12" fill="#52525b">[tsc] apps/desktop/src/store/index.ts: compiling type assertions...</text>
        <text y="26" fill="#10b981">[tsc] compiled successfully. No implicit target errors.</text>
        <text y="40" fill="#cbd5e1">[vite] building desktop client environment... (Vite v7.0.4)</text>
        <text y="54" fill="#38bdf8">[vite] built desktop client in 2.18s | dist/assets/index.js (517.2KB)</text>
      </g>
    </g>
  </g>
</svg>
