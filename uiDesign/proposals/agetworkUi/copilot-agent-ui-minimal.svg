<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvas-bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060709"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .font-mono { font-family: "SF Mono", SFMono-Regular, Consolas, monospace; }
      
      /* Typographical Hierarchy */
      .lbl-section { font-weight: 600; fill: #4b5563; font-size: 10px; letter-spacing: 0.05em; }
      .lbl-file-active { font-weight: 500; fill: #f3f4f6; font-size: 12px; }
      .lbl-file-inactive { font-weight: 400; fill: #6b7280; font-size: 12px; }
      .lbl-step-title { font-weight: 500; fill: #e5e7eb; font-size: 13px; }
      .lbl-step-muted { font-weight: 400; fill: #9ca3af; font-size: 12px; }
      
      /* Animation */
      .glow-pulse { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse {
        0% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.5; transform: scale(0.95); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" rx="16" fill="url(#canvas-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="799" rx="15.5" stroke="#1f2937" stroke-opacity="0.3"/>

  <!-- ==================== HEADER BAR (Minimal borderless) ==================== -->
  <g transform="translate(40, 30)">
    <!-- macOS style window buttons -->
    <circle cx="0" cy="6" r="4.5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="14" cy="6" r="4.5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="28" cy="6" r="4.5" fill="#34d399" fill-opacity="0.8"/>
    
    <!-- Title / Breadcrumb -->
    <g transform="translate(60, 0)">
      <circle cx="6" cy="6" r="5" fill="url(#accent-purple)"/>
      <text x="20" y="10" class="font-sans" fill="#e5e7eb" font-size="13" font-weight="600">Istiyak Copilot</text>
      <text x="120" y="9" class="font-sans" fill="#4b5563" font-size="11">/</text>
      <text x="132" y="10" class="font-mono" fill="#9ca3af" font-size="11">istiyak_agent_v0.1</text>
    </g>

    <!-- State Indicator -->
    <g transform="translate(1010, 0)">
      <circle cx="0" cy="6" r="3" fill="#10b981"/>
      <text x="10" y="10" class="font-sans" fill="#10b981" font-size="10" font-weight="600" letter-spacing="0.02em">AGENT ONLINE</text>
    </g>
  </g>

  <!-- Divider line below header -->
  <line x1="40" y1="64" x2="1160" y2="64" stroke="#1f2937" stroke-opacity="0.3" stroke-width="0.75"/>

  <!-- ==================== LEFT COLUMN: FILE EXPLORER (Width: 240) ==================== -->
  <g transform="translate(40, 96)">
    <text x="0" y="10" class="font-sans lbl-section">WORKING SET</text>
    
    <!-- File tree list (highly compact, zero boxes) -->
    <g transform="translate(0, 28)">
      
      <!-- File 1: store/index.ts (Active reading) -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="10" r="3" fill="#38bdf8" class="glow-pulse"/>
        <text x="22" y="14" class="font-sans lbl-file-active">store/index.ts</text>
        <text x="22" y="27" class="font-sans" fill="#4b5563" font-size="9">Reading file...</text>
      </g>

      <!-- File 2: chatSlice.ts (Completed) -->
      <g transform="translate(0, 48)">
        <circle cx="6" cy="10" r="3" fill="#10b981"/>
        <text x="22" y="14" class="font-sans lbl-file-inactive">chatSlice.ts</text>
        <text x="140" y="14" class="font-mono" fill="#10b981" font-size="9" font-weight="600">+42 -12</text>
      </g>

      <!-- File 3: settingsStore.ts (Completed) -->
      <g transform="translate(0, 84)">
        <circle cx="6" cy="10" r="3" fill="#6b7280"/>
        <text x="22" y="14" class="font-sans lbl-file-inactive">settingsStore.ts</text>
      </g>

      <!-- File 4: App.tsx (Active writing) -->
      <g transform="translate(0, 120)">
        <circle cx="6" cy="10" r="3" fill="#a855f7" class="glow-pulse"/>
        <text x="22" y="14" class="font-sans lbl-file-active">App.tsx</text>
        <text x="22" y="27" class="font-sans" fill="#a855f7" font-size="9" font-weight="600">Writing changes (84%)</text>
      </g>

      <!-- File 5: package.json (Queued) -->
      <g transform="translate(0, 168)">
        <circle cx="6" cy="10" r="3" fill="#4b5563" fill-opacity="0.3"/>
        <text x="22" y="14" class="font-sans lbl-file-inactive" fill-opacity="0.5">package.json</text>
      </g>
    </g>

    <!-- Clean Session Metrics -->
    <g transform="translate(0, 480)">
      <text x="0" y="10" class="font-sans lbl-section">SESSION DATA</text>
      
      <g transform="translate(0, 24)">
        <text x="0" y="12" class="font-sans" fill="#6b7280" font-size="11">Files read</text>
        <text x="200" y="12" class="font-mono" fill="#e5e7eb" font-size="11" text-anchor="end">12</text>

        <text x="0" y="32" class="font-sans" fill="#6b7280" font-size="11">Files modified</text>
        <text x="200" y="32" class="font-mono" fill="#e5e7eb" font-size="11" text-anchor="end">3</text>

        <text x="0" y="52" class="font-sans" fill="#6b7280" font-size="11">Lines written</text>
        <text x="200" y="52" class="font-mono" fill="#10b981" font-size="11" font-weight="600" text-anchor="end">+148</text>

        <text x="0" y="72" class="font-sans" fill="#6b7280" font-size="11">Lines deleted</text>
        <text x="200" y="72" class="font-mono" fill="#ef4444" font-size="11" font-weight="600" text-anchor="end">-43</text>
      </g>
    </g>
  </g>

  <!-- Divider line separating sidebar and content -->
  <line x1="280" y1="96" x2="280" y2="740" stroke="#1f2937" stroke-opacity="0.2" stroke-width="0.75"/>

  <!-- ==================== RIGHT COLUMN: TIMELINE AND STEPS ==================== -->
  <g transform="translate(320, 96)">
    
    <!-- User Instruction context card (Minimalist, borderless, just contrasting background) -->
    <g transform="translate(0, 0)">
      <rect width="840" height="48" rx="6" fill="#0b0c10"/>
      <circle cx="20" cy="24" r="8" fill="#3b82f6" fill-opacity="0.1"/>
      <text x="20" y="27" class="font-sans" fill="#3b82f6" font-size="9" font-weight="bold" text-anchor="middle">U</text>
      
      <text x="40" y="28" class="font-sans" fill="#e5e7eb" font-size="12" font-weight="500">Migrate store from localStorage to IndexedDB with automatic backup import logic.</text>
      <text x="820" y="28" class="font-sans lbl-section" text-anchor="end">GOAL</text>
    </g>

    <!-- Steps Timeline -->
    <g transform="translate(0, 72)">
      <!-- Main vertical timeline guide line -->
      <line x1="10" y1="12" x2="10" y2="460" stroke="#1f2937" stroke-opacity="0.5" stroke-width="1"/>

      <!-- STEP 1: COMPLETED -->
      <g transform="translate(0, 0)">
        <!-- Circle index -->
        <circle cx="10" cy="14" r="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
        <circle cx="10" cy="14" r="1.5" fill="#10b981"/>
        
        <text x="28" y="17" class="font-sans lbl-step-title">Workspace file analysis</text>
        <text x="28" y="32" class="font-sans lbl-step-muted">Read store/index.ts to determine state store dependencies.</text>
        <text x="820" y="16" class="font-sans" fill="#6b7280" font-size="11" text-anchor="end">240ms</text>
      </g>

      <!-- STEP 2: COMPLETED -->
      <g transform="translate(0, 56)">
        <circle cx="10" cy="14" r="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
        <circle cx="10" cy="14" r="1.5" fill="#10b981"/>
        
        <text x="28" y="17" class="font-sans lbl-step-title">Solution architecture design</text>
        <text x="28" y="32" class="font-sans lbl-step-muted">Formulated custom IndexedDB driver with localStorage fallbacks.</text>
        <text x="820" y="16" class="font-sans" fill="#6b7280" font-size="11" text-anchor="end">120ms</text>
      </g>

      <!-- STEP 3: ACTIVE CODE MODIFICATION -->
      <g transform="translate(0, 112)">
        <!-- Pulsing active circle -->
        <circle cx="10" cy="16" r="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
        <circle cx="10" cy="16" r="2.5" fill="#a855f7" class="glow-pulse"/>
        
        <text x="28" y="20" class="font-sans lbl-step-title" fill="#c084fc">Writing IndexedDB store driver</text>
        <text x="820" y="19" class="font-sans" fill="#c084fc" font-size="11" font-weight="600" text-anchor="end">Active (84%)</text>
        
        <!-- Clean, borderless code box -->
        <g transform="translate(28, 36)">
          <rect width="792" height="200" rx="8" fill="#08090b" stroke="#1f2937" stroke-opacity="0.5" stroke-width="0.75"/>
          
          <!-- Inner Code text -->
          <g transform="translate(16, 12)">
            <!-- Header/Path indicator -->
            <text x="0" y="14" class="font-mono lbl-section">FILE CHANGES: store/index.ts</text>
            <line x1="0" y1="24" x2="760" y2="24" stroke="#1f2937" stroke-opacity="0.3" stroke-width="0.5"/>
            
            <g transform="translate(0, 32)">
              <!-- Code diff lines -->
              <text x="0" y="16" class="font-mono" fill="#ef4444" font-size="11">- import { persist } from "zustand/middleware";</text>
              <text x="0" y="34" class="font-mono" fill="#10b981" font-size="11">+ import { persist, createJSONStorage, StateStorage } from "zustand/middleware";</text>
              <text x="0" y="52" class="font-mono" fill="#10b981" font-size="11">+ const indexedDBStorage: StateStorage = {</text>
              <text x="0" y="70" class="font-mono" fill="#10b981" font-size="11">+   getItem: async (name) =&gt; {</text>
              <text x="0" y="88" class="font-mono" fill="#10b981" font-size="11">+     const value = await new Promise((resolve) =&gt; { ... });</text>
              <text x="0" y="106" class="font-mono" fill="#10b981" font-size="11">+     return value || localStorage.getItem(name);</text>
              <text x="0" y="124" class="font-mono" fill="#10b981" font-size="11">+   },</text>
              <text x="0" y="142" class="font-mono" fill="#9ca3af" font-size="11">    setItem: async (name, value) =&gt; { ... }</text>
            </g>
          </g>
        </g>
      </g>

      <!-- STEP 4: QUEUED -->
      <g transform="translate(0, 368)">
        <circle cx="10" cy="14" r="5" fill="#4b5563" fill-opacity="0.2" stroke="#4b5563" stroke-width="1"/>
        
        <text x="28" y="17" class="font-sans lbl-step-title" fill="#4b5563">Verify compiler build</text>
        <text x="28" y="32" class="font-sans" fill="#4b5563" font-size="12">Run compilation check: `npm run build` will verify syntax structure.</text>
        <text x="820" y="16" class="font-sans" fill="#4b5563" font-size="11" text-anchor="end">Queued</text>
      </g>
    </g>

    <!-- ==================== CONTROLS ACTIONS (Floating Clean pill) ==================== -->
    <g transform="translate(196, 608)">
      <rect width="448" height="42" rx="21" fill="#0d0e12" stroke="#1f2937" stroke-width="0.75"/>
      <circle cx="20" cy="21" r="3.5" fill="#a855f7" class="glow-pulse"/>
      <text x="32" y="25" class="font-sans font-bright" font-size="11">Writing store/index.ts</text>
      
      <!-- Mini Buttons -->
      <g transform="translate(240, 8)">
        <!-- Stop Button -->
        <rect x="0" y="0" width="56" height="26" rx="13" fill="#181a20" stroke="#374151" stroke-width="0.5"/>
        <text x="28" y="16" class="font-sans font-bright" font-size="10" font-weight="600" text-anchor="middle">Stop</text>

        <!-- Discard Button -->
        <rect x="62" y="0" width="68" height="26" rx="13" fill="#181a20" stroke="#374151" stroke-width="0.5"/>
        <text x="96" y="16" class="font-sans font-bright" font-size="10" font-weight="600" text-anchor="middle">Discard</text>

        <!-- Accept Button -->
        <rect x="136" y="0" width="60" height="26" rx="13" fill="#059669"/>
        <text x="166" y="16" class="font-sans" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Accept</text>
      </g>
    </g>
  </g>
</svg>
