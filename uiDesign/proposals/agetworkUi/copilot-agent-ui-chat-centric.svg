<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Chat Dark Theme Gradient -->
    <linearGradient id="chat-bg" x1="0" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080d"/>
      <stop offset="100%" stop-color="#0b0c14"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "Fira Code", "SF Mono", Monaco, Consolas, monospace; }
      
      /* Typography */
      .txt-title { font-weight: 700; fill: #ffffff; font-size: 13px; letter-spacing: 0.05em; }
      .txt-lbl { font-weight: 600; fill: #4b5563; font-size: 9px; letter-spacing: 0.1em; }
      .txt-msg { font-weight: 400; fill: #e5e5e5; font-size: 12px; line-height: 1.5; }
      .txt-bold { font-weight: 600; fill: #ffffff; font-size: 12px; }
      .txt-dim { font-weight: 400; fill: #52525b; font-size: 10.5px; }

      .pulse { animation: blink 2.5s infinite ease-in-out; }
      @keyframes blink {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="800" rx="12" fill="url(#chat-bg)"/>
  <rect x="0.5" y="0.5" width="599" height="799" rx="11.5" stroke="#1f222f" stroke-opacity="0.8"/>

  <!-- ==================== CHAT HEADER ==================== -->
  <g transform="translate(0, 0)">
    <rect width="600" height="56" fill="#07080d" stroke="#1f222f" stroke-width="0.75"/>
    
    <!-- OS buttons -->
    <circle cx="20" cy="28" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="28" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="28" r="4.5" fill="#10b981"/>

    <!-- Agent Identity Status -->
    <g transform="translate(76, 12)">
      <text x="0" y="14" class="font-sans txt-title">Istiyak AI Companion</text>
      <!-- Mode selection info -->
      <circle cx="4" cy="28" r="3" fill="#10b981" class="pulse"/>
      <text x="12" y="31" class="font-sans txt-dim" fill="#10b981" font-weight="bold">AGENT MODE ACTIVE</text>
    </g>

    <!-- Settings & Telemetry button -->
    <g transform="translate(480, 16)">
      <rect width="104" height="24" rx="12" fill="#12141c" stroke="#1f222f" stroke-width="0.5"/>
      <circle cx="490" cy="28" r="3.5" fill="#06b6d4"/>
      <text x="502" y="32" class="font-sans txt-bold" font-size="9" fill="#06b6d4" letter-spacing="0.05em">85 TOKENS/S</text>
    </g>
  </g>

  <!-- ==================== MESSAGE LIST TIMELINE ==================== -->
  <g transform="translate(24, 76)">
    
    <!-- 1. USER MESSAGE -->
    <g transform="translate(0, 0)">
      <text x="552" y="12" class="font-mono txt-lbl" fill="#52525b" text-anchor="end">USER</text>
      <!-- Message bubble -->
      <rect x="180" y="20" width="372" height="54" rx="8" fill="#161824" stroke="#1f222f" stroke-width="0.75"/>
      <text x="196" y="38" class="font-sans txt-msg">Modify Zustand state store to use IndexedDB</text>
      <text x="196" y="54" class="font-sans txt-msg">storage, and handle backup migration.</text>
    </g>

    <!-- 2. AGENT RESPONSE FLOW (Detailed, in-feed tool calls) -->
    <g transform="translate(0, 96)">
      <!-- Label -->
      <text x="0" y="12" class="font-mono txt-lbl" fill="#06b6d4">AGENT PIPELINE</text>
      
      <!-- Timeline line -->
      <line x1="8" y1="36" x2="8" y2="480" stroke="#1f222f" stroke-width="1.25" stroke-dasharray="3,3"/>

      <!-- Event A: File Context Scan (Success) -->
      <g transform="translate(0, 24)">
        <circle cx="8" cy="8" r="4" fill="#10b981" stroke="#047857" stroke-width="1"/>
        <text x="24" y="11" class="font-sans txt-bold" font-size="11.5">Scanned workspace context</text>
        <text x="24" y="24" class="font-sans txt-dim">Located 5 files in src/store/ (140ms)</text>
      </g>

      <!-- Event B: Read File index.ts (Success) -->
      <g transform="translate(0, 78)">
        <circle cx="8" cy="8" r="4" fill="#10b981" stroke="#047857" stroke-width="1"/>
        <text x="24" y="11" class="font-sans txt-bold" font-size="11.5" fill="#38bdf8">Read src/store/index.ts (14.8KB)</text>
        <text x="24" y="24" class="font-sans txt-dim">Loaded local file into LLM active context buffer (180ms)</text>
      </g>

      <!-- Event C: Live Writing File (Active 84%) -->
      <g transform="translate(0, 132)">
        <circle cx="8" cy="8" r="6" fill="#1e1035" stroke="#a855f7" stroke-width="1.25"/>
        <circle cx="8" cy="8" r="2.5" fill="#a855f7" class="pulse"/>
        
        <text x="24" y="11" class="font-sans txt-bold" font-size="11.5" fill="#c084fc">Writing modifications to store/index.ts</text>
        
        <!-- Live Code Diff block embedded directly inside Chat -->
        <g transform="translate(24, 22)">
          <rect width="328" height="136" rx="6" fill="#0d081b" stroke="#581c87" stroke-width="0.75"/>
          <rect width="328" height="18" fill="#170f2b" rx="5"/>
          <text x="12" y="12" class="font-mono txt-bold" font-size="8.5" fill="#d8b4fe">CODE GENERATOR (CHUNK 4/5 • 84%)</text>
          
          <g transform="translate(12, 30)" class="font-mono" font-size="9.5">
            <text y="14" fill="#ef4444">-   { name: "chat-storage" }</text>
            <text y="28" fill="#10b981">+   { name: "chat-storage",</text>
            <text y="42" fill="#10b981">+     storage: createJSONStorage(</text>
            <text y="56" fill="#10b981">+       () =&gt; indexedDBStorage</text>
            <text y="70" fill="#10b981">+     )</text>
            <text y="84" fill="#10b981">+   }</text>
            
            <line x1="0" y1="94" x2="304" y2="94" stroke="#3b0764" stroke-width="0.5"/>
            <text y="104" fill="#a1a1aa" font-size="8.5">Lines updated: +148 | -43 | 85.4 tok/s</text>
          </g>
        </g>
      </g>

      <!-- Event D: Pending Approval Gate (Active warning) -->
      <g transform="translate(0, 312)">
        <circle cx="8" cy="8" r="6" fill="#2d1305" stroke="#f59e0b" stroke-width="1.25"/>
        <polygon points="8,5 11,10 5,10" fill="#f59e0b" class="pulse"/>
        
        <text x="24" y="11" class="font-sans txt-bold" font-size="11.5" fill="#f59e0b">Pending compiler verification</text>
        
        <!-- Embedded approval gate inside chat -->
        <g transform="translate(24, 22)">
          <rect width="328" height="96" rx="6" fill="#1c0f05" stroke="#d97706" stroke-width="0.75" filter="url(#soft-glow)"/>
          <text x="12" y="18" class="font-mono txt-bold" font-size="8.5" fill="#fbbf24">SECURITY LOCK: execute_command</text>
          <text x="12" y="32" class="font-sans txt-msg" font-size="11">Allow running: <tspan font-family="monospace" fill="#ffffff">npm run build</tspan></text>
          <text x="12" y="46" class="font-sans txt-dim" fill="#fca5a5">Warning: Script executes shell command outside sandbox.</text>
          
          <!-- Actions buttons -->
          <g transform="translate(12, 58)">
            <!-- Deny -->
            <rect x="0" y="0" width="80" height="24" rx="12" fill="#3f1d1d" stroke="#ef4444" stroke-width="0.5"/>
            <text x="40" y="15" class="font-sans txt-bold" font-size="9" fill="#fca5a5" text-anchor="middle">Decline</text>

            <!-- Approve -->
            <rect x="90" y="0" width="214" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="0.5"/>
            <text x="197" y="15" class="font-sans txt-bold" font-size="9" fill="#ffffff" text-anchor="middle">Approve and Build</text>
          </g>
        </g>
      </g>

      <!-- Event E: Quota Warning Exception (Resolved inline) -->
      <g transform="translate(0, 444)">
        <circle cx="8" cy="8" r="4" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
        <text x="24" y="11" class="font-sans txt-bold" font-size="11.5" fill="#fca5a5">[Warning] WebKit QuotaExceededError</text>
        <text x="24" y="24" class="font-sans txt-dim" fill="#fca5a5">Zustand write quota limit exceeded. Swept storage and migrated to IndexedDB.</text>
      </g>
    </g>
  </g>

  <!-- ==================== CHAT BOTTOM INPUT FIELD ==================== -->
  <g transform="translate(24, 712)">
    <!-- Input pill container -->
    <rect width="552" height="52" rx="26" fill="#0d0f16" stroke="#1f222f" stroke-width="1"/>
    
    <!-- active indicator -->
    <circle cx="24" cy="26" r="3.5" fill="#06b6d4" class="pulse"/>
    <text x="40" y="30" class="font-sans txt-msg" fill="#737373">Ask companion to build or code...</text>

    <!-- Keyboard Shortcut -->
    <rect x="496" y="17" width="38" height="18" rx="4" fill="#161824" stroke="#1f222f" stroke-width="0.5"/>
    <text x="515" y="29" class="font-sans txt-dim" font-size="9" font-weight="bold" text-anchor="middle">⌘ K</text>
  </g>
</svg>
