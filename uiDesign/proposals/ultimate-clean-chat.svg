<svg width="400" height="680" viewBox="0 0 400 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Matte Slate-Black Container -->
  <rect width="400" height="680" rx="16" fill="#050506" stroke="#121215" stroke-width="1.2"/>

  <!-- ==================== HEADER (Borderless Contrast) ==================== -->
  <rect x="0" y="0" width="400" height="55" rx="16" fill="#020202" />
  <!-- Green status dot -->
  <circle cx="360" cy="27" r="2.5" fill="#10b981" />
  <!-- Avatar -->
  <circle cx="35" cy="27" r="9" fill="#050506" stroke="#ffffff" stroke-width="1"/>
  <circle cx="35" cy="27" r="3" fill="#10b981" />
  <text x="56" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff" letter-spacing="0.5">Companion</text>
  <text x="135" y="30" font-family="monospace" font-size="8.5" fill="#555558">[zen]</text>

  <!-- ==================== CONVERSATION LOGS ==================== -->
  <g transform="translate(24, 85)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" letter-spacing="0.1">
    
    <!-- User Query -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" font-family="monospace" font-size="8.5" fill="#555558" font-weight="bold">YOU</text>
      <text x="0" y="26" fill="#ffffff">Scan project folders, identify tools,</text>
      <text x="0" y="40" fill="#ffffff">and verify the execution workflow.</text>
    </g>

    <!-- RAG context -->
    <g transform="translate(0, 60)">
      <rect width="350" height="24" rx="3" fill="#08100e" stroke="#0e2a24" stroke-width="0.5"/>
      <text x="8" y="15" font-family="monospace" font-size="8" fill="#10b981">RAG: packages/agent-core/src/agent/AgentWorkflow.ts</text>
    </g>

    <!-- Companion Response -->
    <g transform="translate(0, 100)">
      <text x="0" y="10" font-family="monospace" font-size="8.5" fill="#38bdf8" font-weight="bold">COMPANION</text>
      <text x="0" y="26" fill="#88888c">Workflow script located. I will review the planner core,</text>
      <text x="0" y="40" fill="#88888c">check sandbox policies, and run compiler tests.</text>
    </g>

    <!-- Active Task Checklist Card -->
    <g transform="translate(0, 160)">
      <rect width="352" height="120" fill="#08080a" stroke="#121215" stroke-width="0.8" />
      <text x="12" y="16" font-family="monospace" font-size="8" fill="#555558" font-weight="bold">WORKFLOW PROGRESS</text>
      
      <g transform="translate(12, 32)" font-family="monospace" font-size="8.5" fill="#555558">
        <text x="0" y="12" fill="#10b981">✓ Scan workspace directories</text>
        <text x="0" y="26" fill="#ffffff">⌛ Read target core files</text>
        <text x="0" y="40" fill="#333336">☐ Run terminal compilation test</text>
      </g>
      
      <!-- Progress Bar -->
      <g transform="translate(12, 85)">
        <rect width="328" height="2" fill="#121215" />
        <rect width="195" height="2" fill="#ffffff" opacity="0.6" />
        <text x="0" y="14" font-family="monospace" font-size="7.5" fill="#3a3a3c">step: 2/3  |  progress: 60%</text>
      </g>
    </g>

    <!-- Metrics -->
    <g transform="translate(0, 305)" font-family="monospace" font-size="8.5" fill="#3a3a3c">
      <text x="0" y="10">queries: 8</text>
      <text x="0" y="20">latency: 410ms</text>
      <text x="0" y="30">cost: $0.001842 USD</text>
    </g>
  </g>

  <!-- ==================== PROMPT INPUT FIELD ==================== -->
  <g transform="translate(24, 610)">
    <line x1="0" y1="0" x2="352" y2="0" stroke="#121215" stroke-width="0.8"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#3c3c43">Write message...</text>
    <!-- Flashing cursor line -->
    <line x1="90" y1="13" x2="90" y2="26" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
