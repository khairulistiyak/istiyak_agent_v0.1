<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" style="background:#090a0f; font-family:'Outfit',sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="appsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>
    <linearGradient id="pkgsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b172a" />
      <stop offset="100%" stop-color="#120f1c" />
    </linearGradient>
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <drop-shadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="50" y="60" fill="url(#headerGrad)" font-size="28" font-weight="800" letter-spacing="1">ISTIYAK COMPANION MONOREPO ARCHITECTURE</text>
  <text x="50" y="85" fill="#64748b" font-size="14">Ultra-Structured File-level Package Topology and Dependencies</text>

  <!-- Apps Container -->
  <rect x="50" y="130" width="410" height="600" rx="16" fill="url(#appsGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="70" y="150" width="80" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" />
  <text x="110" y="166" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">APPS /</text>
  
  <!-- App Nodes -->
  <!-- desktop -->
  <g transform="translate(70, 190)">
    <rect width="370" height="110" rx="12" fill="#121520" stroke="#06b6d4" stroke-width="1.5" />
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">desktop (Tauri Frontend)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Floating widget overlay in Tauri &amp; React</text>
    <text x="20" y="75" fill="#64748b" font-size="11">Chat UI, IDE panels, Window Hooks, Zustand store</text>
    <circle cx="350" cy="55" r="5" fill="#06b6d4" />
  </g>
  <!-- local-daemon -->
  <g transform="translate(70, 315)">
    <rect width="370" height="110" rx="12" fill="#121520" stroke="#06b6d4" stroke-width="1" />
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">local-daemon (Node.js Service)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Local loopback listener server on port 3001</text>
    <text x="20" y="75" fill="#64748b" font-size="11">RAG APIs, Git checkout helper, Command executes</text>
    <circle cx="350" cy="55" r="5" fill="#06b6d4" />
  </g>
  <!-- saas-backend -->
  <g transform="translate(70, 440)">
    <rect width="370" height="110" rx="12" fill="#121520" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">saas-backend (Express Cloud)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Stripe integration &amp; Passport OAuth2 endpoint</text>
    <text x="20" y="75" fill="#64748b" font-size="11">Connected to Atlas DB, Ephemeral Docker Sandbox</text>
  </g>
  <!-- landing -->
  <g transform="translate(70, 565)">
    <rect width="370" height="110" rx="12" fill="#121520" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">landing (Next.js Marketing)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Landing page &amp; customer billing portals</text>
    <text x="20" y="75" fill="#64748b" font-size="11">Next.js App router static compiled site</text>
  </g>

  <!-- Packages Container -->
  <rect x="540" y="130" width="410" height="600" rx="16" fill="url(#pkgsGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="560" y="150" width="110" height="24" rx="12" fill="#7c3aed" fill-opacity="0.2" />
  <text x="615" y="166" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">PACKAGES /</text>

  <!-- Package Nodes -->
  <!-- agent-core -->
  <g transform="translate(560, 190)">
    <rect width="370" height="150" rx="12" fill="#121520" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="700">agent-core (🧠 Brain)</text>
    <text x="20" y="55" fill="#a78bfa" font-size="12">Main Agent Loop: Thought → Act → Correct</text>
    <text x="20" y="80" fill="#94a3b8" font-size="11">Includes: AgentRunner, GeminiProvider, cost tracker,</text>
    <text x="20" y="98" fill="#94a3b8" font-size="11">file scan tools, process manager, prompt templates</text>
    <rect x="20" y="115" width="80" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="60" y="128" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">TypeScript</text>
    <circle cx="15" cy="51" r="5" fill="#8b5cf6" />
  </g>

  <!-- Other Packages (Horizontal Stacked List) -->
  <g transform="translate(560, 360)">
    <rect width="370" height="315" rx="12" fill="#121520" stroke="#1e293b" stroke-width="1" />
    <!-- agent-tools -->
    <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="700">agent-tools</text>
    <text x="20" y="47" fill="#64748b" font-size="11">Tool contexts, schemas &amp; validator models</text>
    <line x1="20" y1="62" x2="350" y2="62" stroke="#1e293b" stroke-width="1" />
    
    <!-- agent-memory -->
    <text x="20" y="85" fill="#f8fafc" font-size="13" font-weight="700">agent-memory</text>
    <text x="20" y="102" fill="#64748b" font-size="11">SQLite workspace records, RAG embedding clients</text>
    <line x1="20" y1="117" x2="350" y2="117" stroke="#1e293b" stroke-width="1" />
    
    <!-- agent-prompts -->
    <text x="20" y="140" fill="#f8fafc" font-size="13" font-weight="700">agent-prompts</text>
    <text x="20" y="157" fill="#64748b" font-size="11">System persona templates &amp; formatting rules</text>
    <line x1="20" y1="172" x2="350" y2="172" stroke="#1e293b" stroke-width="1" />
    
    <!-- agent-sdk -->
    <text x="20" y="195" fill="#f8fafc" font-size="13" font-weight="700">agent-sdk</text>
    <text x="20" y="212" fill="#64748b" font-size="11">WebSocket integration client to spin agents</text>
    <line x1="20" y1="227" x2="350" y2="227" stroke="#1e293b" stroke-width="1" />

    <!-- shared-types & shared-utils -->
    <text x="20" y="250" fill="#f8fafc" font-size="13" font-weight="700">shared-types &amp; shared-utils</text>
    <text x="20" y="267" fill="#64748b" font-size="11">Common TS classes &amp; cryptographic hash utilities</text>
  </g>

  <!-- Connective Arrows -->
  <!-- desktop -> agent-core -->
  <path d="M 440 245 L 560 245" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="560,245 550,240 550,250" fill="#06b6d4" />
  <rect x="465" y="225" width="70" height="18" rx="4" fill="#090a0f" stroke="#06b6d4" stroke-width="0.5" />
  <text x="500" y="237" fill="#06b6d4" font-size="9" font-weight="700" text-anchor="middle">Imports</text>

  <!-- local-daemon -> agent-core -->
  <path d="M 440 370 L 500 370 L 500 290 L 560 290" fill="none" stroke="#8b5cf6" stroke-width="2" />
  <polygon points="560,290 550,285 550,295" fill="#8b5cf6" />
  <rect x="465" y="315" width="70" height="18" rx="4" fill="#090a0f" stroke="#8b5cf6" stroke-width="0.5" />
  <text x="500" y="327" fill="#8b5cf6" font-size="9" font-weight="700" text-anchor="middle">Executes</text>

</svg>
