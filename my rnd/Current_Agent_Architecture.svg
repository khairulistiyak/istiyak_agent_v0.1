<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <!-- Definitions for Gradients, Shadows and Markers -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>

    <!-- UI Component Gradient (Cyan/Blue Glow) -->
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Engine Component Gradient (Teal/Emerald Glow) -->
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <!-- External Services Gradient (Purple/Violet Glow) -->
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>

    <!-- Storage Gradient -->
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Neon Glow Effects -->
    <filter id="cyanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
    <filter id="emeraldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="purpleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
    <filter id="amberGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)"/>
  <rect width="1000" height="800" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Grid Overlay for tech aesthetic -->
  <g opacity="0.05">
    <path d="M 0,100 L 1000,100 M 0,200 L 1000,200 M 0,300 L 1000,300 M 0,400 L 1000,400 M 0,500 L 1000,500 M 0,600 L 1000,600 M 0,700 L 1000,700" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100,0 L 100,800 M 200,0 L 200,800 M 300,0 L 300,800 M 400,0 L 400,800 M 500,0 L 500,800 M 600,0 L 600,800 M 700,0 L 700,800 M 800,0 L 800,800 M 900,0 L 900,800" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="2">
    ISTIYAK AI COMPANION — ACTIVE ARCHITECTURE
  </text>
  <text x="500" y="68" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
    রিয়েল-টাইম ডাটা ফ্লো এবং মডিউলার আর্কিটেকচার ম্যাপ
  </text>

  <!-- ==================== COLUMN 1: TAURI DESKTOP GUI ==================== -->
  <!-- Container border -->
  <rect x="40" y="100" width="260" height="520" rx="16" fill="url(#uiGrad)" stroke="#334155" stroke-width="2" filter="url(#cyanGlow)"/>
  <text x="170" y="130" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
    1. TAURI DESKTOP GUI
  </text>

  <!-- Chat UI Component -->
  <g transform="translate(60, 160)">
    <rect width="220" height="65" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="20" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ChatUI.tsx (React UI)</text>
    <text x="20" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">মেসেজ আদান প্রদান ও স্ট্রিমিং</text>
  </g>

  <!-- File Explorer Component -->
  <g transform="translate(60, 245)">
    <rect width="220" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">File Tree Explorer</text>
    <text x="20" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">প্রজেক্ট ফাইল ও Monaco Editor</text>
  </g>

  <!-- Terminal UI Component -->
  <g transform="translate(60, 330)">
    <rect width="220" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Terminal Console UI</text>
    <text x="20" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">লোকাল ও ডকার কমান্ড এন্ট্রি</text>
  </g>

  <!-- Settings UI Component -->
  <g transform="translate(60, 415)">
    <rect width="220" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Settings &amp; Theme Modal</text>
    <text x="20" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">এপিআই কি ও মডেল কনফিগারেশন</text>
  </g>
  
  <text x="170" y="605" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tauri Client (React/TS)</text>


  <!-- ==================== COLUMN 2: LOCAL NODE.JS ENGINE ==================== -->
  <!-- Container border -->
  <rect x="360" y="100" width="280" height="520" rx="16" fill="url(#engineGrad)" stroke="#115e59" stroke-width="2" filter="url(#emeraldGlow)"/>
  <text x="500" y="130" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
    2. NODE.JS LOCAL ENGINE
  </text>

  <!-- Express API Server -->
  <g transform="translate(380, 150)">
    <rect width="240" height="55" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Express API (agent2.js)</text>
    <text x="15" y="42" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">Port 3001 - সেন্ট্রাল গেটওয়ে রাউটার</text>
  </g>

  <!-- Agent Request Handler / runner.js -->
  <g transform="translate(380, 220)">
    <rect width="240" height="55" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Agent Runner (runner.js)</text>
    <text x="15" y="42" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">চ্যাট মেসেজ প্রসেসিং ও কনটেক্সট</text>
  </g>

  <!-- File Watcher / watcher.js -->
  <g transform="translate(380, 290)">
    <rect width="240" height="55" rx="8" fill="#022c22" stroke="#047857" stroke-width="1.2"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">FS Watcher (watcher.js)</text>
    <text x="15" y="42" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">TODO কমেন্ট স্ক্যান ও ফাইল লক ট্র্যাকিং</text>
  </g>

  <!-- Codebase Indexer / rag.js -->
  <g transform="translate(380, 360)">
    <rect width="240" height="55" rx="8" fill="#022c22" stroke="#047857" stroke-width="1.2"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Vector RAG (rag.js)</text>
    <text x="15" y="42" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">কোডবেজ সার্চ ও রিলেভেন্ট কোড ফাইন্ডার</text>
  </g>

  <!-- Local CLI Exec / tools/index.js -->
  <g transform="translate(380, 430)">
    <rect width="240" height="55" rx="8" fill="#022c22" stroke="#047857" stroke-width="1.2"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tools Bridge (tools/index.js)</text>
    <text x="15" y="42" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">ফাইল রাইটার ও ডকার রানার মেকানিজম</text>
  </g>

  <!-- Telemetry & Cost Tracker -->
  <g transform="translate(380, 500)">
    <rect width="240" height="55" rx="8" fill="#022c22" stroke="#047857" stroke-width="1.2"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Metrics Tracker &amp; Cost</text>
    <text x="15" y="42" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5">টোকেন স্পিড, রেসপন্স টাইম ও কস্ট ক্যালকুলেটর</text>
  </g>
  
  <text x="500" y="605" text-anchor="middle" fill="#0d9488" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Local Daemon (Node.js Express)</text>


  <!-- ==================== COLUMN 3: EXTERNAL SERVICES ==================== -->
  <!-- Container border -->
  <rect x="700" y="100" width="260" height="520" rx="16" fill="url(#extGrad)" stroke="#581c87" stroke-width="2" filter="url(#purpleGlow)"/>
  <text x="830" y="130" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
    3. EXTERNAL SERVICES
  </text>

  <!-- LLM Gateway -->
  <g transform="translate(720, 160)">
    <rect width="220" height="65" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="15" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">LLM Router (llm.js)</text>
    <text x="15" y="46" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">এপিআই অথেনটিকেশন ও মডেল রাউটিং</text>
  </g>

  <!-- AI API Providers -->
  <g transform="translate(720, 245)">
    <rect width="220" height="95" rx="10" fill="#1e1b4b" stroke="#4a044e" stroke-width="1.2"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI Foundation Models</text>
    <text x="15" y="45" fill="#e879f9" font-family="system-ui, sans-serif" font-size="9.5">● Google Gemini (Vertex AI / Studio)</text>
    <text x="15" y="60" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5">● Anthropic Claude 3.5 Sonnet</text>
    <text x="15" y="75" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5">● OpenAI GPT-4o &amp; Ollama Local</text>
  </g>

  <!-- Central MongoDB & Auth API -->
  <g transform="translate(720, 360)">
    <rect width="220" height="65" rx="10" fill="#1e1b4b" stroke="#4a044e" stroke-width="1.2"/>
    <text x="15" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SaaS DB Gateway (Port 3002)</text>
    <text x="15" y="46" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">ইউজার সাইন-ইন ও অ্যাক্টিভ লাইসেন্স চেক</text>
  </g>

  <!-- Sentry Crash Monitor -->
  <g transform="translate(720, 445)">
    <rect width="220" height="65" rx="10" fill="#1e1b4b" stroke="#4a044e" stroke-width="1.2"/>
    <text x="15" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Sentry &amp; OTA Updates</text>
    <text x="15" y="46" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">ক্র্যাশ মনিটরিং ও Tauri অটো আপডেট</text>
  </g>
  
  <text x="830" y="605" text-anchor="middle" fill="#7e22ce" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cloud API Integration</text>


  <!-- ==================== LOCAL CONFIG FILE ==================== -->
  <g transform="translate(360, 680)">
    <rect width="280" height="60" rx="12" fill="url(#storageGrad)" stroke="#4b5563" stroke-width="1.5" filter="url(#amberGlow)"/>
    <!-- Config file icon -->
    <path d="M 25,18 L 37,18 L 43,24 L 43,42 L 25,42 Z" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">~/.istiyak_agent_config.json</text>
    <text x="55" y="44" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10">লোকাল সেটিংস স্টোরেজ (গোপন এপিআই কী ও টোকেন)</text>
  </g>


  <!-- ==================== ARROWS AND CONNECTION FLOWS ==================== -->
  <!-- 1. ChatUI to Express API Server -->
  <path d="M 280,180 C 330,180 330,175 370,175" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="325" y="168" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="9" font-weight="600">/api/chat</text>

  <!-- 2. Terminal Console to run-command -->
  <path d="M 280,360 C 330,360 330,195 370,195" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="295" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">/run-command</text>

  <!-- 3. File Explorer scan request -->
  <path d="M 280,270 C 315,270 340,320 370,320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. RAG Context Injection to Runner -->
  <path d="M 500,360 L 500,285" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="545" y="325" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">RAG Context</text>

  <!-- 5. Runner to LLM Gateway -->
  <path d="M 620,240 C 660,240 670,195 710,195" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="665" y="210" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LLM Call</text>

  <!-- 6. LLM Gateway to Model Providers -->
  <path d="M 830,225 L 830,235" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 7. Local Settings Modal to JSON Config -->
  <path d="M 170,480 C 170,710 310,710 350,710" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="230" y="695" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Save Local Config</text>

  <!-- 8. Express to local config for token validation -->
  <path d="M 450,205 C 450,220 370,650 450,670" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- 9. Express to MongoDB (Auth check) -->
  <path d="M 620,185 C 660,185 670,390 710,390" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="665" y="315" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="8.5">License Check</text>

</svg>
